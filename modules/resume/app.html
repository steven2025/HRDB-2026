html[data-theme="mono"] .view-know .kb-card{border-radius:0!important}
html[data-theme="mono"] .view-know .kb-card:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 0 #111!important;border-color:#111!important}
html[data-theme="mono"] .view-know .kb-card::before{background:#111}
html[data-theme="mono"] .view-profile .pf-complete{border-radius:0;background:#fff;border:1px solid #E5E5E5}
html[data-theme="mono"] .view-profile .pf-bar{border-radius:0;border:1px solid #D4D4D4;background:#fff}
html[data-theme="mono"] .view-profile .pf-bar i{border-radius:0;background:#111;box-shadow:none}
html[data-theme="mono"] .view-profile .pf-pct{color:#111}
html[data-theme="mono"] .view-profile .pf-row{border-radius:0}
html[data-theme="mono"] .view-profile .pf-row .v{border-radius:0}
html[data-theme="mono"] .view-profile .pf-file{border-bottom:1px solid #E5E5E5}
html[data-theme="mono"] .view-profile .pf-file .fico{border-radius:0}
html[data-theme="mono"] .view-profile .pf-file .bg{border-radius:0}


/* ============================================================
   海外保障中心 v2 · 双栏 + 处置引导卡 + SOS 面板（三主题）
   ============================================================ */
.view-guard{padding:22px 24px 40px!important}
.vg-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vg-head h1{font-size:21px;font-weight:800;letter-spacing:-.3px;margin:0}
.vg-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.vg-live{
  margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  padding:4px 11px;border-radius:99px;background:var(--primary-weak);
  border:1px solid var(--border-2);font-size:11px;font-weight:650;color:var(--primary);
}
.vg-live i{width:6px;height:6px;border-radius:50%;background:var(--success);display:block;animation:vgBlink 2s infinite}
@keyframes vgBlink{0%,100%{opacity:1}50%{opacity:.3}}

.vg-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
@media(max-width:1080px){.vg-grid{grid-template-columns:1fr}}

.vg-sec-hd{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.vg-sec-hd h2{font-size:13.5px;font-weight:750;margin:0}
.vg-sec-hd .sub{font-size:11px;color:var(--text-3)}

/* ===== 处置引导卡 ===== */
.vg-guides{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
@media(max-width:760px){.vg-guides{grid-template-columns:1fr}}
.vg-guide{
  display:flex;align-items:flex-start;gap:12px;padding:16px;border-radius:13px;cursor:pointer;
  background:var(--surface);border:1px solid var(--border);position:relative;overflow:hidden;
  transition:transform .24s cubic-bezier(.2,.8,.3,1),border-color .24s,box-shadow .24s;
}
.vg-guide::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary);opacity:0;
  transition:opacity .24s;
}
.vg-guide:hover{
  transform:translateY(-3px) scale(1.012);
  border-color:var(--primary);
  box-shadow:0 14px 38px rgba(0,0,0,.4),0 0 0 1px var(--primary),0 0 26px var(--ai-glow);
}
.vg-guide:hover::before{opacity:1}
.vg-guide .vg-arrow{
  position:absolute;right:14px;top:50%;transform:translateY(-50%) translateX(-4px);
  color:var(--primary);opacity:0;transition:all .24s;
}
.vg-guide:hover .vg-arrow{opacity:1;transform:translateY(-50%)}
.vg-ico{
  width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:grid;place-items:center;
  border:1px solid var(--border-2);
}
.vg-ico-danger{background:rgba(248,113,113,.13);color:var(--danger);border-color:rgba(248,113,113,.3)}
.vg-ico-warn{background:rgba(240,180,41,.13);color:var(--warning);border-color:rgba(240,180,41,.3)}
.vg-ico-ok{background:rgba(74,222,128,.13);color:var(--success);border-color:rgba(74,222,128,.3)}
.vg-ico-info{background:var(--primary-weak);color:var(--primary);border-color:var(--border-2)}
.vg-guide-tx{flex:1;min-width:0;padding-right:14px}
.vg-guide-tx h3{font-size:13px;font-weight:750;margin:0 0 3px;color:var(--text)}
.vg-guide-tx p{font-size:11.5px;color:var(--text-3);line-height:1.65;margin:0}

/* ===== 备用金时间轴 ===== */
.vg-fund{
  background:var(--surface);border:1px solid var(--border);border-radius:13px;
  padding:15px 18px;margin-bottom:16px;
}
.vg-fund .vg-sec-hd{margin-bottom:8px}
.vg-timeline{position:relative;padding-left:22px;padding-top:6px}
.vg-timeline::before{
  content:"";position:absolute;left:5px;top:10px;bottom:8px;width:2px;
  background:linear-gradient(180deg,var(--primary),var(--primary-weak));
}
.vg-timeline:empty::before{display:none}
.vg-tl-item{position:relative;padding-bottom:16px}
.vg-tl-item:last-child{padding-bottom:0}
.vg-tl-dot{
  position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;
  background:var(--bg);border:2px solid var(--text-3);
}
.vg-tl-item.done .vg-tl-dot{border-color:var(--primary);background:var(--primary);box-shadow:0 0 10px var(--primary)}
.vg-tl-item.cur .vg-tl-dot{
  border-color:var(--primary);background:var(--bg);
  box-shadow:0 0 0 4px var(--primary-weak);animation:vgCur 2s ease-in-out infinite;
}
@keyframes vgCur{0%,100%{box-shadow:0 0 0 4px var(--primary-weak)}50%{box-shadow:0 0 0 8px transparent}}
.vg-tl-item.reject .vg-tl-dot{border-color:var(--danger);background:var(--danger)}
.vg-tl-t{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.vg-tl-d{font-size:11px;color:var(--text-3);line-height:1.6}
.vg-tl-tm{font-size:10px;color:var(--text-3);margin-top:2px;font-family:ui-monospace,monospace}

/* ===== 保单 / 培训 ===== */
.vg-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.vg-two{grid-template-columns:1fr}}
.vg-mini{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:13px 15px;transition:border-color .2s;
}
.vg-mini:hover{border-color:var(--border-strong)}
.vg-mini-hd{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:6px}
.vg-mini-b{font-size:11px;color:var(--text-3);line-height:1.6}

/* ===== 右：SOS 面板 ===== */
.vg-sos{
  background:linear-gradient(180deg,rgba(248,113,113,.07),transparent 42%),var(--surface);
  border:1px solid rgba(248,113,113,.26);border-radius:14px;padding:17px 18px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.vg-sos-hd{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.vg-sos-hd h2{font-size:14px;font-weight:800;margin:0;color:var(--text)}
.vg-sos-dot{
  width:9px;height:9px;border-radius:50%;background:var(--danger);
  box-shadow:0 0 0 3px rgba(248,113,113,.22);animation:vgSosPulse 2s ease-in-out infinite;
}
@keyframes vgSosPulse{0%,100%{box-shadow:0 0 0 3px rgba(248,113,113,.22)}50%{box-shadow:0 0 0 7px transparent}}
.vg-sos-badge{
  margin-left:auto;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:4px;
  background:rgba(248,113,113,.16);color:var(--danger);letter-spacing:.5px;
}
.vg-sos-desc{font-size:11.5px;color:var(--text-3);line-height:1.7;margin:0 0 14px}

.vg-hot{
  display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:11px;margin-bottom:8px;
  background:rgba(248,113,113,.09);border:1px solid rgba(248,113,113,.24);
  text-decoration:none;transition:all .2s;cursor:pointer;
}
.vg-hot:hover{
  background:rgba(248,113,113,.16);border-color:var(--danger);
  transform:translateX(3px);
  box-shadow:0 6px 20px rgba(248,113,113,.22);
}
.vg-hot-ico{
  width:32px;height:32px;flex:0 0 32px;border-radius:9px;display:grid;place-items:center;
  background:var(--danger);color:#fff;box-shadow:0 3px 12px rgba(248,113,113,.4);
}
.vg-hot-tx{flex:1;min-width:0;display:flex;flex-direction:column}
.vg-hot-l{font-size:11px;color:var(--text-2);margin-bottom:1px}
.vg-hot-n{font-size:13.5px;font-weight:800;color:var(--text);font-family:ui-monospace,monospace;letter-spacing:.3px}

.vg-sos-btn{
  width:100%;margin-top:6px;padding:11px;border:none;border-radius:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;
  background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);
  font-size:12.5px;font-weight:700;transition:all .18s;
}
.vg-sos-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-weak)}

.vg-note{
  display:flex;gap:9px;margin-top:12px;padding:11px 13px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--border);
}
.vg-note-ico{
  width:16px;height:16px;flex:0 0 16px;border-radius:50%;background:var(--primary-weak);
  color:var(--primary);font-size:10px;font-weight:800;display:grid;place-items:center;margin-top:1px;
}
.vg-note p{font-size:11px;color:var(--text-3);line-height:1.7;margin:0}

/* ===== 三主题微调 ===== */
html[data-theme="light"] .vg-guide,
html[data-theme="light"] .vg-fund,
html[data-theme="light"] .vg-mini{background:#fff}
html[data-theme="light"] .vg-guide:hover{box-shadow:0 14px 34px rgba(22,35,59,.14),0 0 0 1px #2563EB,0 0 24px rgba(37,99,235,.18)}
html[data-theme="light"] .vg-sos{background:linear-gradient(180deg,rgba(185,28,28,.05),transparent 42%),#fff;border-color:rgba(185,28,28,.28)}
html[data-theme="light"] .vg-hot{background:rgba(185,28,28,.05);border-color:rgba(185,28,28,.22)}
html[data-theme="light"] .vg-hot:hover{background:rgba(185,28,28,.1);border-color:#B91C1C}
html[data-theme="light"] .vg-hot-ico{background:#B91C1C;box-shadow:0 3px 10px rgba(185,28,28,.3)}

html[data-theme="mono"] .vg-guide,
html[data-theme="mono"] .vg-fund,
html[data-theme="mono"] .vg-mini,
html[data-theme="mono"] .vg-sos{border-radius:0;background:#fff;border:1px solid #E5E5E5;box-shadow:none}
html[data-theme="mono"] .vg-guide:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 0 #111;border-color:#111}
html[data-theme="mono"] .vg-guide::before{background:#111}
html[data-theme="mono"] .vg-ico{border-radius:0;border:1px solid #111;background:#fff;color:#111}
html[data-theme="mono"] .vg-live{border-radius:0;background:#fff;border:1px solid #111;color:#111}
html[data-theme="mono"] .vg-fund .btn,
html[data-theme="mono"] .vg-sos-btn,
html[data-theme="mono"] .vg-hot,
html[data-theme="mono"] .vg-hot-ico,
html[data-theme="mono"] .vg-note{border-radius:0}
html[data-theme="mono"] .vg-timeline::before{background:#111;width:1px}
html[data-theme="mono"] .vg-tl-dot{border-radius:0;border-color:#D4D4D4}
html[data-theme="mono"] .vg-tl-item.done .vg-tl-dot{background:#111;border-color:#111;box-shadow:none}
html[data-theme="mono"] .vg-tl-item.cur .vg-tl-dot{box-shadow:none;border-color:#111;animation:none}
html[data-theme="mono"] .vg-sos{border:2px solid #111}
html[data-theme="mono"] .vg-sos-dot{background:#111;box-shadow:none;animation:none}
html[data-theme="mono"] .vg-sos-badge{border-radius:0;background:#111;color:#fff}
html[data-theme="mono"] .vg-hot{background:#fff;border:1px solid #D4D4D4}
html[data-theme="mono"] .vg-hot:hover{background:#F5F5F5;border-color:#111;transform:translateX(2px);box-shadow:none}
html[data-theme="mono"] .vg-hot-ico{background:#111;box-shadow:none}


/* ============================================================
   合同与证照 v2 · 流程图 + ID 卡（三主题）
   ============================================================ */
.view-contract{padding:22px 24px 40px!important}
.vc-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vc-head h1{font-size:21px;font-weight:800;letter-spacing:-.3px;margin:0}
.vc-sub{font-size:12px;color:var(--text-3);margin-top:2px}

.vc-matrix,.vc-creds{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow);
}
.vc-matrix-hd{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.vc-matrix-hd h2{font-size:13.5px;font-weight:750;margin:0}
.vc-matrix-hd .sub{font-size:11px;color:var(--text-3)}

/* ===== 流程图 ===== */
.vc-flow{
  display:grid;grid-template-columns:1fr 0.55fr 1fr;gap:0;
  align-items:center;position:relative;min-height:250px;
}
@media(max-width:980px){
  .vc-flow{grid-template-columns:1fr;gap:16px}
  .vc-lines{display:none}
}

/* 发光连线 */
.vc-lines{
  position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;
  opacity:.9;
}
.vc-lines path{
  stroke-dasharray:6 8;
  animation:vcDash 3s linear infinite;
  filter:drop-shadow(0 0 5px var(--primary));
}
.vc-lines path:nth-child(2){animation-delay:.4s}
.vc-lines path:nth-child(3){animation-delay:.8s}
@keyframes vcDash{to{stroke-dashoffset:-28}}

/* 左：三张合同卡 */
.vc-side{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1;padding-right:8px}
.vc-con{
  display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:11px;
  background:var(--surface-2);border:1px solid var(--border);
  transition:border-color .2s,transform .2s,box-shadow .2s;
}
.vc-con:hover{border-color:var(--primary);transform:translateX(3px);box-shadow:0 4px 16px var(--ai-glow)}
.vc-con-ico{
  width:34px;height:34px;flex:0 0 34px;border-radius:9px;display:grid;place-items:center;
  background:var(--primary-weak);color:var(--primary);border:1px solid var(--border-2);
}
.vc-con-tx{flex:1;min-width:0}
.vc-con-t{font-size:12.5px;font-weight:750;color:var(--text)}
.vc-con-d{font-size:10.5px;color:var(--text-3);margin-top:1px}
.vc-con-st{
  width:20px;height:20px;flex:0 0 20px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:800;
}
.vc-con-st.ok{background:rgba(74,222,128,.16);color:var(--success)}
.vc-con-st.bad{background:rgba(248,113,113,.16);color:var(--danger)}

/* 中：徽章 */
.vc-center{position:relative;z-index:1;display:grid;place-items:center;min-height:150px}
.vc-badge-ring,.vc-badge-ring2{
  position:absolute;border-radius:50%;border:1px solid var(--primary);opacity:.28;
}
.vc-badge-ring{width:132px;height:132px;animation:vcRingPulse 3.6s ease-out infinite}
.vc-badge-ring2{width:132px;height:132px;animation:vcRingPulse 3.6s ease-out infinite 1.8s}
@keyframes vcRingPulse{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.35);opacity:0}}
.vc-badge-core{
  position:relative;width:104px;height:104px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,rgba(74,222,128,.28),rgba(6,26,38,.9) 68%);
  border:2px solid var(--success);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:0 0 28px rgba(74,222,128,.4),inset 0 0 22px rgba(74,222,128,.16);
}
.vc-center.bad .vc-badge-core{
  background:radial-gradient(circle at 34% 28%,rgba(248,113,113,.28),rgba(38,6,6,.9) 68%);
  border-color:var(--danger);box-shadow:0 0 28px rgba(248,113,113,.4),inset 0 0 22px rgba(248,113,113,.16);
}
.vc-center.bad .vc-badge-ring,
.vc-center.bad .vc-badge-ring2{border-color:var(--danger)}
.vc-badge-ico{font-size:15px;color:var(--success);line-height:1}
.vc-center.bad .vc-badge-ico{color:var(--danger)}
.vc-badge-t{font-size:22px;font-weight:800;color:var(--text);font-family:ui-monospace,monospace;line-height:1.1}
.vc-badge-l{font-size:9px;color:var(--text-3);letter-spacing:.3px}

/* 右：条款清单 */
.vc-clauses{position:relative;z-index:1;display:flex;flex-direction:column;gap:5px;padding-left:20px}
.vc-clauses-hd{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-3);margin-bottom:3px}
.vc-clause{
  display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;
  background:var(--surface-2);border:1px solid var(--border);
  animation:vcClauseIn .4s ease both;
}
@keyframes vcClauseIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.vc-clause.bad{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3)}
.vc-clause-ico{
  width:15px;height:15px;flex:0 0 15px;border-radius:50%;display:grid;place-items:center;
  font-size:9px;font-weight:800;background:rgba(74,222,128,.16);color:var(--success);
}
.vc-clause.bad .vc-clause-ico{background:rgba(248,113,113,.18);color:var(--danger)}
.vc-clause-t{font-size:11.5px;font-weight:650;color:var(--text);flex:1}
.vc-clause-s{font-size:10px;color:var(--success);font-weight:700}
.vc-clause.bad .vc-clause-s{color:var(--danger)}

/* 明细折叠 */
.vc-details{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
.vc-details summary{
  cursor:pointer;font-size:12px;font-weight:650;color:var(--text-2);
  padding:4px 0;list-style:none;display:flex;align-items:center;gap:6px;
}
.vc-details summary::-webkit-details-marker{display:none}
.vc-details summary::before{content:"\25b8";color:var(--primary);transition:transform .2s}
.vc-details[open] summary::before{transform:rotate(90deg)}
.vc-details summary:hover{color:var(--primary)}

/* ===== 证照 ID 卡网格 ===== */
.vc-cred-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.vc-cred{
  position:relative;padding:14px 15px 12px;border-radius:13px;overflow:hidden;cursor:pointer;
  background:
    linear-gradient(135deg,rgba(56,189,248,.09),transparent 46%),
    var(--surface-2);
  border:1px solid var(--border);
  transition:transform .22s cubic-bezier(.2,.8,.3,1),border-color .22s,box-shadow .22s;
}
.vc-cred::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary);
}
.vc-cred::after{
  content:"";position:absolute;right:-30px;top:-40px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,var(--primary-weak),transparent 70%);pointer-events:none;
}
.vc-cred:hover{
  transform:translateY(-3px);border-color:var(--primary);
  box-shadow:0 12px 30px rgba(0,0,0,.36),0 0 0 1px var(--primary),0 0 22px var(--ai-glow);
}
.vc-cred.warn::before{background:var(--warning)}
.vc-cred.warn{background:linear-gradient(135deg,rgba(240,180,41,.10),transparent 46%),var(--surface-2)}
.vc-cred.warn::after{background:radial-gradient(circle,rgba(240,180,41,.14),transparent 70%)}
.vc-cred.bad::before{background:var(--danger)}
.vc-cred.bad{background:linear-gradient(135deg,rgba(248,113,113,.10),transparent 46%),var(--surface-2)}
.vc-cred.bad::after{background:radial-gradient(circle,rgba(248,113,113,.14),transparent 70%)}
.vc-cred.pend::before{background:var(--text-3)}

.vc-cred-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.vc-cred-ico{
  width:34px;height:34px;flex:0 0 34px;border-radius:9px;display:grid;place-items:center;
  background:var(--primary-weak);color:var(--primary);border:1px solid var(--border-2);
}
.vc-cred.warn .vc-cred-ico{background:rgba(240,180,41,.14);color:var(--warning);border-color:rgba(240,180,41,.3)}
.vc-cred.bad .vc-cred-ico{background:rgba(248,113,113,.14);color:var(--danger);border-color:rgba(248,113,113,.3)}
.vc-cred-hd{flex:1;min-width:0}
.vc-cred-nm{font-size:13px;font-weight:750;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc-cred-no{font-size:10px;color:var(--text-3);font-family:ui-monospace,monospace;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc-cred-chip{
  flex:0 0 auto;font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:5px;
  background:rgba(74,222,128,.15);color:var(--success);
}
.vc-cred-chip.warn{background:rgba(240,180,41,.16);color:var(--warning)}
.vc-cred-chip.bad{background:rgba(248,113,113,.16);color:var(--danger)}
.vc-cred-chip.pend{background:var(--primary-weak);color:var(--primary)}

/* 有效期进度条 */
.vc-cred-bar{
  height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-bottom:7px;
}
.vc-cred-bar i{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--primary),var(--primary-2));
  animation:vcBarIn .9s cubic-bezier(.2,.8,.3,1) both;
}
.vc-cred-bar i.warn{background:linear-gradient(90deg,var(--warning),#fbbf24)}
.vc-cred-bar i.bad{background:linear-gradient(90deg,var(--danger),#f87171)}
.vc-cred-bar i.pend{background:repeating-linear-gradient(90deg,var(--primary) 0 8px,var(--primary-weak) 8px 16px);background-size:200% 100%;animation:vcPend 1.4s linear infinite}
@keyframes vcPend{to{background-position:-32px 0}}
@keyframes vcBarIn{from{width:0!important}}
.vc-cred-foot{display:flex;align-items:center;font-size:10.5px;color:var(--text-3)}
.vc-cred-left{margin-left:auto;font-weight:650}
.vc-cred.warn .vc-cred-left{color:var(--warning)}
.vc-cred.bad .vc-cred-left{color:var(--danger)}

/* ===== 三主题微调 ===== */
html[data-theme="light"] .vc-matrix,
html[data-theme="light"] .vc-creds{background:#fff}
html[data-theme="light"] .vc-con,
html[data-theme="light"] .vc-clause,
html[data-theme="light"] .vc-cred{background:var(--surface-2)}
html[data-theme="light"] .vc-badge-core{background:radial-gradient(circle at 34% 28%,rgba(21,128,61,.14),#fff 68%)}

html[data-theme="mono"] .vc-matrix,
html[data-theme="mono"] .vc-creds{border-radius:0;background:#fff;border:1px solid #E5E5E5;box-shadow:none}
html[data-theme="mono"] .vc-con,
html[data-theme="mono"] .vc-clause{border-radius:0;background:#fff;border:1px solid #E5E5E5}
html[data-theme="mono"] .vc-con:hover{border-color:#111;box-shadow:none;transform:translateX(2px)}
html[data-theme="mono"] .vc-con-ico{border-radius:0;background:#fff;border:1px solid #111;color:#111}
html[data-theme="mono"] .vc-con-st{border-radius:0;background:#111!important;color:#fff!important}
html[data-theme="mono"] .vc-lines path{filter:none;stroke:#111!important}
html[data-theme="mono"] .vc-badge-core{border-radius:0;background:#fff;border:2px solid #111;box-shadow:none}
html[data-theme="mono"] .vc-badge-ring,
html[data-theme="mono"] .vc-badge-ring2{border-radius:0;border-color:#111;animation:none;opacity:.14}
html[data-theme="mono"] .vc-badge-ico{color:#111}
html[data-theme="mono"] .vc-clause-ico{border-radius:0;background:#111;color:#fff}
html[data-theme="mono"] .vc-clause-s{color:#111}
html[data-theme="mono"] .vc-cred{border-radius:0;background:#fff;border:1px solid #E5E5E5}
html[data-theme="mono"] .vc-cred:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 0 #111;border-color:#111}
html[data-theme="mono"] .vc-cred::before{background:#111}
html[data-theme="mono"] .vc-cred::after{display:none}
html[data-theme="mono"] .vc-cred-ico{border-radius:0;background:#fff;border:1px solid #111;color:#111}
html[data-theme="mono"] .vc-cred-chip{border-radius:0;background:#111;color:#fff}
html[data-theme="mono"] .vc-cred-bar{border-radius:0;border:1px solid #D4D4D4;background:#fff}
html[data-theme="mono"] .vc-cred-bar i{border-radius:0;background:#111}


/* ============================================================
   我的主页 v2 · 横向步骤条 + 双栏 + 收藏（三主题）
   ============================================================ */
.view-home{padding:20px 24px 36px!important}

.vh-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.vh-head h1{font-size:21px;font-weight:800;letter-spacing:-.3px;margin:0}
.vh-greet{font-size:12px;color:var(--text-3);margin-top:2px}
.vh-kpis{margin-left:auto;display:flex;gap:10px}
.vh-kpi{
  min-width:92px;padding:8px 14px;border-radius:11px;text-align:center;
  background:var(--surface);border:1px solid var(--border);
}
.vh-kpi b{
  display:block;font-size:19px;font-weight:800;font-family:ui-monospace,monospace;
  color:var(--primary);line-height:1.2;
}
.vh-kpi span{font-size:10px;color:var(--text-3)}

/* ===== 横向步骤条 ===== */
.vh-stepper{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:14px 20px 14px;margin-bottom:14px;box-shadow:var(--shadow);
}
.vh-stepper-hd{display:flex;align-items:center;gap:9px;margin-bottom:16px;flex-wrap:wrap}
.vh-stepper-hd h2{font-size:13.5px;font-weight:750;margin:0}
.vh-stepper-hd .sub{font-size:11px;color:var(--text-3)}

.vh-steps{display:flex;align-items:flex-start;position:relative}
.vh-step{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;
  position:relative;background:none;border:none;cursor:pointer;font-family:inherit;
  padding:0 4px;
}
/* 连线：从每个点向右延伸 */
.vh-steps{display:flex;align-items:flex-start;position:relative;padding-bottom:4px}
.vh-step::before{content:"";position:absolute;top:16px;left:50%;width:100%;height:2px;background:var(--surface-3);border-radius:2px;z-index:0}
.vh-step:last-child::before{display:none}
.vh-step.done::before{background:linear-gradient(90deg,var(--primary),var(--primary-2))}
.vh-step.cur::before{background:linear-gradient(90deg,var(--primary),var(--surface-3))}

.vh-step-dot{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:2;
  font-size:13px;font-weight:800;position:relative;z-index:1;
  background:var(--surface-2);border:2px solid var(--border-2);color:var(--text-3);
  transition:all .2s;
}
.vh-step:hover .vh-step-dot{transform:scale(1.1)}
.vh-step.done .vh-step-dot{
  background-color:var(--primary);
  background-image:linear-gradient(135deg,var(--primary),var(--primary-2));
  border-color:transparent;color:#04121a;-webkit-text-fill-color:#04121a;
  box-shadow:0 3px 14px var(--ai-glow);
}
.vh-step.cur .vh-step-dot{
  background:var(--surface);border-color:var(--primary);color:var(--primary);
  box-shadow:0 0 0 4px var(--primary-weak);
  animation:vhCurPulse 2.2s ease-in-out infinite;
}
@keyframes vhCurPulse{0%,100%{box-shadow:0 0 0 4px var(--primary-weak)}50%{box-shadow:0 0 0 8px transparent}}
.vh-step-l{font-size:12px;font-weight:700;color:var(--text-2)}
.vh-step.done .vh-step-l,.vh-step.cur .vh-step-l{color:var(--text)}
.vh-step-t{font-size:10px;color:var(--text-3);font-family:ui-monospace,monospace}

/* ===== 中部双栏 ===== */
.vh-mid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px;align-items:stretch}
@media(max-width:980px){.vh-mid{grid-template-columns:1fr}}

.vh-card{
  background:var(--surface);border:1px solid var(--border);border-radius:13px;
  padding:15px 18px;box-shadow:var(--shadow);
}
.vh-card-hd{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.vh-card-hd h2{font-size:13.5px;font-weight:750;margin:0}
.vh-card-hd .sub{font-size:11px;color:var(--text-3)}

/* ===== 待办 ===== */
.vh-todos{display:flex;flex-direction:column;gap:9px;min-height:40px}
.vh-todo{
  display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--warning);
  transition:all .2s;
}
.vh-todo:hover{border-color:var(--warning);transform:translateX(2px)}
.vh-todo.urgent{border-left-color:var(--danger)}
.vh-todo-ico{
  width:32px;height:32px;flex:0 0 32px;border-radius:8px;display:grid;place-items:center;
  background:var(--primary-weak);color:var(--primary);
}
.vh-todo-tx{flex:1;min-width:0}
.vh-todo-t{font-size:12.5px;font-weight:700;color:var(--text)}
.vh-todo-d{font-size:10.5px;color:var(--text-3);margin-top:1px}
.vh-todo-btn{
  flex:0 0 auto;padding:7px 15px;border:none;border-radius:8px;cursor:pointer;font-family:inherit;
  background-color:var(--primary);
  background-image:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#04121a;-webkit-text-fill-color:#04121a;font-size:11.5px;font-weight:800;white-space:nowrap;
  box-shadow:0 3px 12px var(--ai-glow);transition:transform .16s,opacity .16s;
}
.vh-todo-btn:hover{transform:translateY(-1px);opacity:.92}

/* ===== 顾问卡 ===== */
.vh-consultant{
  background:
    radial-gradient(420px 240px at 84% -14%,var(--primary-weak),transparent 62%),
    var(--surface);
  border:1px solid var(--border);border-radius:13px;padding:16px 18px;
  box-shadow:var(--shadow);
}
.vh-consultant-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.vh-av-wrap{position:relative;flex:0 0 auto}
.vh-av{
  width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  font-size:16px;font-weight:800;color:#fff;-webkit-text-fill-color:#fff;
  background-color:#f59e0b;
  background-image:linear-gradient(135deg,#f59e0b,#d97706);
  box-shadow:0 4px 16px rgba(245,158,11,.32);
}
.vh-av-live{
  position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;
  background:var(--success);border:2.5px solid var(--surface);
  box-shadow:0 0 0 2px rgba(74,222,128,.28);
  animation:vhLive 2s ease-in-out infinite;
}
@keyframes vhLive{0%,100%{box-shadow:0 0 0 2px rgba(74,222,128,.28)}50%{box-shadow:0 0 0 6px transparent}}
.vh-consultant-nm{font-size:14px;font-weight:800;color:var(--text)}
.vh-consultant-st{
  font-size:10.5px;color:var(--success);font-weight:650;margin-top:2px;
  display:flex;align-items:center;gap:4px;
}
.vh-consultant-st i{width:5px;height:5px;border-radius:50%;background:var(--success);display:block}

.vh-consultant-info{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.vh-ci-row{display:flex;font-size:11.5px;padding:5px 0;border-bottom:1px dashed var(--border)}
.vh-ci-row:last-child{border-bottom:none}
.vh-ci-row .k{color:var(--text-3);flex:0 0 72px}
.vh-ci-row .v{color:var(--text-2);font-weight:600}

.vh-consultant-acts{display:flex;gap:8px}
.vh-btn{
  flex:1 1 0;min-width:0;min-height:36px;display:inline-flex!important;align-items:center;justify-content:center;gap:6px;
  padding:9px 4px;border-radius:9px;cursor:pointer;font-family:inherit;line-height:1;
  font-size:12px;font-weight:750;transition:all .18s;border:1px solid transparent;
}
.vh-btn-p{
  background-color:var(--primary);
  background-image:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#04121a;-webkit-text-fill-color:#04121a;box-shadow:0 4px 16px var(--ai-glow);
}
.vh-btn-p:hover{transform:translateY(-1px);opacity:.93}
.vh-btn-o{background:var(--surface-2);border-color:var(--border-2);color:var(--text-2)}
.vh-btn-o:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-weak)}

/* ===== 收藏 ===== */
.vh-favbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.vh-fav-item{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--border);
  transition:all .2s;cursor:pointer;
}
.vh-fav-item:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 6px 18px var(--ai-glow)}
.vh-fav-tx{flex:1;min-width:0}
.vh-fav-t{font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vh-fav-d{font-size:10.5px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vh-fav-salary{font-size:11px;font-weight:700;color:var(--primary);font-family:ui-monospace,monospace;flex:0 0 auto}

/* ===== 三主题微调 ===== */
html[data-theme="light"] .vh-stepper,
html[data-theme="light"] .vh-card,
html[data-theme="light"] .vh-consultant{background:#fff}
html[data-theme="light"] .vh-step.done .vh-step-dot{background:linear-gradient(135deg,#2563EB,#0D9488);color:#fff}
html[data-theme="light"] .vh-btn-p,
html[data-theme="light"] .vh-todo-btn{background:linear-gradient(135deg,#2563EB,#0D9488);color:#fff}
html[data-theme="light"] .vh-kpi b{color:#1D4FD7}

html[data-theme="mono"] .vh-stepper,
html[data-theme="mono"] .vh-card,
html[data-theme="mono"] .vh-consultant,
html[data-theme="mono"] .vh-kpi{border-radius:0;background:#fff;border:1px solid #E5E5E5;box-shadow:none}
html[data-theme="mono"] .vh-step::before{background:#D4D4D4;border-radius:0;height:1px}
html[data-theme="mono"] .vh-step.done::before,
html[data-theme="mono"] .vh-step.cur::before{background:#111}
html[data-theme="mono"] .vh-step-dot{border-radius:0;background:#fff;border:2px solid #D4D4D4;color:#6B6B6B}
html[data-theme="mono"] .vh-step.done .vh-step-dot{background-color:#111!important;background-image:none!important;border-color:#111;color:#fff!important;-webkit-text-fill-color:#fff!important;box-shadow:none}
html[data-theme="mono"] .vh-step.cur .vh-step-dot{border-color:#111;color:#111;box-shadow:none;animation:none}
html[data-theme="mono"] .vh-step-l{color:#111}
html[data-theme="mono"] .vh-kpi b{color:#111}
html[data-theme="mono"] .vh-todo{border-radius:0;background:#fff;border:1px solid #E5E5E5;border-left:3px solid #111}
html[data-theme="mono"] .vh-todo-ico{border-radius:0;background:#fff;border:1px solid #111;color:#111}
html[data-theme="mono"] .vh-todo-btn{border-radius:0;background-color:#111!important;background-image:none!important;color:#fff!important;-webkit-text-fill-color:#fff!important;box-shadow:none}
html[data-theme="mono"] .vh-av{border-radius:0;background-color:#111!important;background-image:none!important;color:#fff!important;-webkit-text-fill-color:#fff!important;box-shadow:none}
html[data-theme="mono"] .vh-av-live{border-radius:0;background:#111;box-shadow:none;animation:none}
html[data-theme="mono"] .vh-consultant-st{color:#111}
html[data-theme="mono"] .vh-consultant-st i{background:#111}
html[data-theme="mono"] .vh-btn{border-radius:0}
html[data-theme="mono"] .vh-btn-p{background-color:#111!important;background-image:none!important;color:#fff!important;-webkit-text-fill-color:#fff!important;box-shadow:none}
html[data-theme="mono"] .vh-btn-o{background:#fff;border:1px solid #D4D4D4;color:#111}
html[data-theme="mono"] .vh-btn-o:hover{background:#F5F5F5;border-color:#111}
html[data-theme="mono"] .vh-fav-item{border-radius:0;background:#fff;border:1px solid #E5E5E5}
html[data-theme="mono"] .vh-fav-item:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 0 #111;border-color:#111}
html[data-theme="mono"] .vh-fav-salary{color:#111}


/* ============================================================
   我的求职 v2 · Hero 卡 + 签证进度条 + 紧凑列表（三主题）
   ============================================================ */
.view-jobs{padding:20px 24px 40px!important}
.view-jobs #mainApplication{padding:0!important;overflow:hidden;background:transparent;border:none;box-shadow:none}

/* ===== Hero 卡 ===== */
.hj-hero{
  display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;
  padding:22px 24px;border-radius:15px;position:relative;overflow:hidden;
  background:
    radial-gradient(560px 300px at 88% -22%,var(--primary-weak),transparent 64%),
    linear-gradient(160deg,rgba(56,189,248,.07),transparent 52%),
    var(--surface);
  border:1px solid var(--border-strong);box-shadow:var(--shadow);
}
.hj-hero::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--primary),var(--primary-2));
}
.hj-hero-kicker{
  display:flex;align-items:center;gap:7px;font-size:10px;font-weight:800;
  letter-spacing:1.2px;text-transform:uppercase;color:var(--primary);margin-bottom:7px;
}
.hj-hero-live{
  width:6px;height:6px;border-radius:50%;background:var(--primary);
  animation:hjBlink 1.8s ease-in-out infinite;
}
@keyframes hjBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}
.hj-hero-title{font-size:19px;font-weight:800;color:var(--text);letter-spacing:-.3px;margin:0 0 5px}
.hj-hero-sub{font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hj-sep{opacity:.4}
.hj-hero-pay{color:var(--primary);font-weight:700;font-family:ui-monospace,monospace}
.hj-hero-tags{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0 15px}
.hj-tag{
  font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;
  background:var(--primary-weak);color:var(--primary);border:1px solid var(--border-2);
}
.hj-tag.ok{background:rgba(74,222,128,.13);color:var(--success);border-color:rgba(74,222,128,.28)}
.hj-tag.warn{background:rgba(240,180,41,.13);color:var(--warning);border-color:rgba(240,180,41,.28)}
.hj-hero-acts{display:flex;gap:8px;flex-wrap:wrap}

/* 环形进度 */
.hj-ring{
  width:104px;height:104px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--primary) calc(var(--p) * 1%), var(--surface-3) 0);
  position:relative;flex:0 0 auto;
}
.hj-ring::before{
  content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface);
}
.hj-ring-in{position:relative;text-align:center;line-height:1.15}
.hj-ring-in b{
  font-size:23px;font-weight:800;font-family:ui-monospace,monospace;color:var(--text);
}
.hj-ring-in b i{font-size:11px;font-style:normal;color:var(--text-3);margin-left:1px}
.hj-ring-in span{display:block;font-size:9px;color:var(--text-3);margin-top:2px}

/* ===== 签证横向进度条 ===== */
.hj-visa{
  margin-top:14px;padding:16px 20px 20px;border-radius:13px;
  background:var(--surface);border:1px solid var(--border);
}
.hj-visa-hd{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:750;color:var(--text);margin-bottom:20px}
.hj-visa-now{margin-left:auto;font-size:10.5px;font-weight:650;color:var(--warning)}
.hj-visa-bar{position:relative;display:flex;justify-content:space-between}
/* 灰色轨道 */
.hj-visa-bar::before{
  content:"";position:absolute;left:0;right:0;top:11px;height:3px;
  background:var(--surface-3);border-radius:3px;
}
/* 已完成填充 */
.hj-vfill{
  position:absolute;left:0;top:11px;height:3px;border-radius:3px;z-index:1;
  background:linear-gradient(90deg,var(--primary),var(--primary-2));
  box-shadow:0 0 12px var(--ai-glow);
  animation:hjFill .9s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes hjFill{from{width:0!important}}
.hj-vstep{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto}
.hj-vdot{
  width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:800;
  background:var(--surface-2);border:2px solid var(--border-2);color:var(--text-3);
}
.hj-vstep.done .hj-vdot{background:var(--primary);border-color:var(--primary);color:#04121a}
.hj-vstep.cur .hj-vdot{
  background:var(--surface);border-color:var(--primary);color:var(--primary);
  box-shadow:0 0 0 4px var(--primary-weak);animation:hjCur 2s ease-in-out infinite;
}
@keyframes hjCur{0%,100%{box-shadow:0 0 0 4px var(--primary-weak)}50%{box-shadow:0 0 0 8px transparent}}
.hj-vlabel{font-size:10.5px;color:var(--text-3);white-space:nowrap}
.hj-vstep.done .hj-vlabel,.hj-vstep.cur .hj-vlabel{color:var(--text-2);font-weight:650}

/* 折叠历程 */
.hj-details{margin-top:12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);padding:12px 18px}
.hj-details summary{cursor:pointer;font-size:12px;font-weight:650;color:var(--text-2);list-style:none;display:flex;align-items:center;gap:6px}
.hj-details summary::-webkit-details-marker{display:none}
.hj-details summary::before{content:"▸";color:var(--primary);transition:transform .2s}
.hj-details[open] summary::before{transform:rotate(90deg)}
.hj-details summary:hover{color:var(--primary)}

/* ===== 紧凑列表 ===== */
/* 用 grid 明确定义列，避免与 .ap-item 的 flex 规则冲突 */
.view-jobs .hj-row{
  display:grid!important;
  grid-template-columns:36px minmax(0,1fr) auto auto auto;
  align-items:center;gap:12px;
  padding:12px 14px;border-radius:11px;margin-bottom:4px;
  position:relative;cursor:pointer;transition:background .16s,border-color .16s;
  border:1px solid transparent;background:transparent;
}
.view-jobs .hj-row > *{min-width:0}
.view-jobs .hj-row > .hj-row-av{grid-column:1}
.view-jobs .hj-row > .hj-row-main{grid-column:2}
.view-jobs .hj-row > .hj-row-time{grid-column:3}
.view-jobs .hj-row > .hj-row-btn{grid-column:4}
.view-jobs .hj-row > .hj-row-more{grid-column:5}
/* 展开区独占整行 */
.view-jobs .hj-row-body{
  display:none;grid-column:1/-1;padding:4px 0 10px 48px!important;
  border:none!important;background:transparent!important;
}
.view-jobs .hj-row.open .hj-row-body{display:block!important}
.view-jobs .hj-row:hover{background:var(--row-hover);border-color:var(--border)}
.view-jobs .hj-row.dropped{opacity:.55}
.hj-row-av{
  width:36px;height:36px;flex:0 0 36px;border-radius:10px;display:grid;place-items:center;
  font-size:14px;font-weight:800;color:var(--primary);
  background:var(--primary-weak);border:1px solid var(--border-2);
}
.hj-row-main{flex:1;min-width:0}
.hj-row-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hj-row-title{font-size:13px;font-weight:750;color:var(--text)}
.hj-row-d{font-size:11px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 彩色状态徽章 */
.hj-sb{
  font-size:9.5px;font-weight:750;padding:2px 8px;border-radius:5px;
  background:var(--primary-weak);color:var(--primary);flex:0 0 auto;
}
.hj-sb.ok{background:rgba(74,222,128,.15);color:var(--success)}
.hj-sb.warn{background:rgba(240,180,41,.16);color:var(--warning)}
.hj-sb.mute{background:var(--surface-3);color:var(--text-3)}
.hj-sb.info{background:var(--primary-weak);color:var(--primary)}

.hj-row-time{
  font-size:10.5px;color:var(--text-3);font-family:ui-monospace,monospace;flex:0 0 auto;
  transition:opacity .18s;
}
/* 查看详情按钮：默认隐藏 */
.hj-row-btn{
  flex:0 0 auto;display:flex;align-items:center;gap:4px;
  padding:6px 13px;border-radius:8px;cursor:pointer;font-family:inherit;
  font-size:11.5px;font-weight:750;
  background-color:var(--primary);
  background-image:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#04121a;-webkit-text-fill-color:#04121a;
  border:none;box-shadow:0 3px 12px var(--ai-glow);
  opacity:0;transform:translateX(8px);pointer-events:none;
  transition:opacity .2s,transform .2s;
}
.hj-row:hover .hj-row-btn{opacity:1;transform:none;pointer-events:auto}
.hj-row:hover .hj-row-time{opacity:0}
.hj-row-more{
  flex:0 0 auto;width:26px;height:26px;border-radius:7px;cursor:pointer;font-family:inherit;
  background:transparent;border:1px solid transparent;color:var(--text-3);font-size:13px;line-height:1;
  opacity:0;transition:all .18s;
}
.hj-row:hover .hj-row-more{opacity:1}
.hj-row-more:hover{border-color:var(--border-2);color:var(--text);background:var(--surface-2)}

/* 展开区 */
/* hj-row-body 样式见上方 grid 区块 */
.hj-row-acts{display:flex;gap:8px;padding-top:4px}

/* ===== 三主题微调 ===== */
html[data-theme="light"] .hj-hero{
  background:radial-gradient(560px 300px at 88% -22%,#E8F0FE,transparent 64%),linear-gradient(160deg,#F7FAFF,transparent 52%),#fff;
}
html[data-theme="light"] .hj-visa,html[data-theme="light"] .hj-details{background:#fff}
html[data-theme="light"] .hj-ring::before{background:#fff}
html[data-theme="light"] .hj-row-btn,html[data-theme="light"] .hj-vstep.done .hj-vdot{
  background-color:#2563EB;background-image:linear-gradient(135deg,#2563EB,#0D9488);color:#fff;-webkit-text-fill-color:#fff;
}

html[data-theme="mono"] .hj-hero,
html[data-theme="mono"] .hj-visa,
html[data-theme="mono"] .hj-details{border-radius:0;background:#fff;border:1px solid #E5E5E5;box-shadow:none}
html[data-theme="mono"] .hj-hero::before{background:#111}
html[data-theme="mono"] .hj-hero-live{background:#111;animation:none}
html[data-theme="mono"] .hj-ring{background:conic-gradient(#111 calc(var(--p) * 1%), #EDEDED 0);border-radius:0}
html[data-theme="mono"] .hj-ring::before{border-radius:0;background:#fff}
html[data-theme="mono"] .hj-tag{border-radius:0;background:#fff;border:1px solid #111;color:#111}
html[data-theme="mono"] .hj-tag.ok,html[data-theme="mono"] .hj-tag.warn{background:#111;color:#fff;border-color:#111}
html[data-theme="mono"] .hj-visa-bar::before{background:#D4D4D4;border-radius:0;height:1px}
html[data-theme="mono"] .hj-vfill{background:#111;border-radius:0;box-shadow:none;height:1px}
html[data-theme="mono"] .hj-vdot{border-radius:0;background:#fff;border:2px solid #D4D4D4}
html[data-theme="mono"] .hj-vstep.done .hj-vdot{background:#111!important;border-color:#111;color:#fff!important;-webkit-text-fill-color:#fff!important}
html[data-theme="mono"] .hj-vstep.cur .hj-vdot{border-color:#111;color:#111;box-shadow:none;animation:none}
html[data-theme="mono"] .view-jobs .hj-row{border-radius:0}
html[data-theme="mono"] .view-jobs .hj-row:hover{background:#F5F5F5;border-color:#D4D4D4}
html[data-theme="mono"] .hj-row-av{border-radius:0;background:#fff;border:1px solid #111;color:#111}
html[data-theme="mono"] .hj-sb{border-radius:0;background:#EDEDED;color:#111}
html[data-theme="mono"] .hj-sb.ok,html[data-theme="mono"] .hj-sb.warn,html[data-theme="mono"] .hj-sb.info{background:#111;color:#fff}
html[data-theme="mono"] .hj-row-btn{
  border-radius:0;background-color:#111!important;background-image:none!important;
  color:#fff!important;-webkit-text-fill-color:#fff!important;box-shadow:none;
}
html[data-theme="mono"] .hj-row-more{border-radius:0}


/* ============================================================
   岗位发现 v2 · 精简筛选 + 侧抽屉 + Premium 卡片（三主题）
   ============================================================ */

/* ===== 筛选区 ===== */
.jd-filter{
  background:var(--surface);border:1px solid var(--border);border-radius:13px;
  padding:15px 18px;margin-bottom:14px;box-shadow:var(--shadow);
}
.jd-fsearch-row{display:flex;gap:9px;margin-bottom:13px;flex-wrap:wrap}
.jd-searchwrap{
  flex:1;min-width:220px;display:flex;align-items:center;gap:9px;
  padding:0 13px;height:40px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--border);
  transition:border-color .16s,box-shadow .16s;color:var(--text-3);
}
.jd-searchwrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak)}
.jd-search{
  flex:1;border:none;outline:none;background:transparent;font-family:inherit;
  font-size:13px;color:var(--text);height:100%;
}
.jd-search::placeholder{color:var(--text-3)}
.jd-advbtn,.jd-clearbtn{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;height:40px;
  padding:0 16px;border-radius:10px;cursor:pointer;font-family:inherit;
  font-size:12.5px;font-weight:700;white-space:nowrap;transition:all .18s;
  position:relative;
}
.jd-advbtn{
  background-color:var(--primary);
  background-image:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#04121a;-webkit-text-fill-color:#04121a;border:none;
  box-shadow:0 3px 14px var(--ai-glow);
}
.jd-advbtn:hover{transform:translateY(-1px);opacity:.93}
.jd-clearbtn{background:transparent;border:1px solid var(--border-2);color:var(--text-2)}
.jd-clearbtn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-weak)}
.jd-advdot{
  position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;
  background:var(--warning);display:none;box-shadow:0 0 0 2px var(--surface);
}

.jd-frow{display:flex;align-items:flex-start;gap:11px;padding:5px 0}
.jd-flab{flex:0 0 56px;font-size:11.5px;color:var(--text-3);padding-top:6px}
.jd-fchips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.jd-fchips .chip{
  cursor:pointer;font-size:11.5px;padding:5px 12px;border-radius:99px;
  background:transparent;border:1px solid var(--border);color:var(--text-2);
  transition:all .16s;user-select:none;display:inline-block;
}
.jd-fchips .chip:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-weak)}
.jd-fchips .chip.on{
  background-color:var(--primary);
  background-image:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#04121a;-webkit-text-fill-color:#04121a;border-color:transparent;font-weight:700;
  box-shadow:0 2px 10px var(--ai-glow);
}

/* ===== 侧抽屉 ===== */
.jd-drawer-mask{
  position:fixed;inset:0;background:rgba(2,6,12,.6);backdrop-filter:blur(3px);
  z-index:900;opacity:0;pointer-events:none;transition:opacity .26s;
}
.jd-drawer-mask.open{opacity:1;pointer-events:auto}
.jd-drawer{
  position:fixed;top:0;right:0;bottom:0;width:370px;max-width:92vw;z-index:901;
  background:var(--surface);border-left:1px solid var(--border-2);
  box-shadow:-20px 0 60px rgba(0,0,0,.5);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.3,1);
  display:flex;flex-direction:column;
}
.jd-drawer.open{transform:none}
.jd-drawer-hd{
  display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);
}
.jd-drawer-hd h3{font-size:14px;font-weight:800;margin:0;color:var(--text)}
.jd-drawer-x{
  margin-left:auto;width:28px;height:28px;border-radius:8px;cursor:pointer;
  background:transparent;border:1px solid var(--border);color:var(--text-3);
  font-size:16px;line-height:1;
}
.jd-drawer-x:hover{border-color:var(--danger);color:var(--danger)}
.jd-drawer-body{flex:1;overflow-y:auto;padding:16px 20px}
.jd-drow{margin-bottom:18px}
.jd-dlab{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--text-3);margin-bottom:9px}
.jd-drawer-foot{
  display:flex;gap:9px;padding:14px 20px;border-top:1px solid var(--border);
}
.jd-drawer-foot .btn{flex:1;justify-content:center}

/* ===== Premium 卡片 ===== */
.jd-grid{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))!important;gap:14px!important}
.jd-card{
  position:relative;display:flex;flex-direction:column;padding:16px;
  border-radius:14px;overflow:hidden;cursor:pointer;
  background:
    radial-gradient(300px 160px at 88% -14%,var(--primary-weak),transparent 66%),
    var(--surface);
  border:1px solid var(--border);
  transition:transform .24s cubic-bezier(.2,.8,.3,1),border-color .24s,box-shadow .24s;
  animation:jdIn .36s ease both;
}
@keyframes jdIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.jd-card:hover{
  transform:translateY(-4px);
  border-color:var(--primary);
  box-shadow:0 16px 40px rgba(0,0,0,.42),0 0 0 1px var(--primary),0 0 26px var(--ai-glow);
}

/* AI 匹配徽章 */
.jd-match{
  position:absolute;top:13px;left:13px;display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:99px;font-size:10.5px;font-weight:800;
  background:rgba(56,189,248,.16);color:var(--primary);border:1px solid var(--border-2);
  backdrop-filter:blur(8px);z-index:2;
}
.jd-match.hi{
  background:rgba(74,222,128,.16);color:var(--success);border-color:rgba(74,222,128,.36);
  box-shadow:0 0 16px rgba(74,222,128,.28);
}
.jd-match.mid{background:rgba(56,189,248,.16);color:var(--primary);box-shadow:0 0 14px var(--ai-glow)}
.jd-match.lo{background:rgba(240,180,41,.14);color:var(--warning);border-color:rgba(240,180,41,.32)}
.jd-match-spark{font-size:9.5px;line-height:1}
.jd-match b{font-family:ui-monospace,monospace}
.jd-match-l{opacity:.72;font-weight:650}

/* 收藏心 */
.jd-heart{
  position:absolute;top:11px;right:11px;width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;z-index:2;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-3);
  transition:all .18s;
}
.jd-heart:hover{border-color:#f87171;color:#f87171;transform:scale(1.08)}
.jd-heart.on{background:rgba(248,113,113,.14);border-color:#f87171;color:#f87171}

/* 卡片主体 */
.jd-body{padding-top:34px;flex:1;display:flex;flex-direction:column}
.jd-title{
  font-size:14.5px;font-weight:800;color:var(--text);line-height:1.4;
  margin:0 0 8px;letter-spacing:-.1px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.jd-salary{
  font-size:16px;font-weight:800;font-family:ui-monospace,"SF Mono",Consolas,monospace;
  color:var(--primary);letter-spacing:-.3px;margin-bottom:9px;
}
.jd-loc{
  display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-3);
  margin-bottom:11px;flex-wrap:wrap;
}
.jd-loc svg{flex:0 0 13px;opacity:.8}
.jd-dot{opacity:.4}
.jd-emp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.jd-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:13px}
.jd-tag{
  font-size:10px;padding:3px 8px;border-radius:5px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);
}

/* 全宽渐变按钮 */
.jd-apply{
  width:100%;margin-top:auto;padding:10px;border:none;border-radius:10px;cursor:pointer;
  font-family:inherit;font-size:12.5px;font-weight:800;letter-spacing:.2px;
  background-color:var(--primary);
  background-image:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#04121a;-webkit-text-fill-color:#04121a;
  box-shadow:0 4px 16px var(--ai-glow);
  transition:transform .16s,opacity .16s;
}
.jd-apply:hover{transform:translateY(-1px);opacity:.93}
.jd-apply.done{
  background-color:var(--surface-3);background-image:none;
  color:var(--text-3);-webkit-text-fill-color:var(--text-3);
  box-shadow:none;cursor:default;
}
.jd-apply.done:hover{transform:none;opacity:1}

/* 勾选框 */
.jd-check{
  position:absolute;bottom:14px;right:14px;opacity:0;transition:opacity .18s;
}
.jd-card:hover .jd-check{opacity:1}
.jd-check input{
  width:14px;height:14px;cursor:pointer;accent-color:var(--primary);
}

/* ===== 三主题微调 ===== */
html[data-theme="light"] .jd-filter,
html[data-theme="light"] .jd-card,
html[data-theme="light"] .jd-drawer{background:#fff}
html[data-theme="light"] .jd-card{
  background:radial-gradient(300px 160px at 88% -14%,#EAF1FE,transparent 66%),#fff;
}
html[data-theme="light"] .jd-advbtn,
html[data-theme="light"] .jd-apply,
html[data-theme="light"] .jd-fchips .chip.on{
  background-color:#2563EB;background-image:linear-gradient(135deg,#2563EB,#0D9488);
  color:#fff;-webkit-text-fill-color:#fff;
}
html[data-theme="light"] .jd-salary{color:#1D4FD7}

html[data-theme="mono"] .jd-filter,
html[data-theme="mono"] .jd-card,
html[data-theme="mono"] .jd-drawer{
  border-radius:0;background:#fff;border:1px solid #E5E5E5;box-shadow:none;
}
html[data-theme="mono"] .jd-searchwrap{border-radius:0;background:#fff;border:1px solid #D4D4D4}
html[data-theme="mono"] .jd-advbtn,
html[data-theme="mono"] .jd-clearbtn{border-radius:0}
html[data-theme="mono"] .jd-advbtn{
  background-color:#111!important;background-image:none!important;
  color:#fff!important;-webkit-text-fill-color:#fff!important;box-shadow:none;
}
html[data-theme="mono"] .jd-fchips .chip{border-radius:0;border:1px solid #D4D4D4;background:#fff;color:#111}
html[data-theme="mono"] .jd-fchips .chip.on{
  background-color:#111!important;background-image:none!important;
  color:#fff!important;-webkit-text-fill-color:#fff!important;
}
html[data-theme="mono"] .jd-card:hover{
  transform:translate(-2px,-2px);
  box-shadow:5px 5px 0 0 #111;border-color:#111;
}
html[data-theme="mono"] .jd-match{
  border-radius:0;background:#111;color:#fff;border-color:#111;box-shadow:none;backdrop-filter:none;
}
html[data-theme="mono"] .jd-match.hi,
html[data-theme="mono"] .jd-match.mid,
html[data-theme="mono"] .jd-match.lo{background:#111;color:#fff;border-color:#111}
html[data-theme="mono"] .jd-heart{border-radius:0;background:#fff;border:1px solid #111;color:#111}
html[data-theme="mono"] .jd-heart.on{background:#111;color:#fff}
html[data-theme="mono"] .jd-salary{color:#111}
html[data-theme="mono"] .jd-tag{border-radius:0;background:#fff;border:1px solid #D4D4D4}
html[data-theme="mono"] .jd-apply{
  border-radius:0;background-color:#111!important;background-image:none!important;
  color:#fff!important;-webkit-text-fill-color:#fff!important;box-shadow:none;
}
html[data-theme="mono"] .jd-apply.done{background-color:#EDEDED!important;color:#6B6B6B!important;-webkit-text-fill-color:#6B6B6B!important}
html[data-theme="mono"] .jd-drawer-x{border-radius:0}
html[data-theme="mono"] .jd-drawer-mask{backdrop-filter:none;background:rgba(0,0,0,.35)}

/* 表格行高收紧 */

.view-contract .table td,
.view-guard .table td,
.view-sal .table td,
.view-home .table td,
.view-jobs .table td,
.view-profile .table td{padding:7px 10px!important;font-size:12.5px!important}

/* grid 间距收紧 */
.view-contract .grid,
.view-guard .grid,
.view-sal .grid,
.view-home .grid,

/* KPI 卡收紧 */

.view-home .kpis{gap:10px!important;margin-bottom:10px!important}
.view-sal .kpi,
.view-home .kpi{padding:12px 14px!important}
.view-sal .kpi .k-num,
.view-home .kpi .k-num{font-size:20px!important}

/* 列表行收紧 */
.view-contract .row,
.view-guard .row,
.view-sal .row,
.view-home .row,
.view-jobs .row,
.view-profile .row{padding:7px 0!important}

<script>
/* ==================================================================
 * 外壳核心
 * ================================================================== */
(function(){
  'use strict';
  var $ = function(s, r){ return (r||document).querySelector(s); };
  var $$ = function(s, r){ return Array.from((r||document).querySelectorAll(s)); };

  /* ============ 主题系统 v2 ============
   三套主题：dark（深空）/ light（明亮）/ mono（极简）
   历史命名 tech、premium 都映射到 dark，保证旧数据不炸。
   ======================================= */
var THEME_LIST = ['dark', 'light', 'mono'];
var THEME_ALIAS = { tech: 'dark', premium: 'dark' };

function normalizeTheme(t){
  var v = THEME_ALIAS[t] || t;
  return THEME_LIST.indexOf(v) >= 0 ? v : 'dark';
}

function applyTheme(theme){
  var t = normalizeTheme(theme);
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem('hp-theme', t); }catch(e){}
  /* 通知各子应用 */
  ['persona','company','assurance'].forEach(function(k){
    var app = window.SubApps && window.SubApps[k];
    if(app && app.onTheme) try{ app.onTheme(t); }catch(e){}
  });
  /* 通知所有 iframe（分析页、全球态势等） */
  var frames = document.querySelectorAll('iframe');
  for(var i = 0; i < frames.length; i++){
    try{
      var w = frames[i].contentWindow;
      if(w && w.postMessage) w.postMessage({ type:'hp:theme', theme:t }, '*');
    }catch(e){}
  }
  /* 兜底：任何 iframe 首次加载完成后，主动推一次当前主题 */
  (function bindFrameTheme(){
    var frames = document.querySelectorAll('iframe');
    for(var i = 0; i < frames.length; i++){
      (function(f){
        if(f.__hpThemeBound) return;
        f.__hpThemeBound = true;
        f.addEventListener('load', function(){
          try{
            var w = f.contentWindow;
            if(w && w.postMessage){
              w.postMessage({ type:'hp:theme', theme: document.documentElement.dataset.theme || 'dark' }, '*');
            }
          }catch(e){}
        });
      })(frames[i]);
    }
  })();
  /* 更新切换按钮上的图标（保留 SVG，只换 emoji 角标） */
  var btn = document.getElementById('themeBtn');
  if(btn){
    var ICON = { dark:'🌙', light:'☀️', mono:'◐' };
    var TIP = { dark:'深空主题（点击切明亮）', light:'明亮主题（点击切极简）', mono:'极简主题（点击切深空）' };
    var badge = btn.querySelector('.theme-badge');
    if(!badge){
      badge = document.createElement('span');
      badge.className = 'theme-badge';
      badge.style.cssText = 'position:absolute;right:-3px;bottom:-3px;font-size:10px;line-height:1;pointer-events:none';
      btn.style.position = 'relative';
      btn.appendChild(badge);
    }
    badge.textContent = ICON[t] || '🌙';
    btn.setAttribute('title', TIP[t] || '切换主题');
  }
  return t;
}

function nextTheme(cur){
  var i = THEME_LIST.indexOf(normalizeTheme(cur));
  return THEME_LIST[(i + 1) % THEME_LIST.length];
}

  function toast(title, msg){
    var wrap = $('#toast-wrap');
    if(!wrap) return;
    var el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 8v5M12 16.5v.5" stroke-linecap="round"/></svg><div><b>'+title+'</b><span>'+msg+'</span></div>';
    wrap.appendChild(el);
    setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(function(){ el.remove(); }, 320); }, 3200);
  }
  window.applyTheme = applyTheme;
  window.nextTheme = nextTheme;
  window.normalizeTheme = normalizeTheme;
  window.hpToast = toast;

  function modal(opts){
    var mask = document.createElement('div');
    mask.className = 'hp-modal-mask';
    var actions = (opts.actions||[]).map(function(a, i){
      return '<button class="btn '+(a.primary?'btn-p':'btn-o')+'" data-idx="'+i+'">'+a.text+'</button>';
    }).join('');
    mask.innerHTML =
      '<div class="hp-modal'+(opts.wide?' hp-modal-wide':'')+'">'+
        '<div class="hp-modal-head"><b>'+opts.title+'</b><button data-close>✕</button></div>'+
        '<div class="hp-modal-body">'+(opts.body||'')+'</div>'+
        (actions ? '<div class="hp-modal-foot">'+actions+'</div>' : '')+
      '</div>';
    document.body.appendChild(mask);
    /* 弹窗内容统一翻译：词典即时替换，剩下的长句走后台实时翻译。
       这样 50+ 个弹窗不用逐个改代码。 */
    if (window.HPI18N && window.HPI18N.lang() !== 'zh') {
      try { window.HPI18N.apply(mask); } catch (e) {}
      setTimeout(function () {
        try { if (window.HPI18N.apply) window.HPI18N.apply(mask); } catch (e) {}
        try { if (window.HPI18N.translateLive) window.HPI18N.translateLive(mask); } catch (e) {}
      }, 60);
    }
    function close(){
      mask.remove();
      if(opts.onClose) opts.onClose();
    }
    mask.addEventListener('click', function(e){
      if(e.target === mask || e.target.hasAttribute('data-close')) close();
    });
    $$('button[data-idx]', mask).forEach(function(b){
      b.addEventListener('click', function(){
        var a = opts.actions[+b.dataset.idx];
        if(a.onClick) a.onClick(close);
        else close();
      });
    });
    return close;
  }
  window.hpModal = modal;

  /** 在内嵌浮层里打开「AI 双向智能匹配」页面（不跳出主程序） */
  function openMatchFrame(hash){
    var __theme = (document.documentElement.dataset.theme || 'dark');
    var src = 'match.html?theme=' + encodeURIComponent(__theme) + (hash ? '#' + hash : '');
    var mask = document.createElement('div');
    mask.className = 'hp-frame-mask';
    mask.innerHTML =
      '<div class="hp-frame">' +
        '<div class="hp-frame-head"><b>◈ AI 双向智能匹配</b>' +
          '<div class="acts">' +
            '<span class="hp-frame-lang"></span>' +
            '<a class="btn btn-o" href="' + src + '" target="_blank" rel="noopener">新窗口打开</a>' +
            '<button class="btn btn-o" data-close>关闭</button>' +
          '</div>' +
        '</div>' +
        '<iframe src="' + src + '" title="AI 双向智能匹配" allow="clipboard-write"></iframe>' +
      '</div>';
    document.body.appendChild(mask);

    /* ---- 语言双向同步：主应用 ↔ 内嵌分析页 ---- */
    var frame = mask.querySelector('iframe');
    /* 头部语言按钮：浮层盖住了主界面顶栏，这里给一个可达的切换入口 */
    var langBox = mask.querySelector('.hp-frame-lang');
    var LANGS4 = [
      { code: 'zh', label: '中文' }, { code: 'en', label: 'English' },
      { code: 'ja', label: '日本語' }, { code: 'th', label: 'ไทย' },
      { code: 'fr', label: 'Français' }, { code: 'ar', label: 'العربية' }
    ];

    });
    $('#aiFab').addEventListener('click', function(){ $('#aiPanel').classList.toggle('open'); });

    /* ===== AI 悬浮按钮：可拖拽 + 可停靠在边界半隐藏 ===== */
    (function initFabDrag(){
      var fab = $('#aiFab');
      if(!fab) return;
      var KEY = 'hp-fab-pos';
      var W = 56, H = 56;
      var dragging = false, moved = false;
      var startX = 0, startY = 0, origL = 0, origT = 0;
      /* 停靠后露出的宽度（露出一小部分） */
      var PEEK = 22;

      function vw(){ return window.innerWidth; }
      function vh(){ return window.innerHeight; }

      /* 用 left/top 定位，便于拖拽计算 */
      function applyPos(left, top){
        fab.style.left = left + 'px';
        fab.style.top = top + 'px';
        fab.style.right = 'auto';
        fab.style.bottom = 'auto';
      }

      /* 读取已保存位置 */
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) {}
      if(saved && typeof saved.left === 'number'){
        applyPos(saved.left, saved.top);
        if(saved.docked) fab.classList.add('docked');
      }

      /* 松手后吸附到最近的左右边缘，可半隐藏 */
      function settle(){
        var r = fab.getBoundingClientRect();
        var left = r.left, top = r.top;
        /* 上下留边距 */
        top = Math.max(8, Math.min(top, vh() - H - 8));
        /* 判断靠近哪边 */
        var centerX = left + W / 2;
        var dockLeft = centerX < vw() / 2;
        /* 如果拖到很靠边（超出 40% 在屏幕外），就停靠半隐藏 */
        var outLeft = left + W < PEEK + 4;          /* 左侧超出 */
        var outRight = left > vw() - PEEK - 4;      /* 右侧超出 */
        var docked = false;
        if (outLeft) { left = -(W - PEEK); docked = true; }
        else if (outRight) { left = vw() - PEEK; docked = true; }
        else {
          /* 吸附到边缘（贴边但不隐藏） */
          left = dockLeft ? Math.max(8, Math.min(left, PEEK)) : Math.min(vw() - W - 8, Math.max(left, vw() - PEEK - W));
        }
        fab.classList.toggle('docked', docked);
        applyPos(Math.round(left), Math.round(top));
        try { localStorage.setItem(KEY, JSON.stringify({ left: Math.round(left), top: Math.round(top), docked: docked })); } catch(e) {}
      }

      function onDown(e){
        if (e.button !== undefined && e.button !== 0) return;
        var r = fab.getBoundingClientRect();
        dragging = true; moved = false;
        startX = (e.touches ? e.touches[0].clientX : e.clientX);
        startY = (e.touches ? e.touches[0].clientY : e.clientY);
        origL = r.left; origT = r.top;
        fab.classList.add('dragging');
        fab.style.transition = 'none';
        document.addEventListener('mousemove', onMove, { passive: false });
        document.addEventListener('mouseup', onUp);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onUp);
      }

      function onMove(e){
        if (!dragging) return;
        var cx = (e.touches ? e.touches[0].clientX : e.clientX);
        var cy = (e.touches ? e.touches[0].clientY : e.clientY);
        var dx = cx - startX, dy = cy - startY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
        if (e.cancelable) e.preventDefault();
        /* 允许拖出屏幕，但保留一小部分可见 */
        var left = origL + dx, top = origT + dy;
        var minL = -(W - PEEK), maxL = vw() - PEEK;
        var minT = -4, maxT = vh() - PEEK - 4;
        left = Math.max(minL, Math.min(left, maxL));
        top = Math.max(minT, Math.min(top, maxT));
        applyPos(left, top);
      }

      function onUp(){
        if (!dragging) return;
        dragging = false;
        fab.classList.remove('dragging');
        fab.style.transition = '';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onUp);
        settle();
      }

      fab.addEventListener('mousedown', onDown);
      fab.addEventListener('touchstart', onDown, { passive: true });

      /* 拖拽后不要触发 click（否则会误开面板） */
      fab.addEventListener('click', function(e){
        if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
      }, true);

      /* 窗口尺寸变化时把按钮拉回可视区 */
      window.addEventListener('resize', function(){
        var r = fab.getBoundingClientRect();
        var left = Math.max(-(W - PEEK), Math.min(r.left, vw() - PEEK));
        var top = Math.max(8, Math.min(r.top, vh() - H - 8));
        applyPos(Math.round(left), Math.round(top));
      });
    })();
    $('#aiSend').addEventListener('click', function(){ ask($('#aiInput').value); });
    $('#aiInput').addEventListener('keydown', function(e){ if(e.key==='Enter') ask($('#aiInput').value); });

    var aiCloseBtn = $('#aiClose');
    if(aiCloseBtn){
      aiCloseBtn.addEventListener('click', function(e){
        e.stopPropagation();
        $('#aiPanel').classList.remove('open');
      });
    }
    document.addEventListener('click', function(e){
      var panel = $('#aiPanel');
      var fab = $('#aiFab');
      if(!panel || !fab) return;
      if(!panel.classList.contains('open')) return;
      if(panel.contains(e.target) || fab.contains(e.target)) return;
      panel.classList.remove('open');
    });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){
        var panel = $('#aiPanel');
        if(panel) panel.classList.remove('open');
      }
    });

    window.addEventListener('hashchange', router);
  }

  function tickClock(){
    var el = document.getElementById('hudTime');

  function init(){    var theme = 'dark', role = 'persona';
    try{ theme = (function(){ try{ var q=(location.search.match(/[?&]theme=([a-z]+)/)||[])[1]; if(q) return q; return localStorage.getItem('hp-theme')||'dark'; }catch(e){ return 'dark'; } })(); role = localStorage.getItem('hp-role')||'persona'; }catch(e){}
    applyTheme(theme);
    bind();
    if(!ROLES[role]) role = 'persona';

    try{

    }catch(e){}
  }

  window.HP = {
    toast: toast, modal: modal, applyTheme: applyTheme, openMatch: openMatchFrame,
    getRole: function(){ return currentRole; },
    getView: function(){ return currentView; },
    ROLES: ROLES
  };

  document.addEventListener('DOMContentLoaded', function(){
    var ready = window.HP_READY;

    document.addEventListener('hp:boot', function(){
      try { syncRoleSwitch(); } catch(e) {}
    });
    /* boot 可能比首次 renderNav 晚，补两次兜底同步 */
    setTimeout(function(){ try { syncRoleSwitch(); } catch(e) {} }, 600);
    setTimeout(function(){ try { syncRoleSwitch(); } catch(e) {} }, 1800);
    /* 语言切换：重建侧边栏与面包屑（页面内容由各模块监听同一事件自己刷新） */
    document.addEventListener('hp:lang', function(){
      try { renderNav(); updateCrumb(); } catch(e){ console.warn('nav i18n', e); }
      /* 数据型视图（简历库/经营看板/生意账）会缓存接口结果，切语言要清缓存后重拉 */
      try {
        if (window.HPPOOL && window.HPPOOL.invalidate) window.HPPOOL.invalidate();
        if (window.HPCONSOLE && window.HPCONSOLE.invalidate) window.HPCONSOLE.invalidate();
        if (window.HPJOBANALYSIS && window.HPJOBANALYSIS.invalidate) window.HPJOBANALYSIS.invalidate();
        if (window.HPJOBS && window.HPJOBS.invalidate) window.HPJOBS.invalidate();
        if (window.HPREPORT && window.HPREPORT.invalidate) window.HPREPORT.invalidate();
        setTimeout(function () { try { showView(); } catch (e) {} }, 30);
      } catch (e) {}
      /* 把所有内嵌页面（分析页 / 全球态势）一起切语言 */
      try {
        var L = window.HPI18N.lang();
        document.querySelectorAll('iframe').forEach(function (f) {
          try {
            if (f.contentWindow && f.contentWindow.HPI18N &&
                f.contentWindow.HPI18N.lang() !== L) {
              f.contentWindow.HPI18N.set(L);
            }
          } catch (e) { /* 跨域忽略 */ }
        });
      } catch (e) {}
    });

    // 便捷入口：app.html?as=persona|company|assurance 自动登录并直达
    function autoLogin(){
      var q = new URLSearchParams(location.search);
      var as = (q.get('as') || '').trim();
      if(!as || ['persona','company','assurance'].indexOf(as) < 0) return Promise.resolve(false);
      if(!window.HPBridge || !window.HPBridge.isOnline()) return Promise.resolve(false);
      var go = q.get('to') || (as === 'persona' ? 'discover' : as === 'company' ? 'match' : 'globe');
      /* 三端分离：先用演示账号登录，再切到目标端；只有它能切 */
      var stripQuery = function () {
        /* 深链用完即清，避免刷新时又按演示账号登录、被误认为"还能切" */
        try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
      };
      return window.HPBridge.login('persona', { accountId: '13800138000' }).then(function(){
        if (as === 'persona') { location.hash = '#/persona/' + go; stripQuery(); return true; }
        return window.HPBridge.login(as).then(function(){
          location.hash = '#/' + as + '/' + go;
          stripQuery();
          return true;
        });
      }).catch(function(){ return false; });
    }

    function boot(){
      var r2 = window.HP_READY;
      if(r2 && r2.then){ r2.then(init).catch(function(e){ console.error('boot', e); init(); }); }
      else { init(); }
    }

    if(ready && ready.then){
      ready.then(autoLogin).then(boot).catch(function(e){
        /* 没登录时 bootstrap 会 401：深链（?as=xxx）要先自动登录再进，
           否则会被直接踢回 login.html，看起来像“链接失效”。 */
        console.error('boot', e);
        autoLogin().then(boot).catch(function(){ init(); });
      });
    } else {
      boot();
    }
  });
})();
</script>

  function fmtSize(n){
    if(!n) return '—';
    if(n < 1024) return n + ' B';
    if(n < 1024*1024) return (n/1024).toFixed(0) + ' KB';
    return (n/1024/1024).toFixed(1) + ' MB';
  }

  /**
   * 真实文件上传：选择/拖拽 → 进度条 → 落盘后刷新档案
   * @param {string} label 展示名
   * @param {string} docId 后端材料 ID
   * @param {function} onUploaded 成功回调（收到 {persona, meta}）
   */
  function openUploader(label, docId, onUploaded){
    var selected = null;
    var online = !!(window.HPBridge && window.HPBridge.isOnline());

    window.HP.modal({
      title:'上传材料 · '+label,
      body:'<div id="hpDrop" style="padding:22px;border:2px dashed var(--border);border-radius:12px;text-align:center;color:var(--text-3);cursor:pointer;transition:border-color .15s,background .15s"><div style="font-size:30px;margin-bottom:8px">📄</div><div style="font-size:13px;color:var(--text-2)">点击选择，或把文件拖到这里</div><div style="font-size:11.5px;margin-top:6px">支持 PDF / JPG / PNG / WebP · 单文件 ≤ 10MB</div></div>'+
           '<div id="hpPick" style="margin-top:12px;font-size:12.5px;color:var(--text-2);min-height:18px"></div>'+
           '<div id="hpProgWrap" class="hide" style="margin-top:12px"><div class="progress"><span id="hpBar" style="width:0%"></span></div><div class="t-muted" id="hpPct" style="font-size:11.5px;margin-top:6px">0%</div></div>'+
           (online ? '' : '<div class="t-muted" style="margin-top:10px;font-size:11.5px">未连接后端：仅记录文件名，不会真正保存文件</div>')+
           '<input type="file" id="hpFile" accept=".pdf,.jpg,.jpeg,.png,.webp" style="display:none">',
      actions:[{text:'取消'},{text:'确认上传', primary:true, onClick:function(close){
        if(!selected){ toast('请选择文件','点击虚线框选择要上传的材料'); return; }
        if(!online || !docId){
          close();
          onUploaded({ offline:true, fileName:selected.name, size:selected.size });
          return;
        }
        var confirmBtn = document.querySelector('.hp-modal-foot button[data-idx="1"]');
        if(confirmBtn){ confirmBtn.disabled = true; confirmBtn.textContent = '上传中…'; }
        var wrap = document.getElementById('hpProgWrap');
        if(wrap) wrap.classList.remove('hide');
        window.HPBridge.api.persona.uploadDocument(docId, selected, function(pct){
          var bar = document.getElementById('hpBar');
          if(bar) bar.style.width = pct + '%';
          var pctEl = document.getElementById('hpPct');
          if(pctEl) pctEl.textContent = '上传中… ' + pct + '%';
        }).then(function(res){
          close();
          onUploaded(res || {});
        }).catch(function(err){
          if(confirmBtn){ confirmBtn.disabled = false; confirmBtn.textContent = '确认上传'; }
          var pctEl = document.getElementById('hpPct');
          if(pctEl) pctEl.textContent = '上传失败：' + (err.message || '未知错误');
          toast('上传失败', err.message || '请稍后重试');
        });
      }}]
    });

    var drop = document.getElementById('hpDrop');
    var input = document.getElementById('hpFile');
    function setFile(f){
      if(!f) return;
      if(f.size > 10*1024*1024){ toast('文件过大','单个文件需 ≤ 10MB'); return; }
      if(!/\.(pdf|jpe?g|png|webp)$/i.test(f.name)){ toast('格式不支持','仅支持 PDF / JPG / PNG / WebP'); return; }
      selected = f;
      var pick = document.getElementById('hpPick');
      if(pick) pick.innerHTML = '已选择：<b style="color:var(--text)">'+f.name+'</b> · '+fmtSize(f.size)+' · '+((f.type||'').replace('image/','')||'未知类型');
    }
    if(drop && input){
      drop.addEventListener('click', function(){ input.click(); });
      input.addEventListener('change', function(){ setFile(input.files && input.files[0]); });
      drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.style.borderColor = 'var(--primary)'; drop.style.background = 'var(--primary-weak)'; });
      drop.addEventListener('dragleave', function(e){ e.preventDefault(); drop.style.borderColor = 'var(--border)'; drop.style.background = 'transparent'; });
      drop.addEventListener('drop', function(e){
        e.preventDefault();
        drop.style.borderColor = 'var(--border)';
        drop.style.background = 'transparent';
        var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if(f) setFile(f);
      });
    }
  }

  function renderTodos(){
    var todos;
    if(DEMO.todos && DEMO.todos.length){
      todos = DEMO.todos.filter(function(t){ return !t.done; }).map(function(t){
        return {id:t.id, docId:t.docId, t:t.title, s:t.desc, chip:t.chip, cls:t.cls};
      });
    } else {
      todos = [
        {t:'补交学历证明', s:'签证预审必需 · 截止 10-25', chip:'紧急', cls:'chip-d'},
        {t:'补交体检报告', s:'指定医院体检 · 截止 10-30', chip:'待办', cls:'chip-w'}
      ];
      try{ var saved = JSON.parse(localStorage.getItem('hp-persona-todos')||'null'); if(saved) todos = todos.filter(function(x){ return saved.indexOf(x.t) < 0; }); }catch(e){}
    }

    var sub = document.getElementById('todoSub');

    if(!todos.length){ wrap.innerHTML = '<div class="t-muted" style="padding:20px;text-align:center">全部待办已处理 ✓</div>'; return; }
    wrap.innerHTML = todos.map(function(x){

      b.addEventListener('click', function(){
        var todoId = b.dataset.todoId;

          openUploader(b.dataset.todo, docId, function(res){

  /* 生成一份文本版合同并触发下载（纯前端，不依赖后端） */
  function downloadContract(name){
    var tpl = CONTRACT_TEMPLATE[name] || {};
    var lines = [name, '', '=== 合同主体 ==='];
    (tpl.parties || []).forEach(function(p){ lines.push(p[0] + '：' + p[1]); });
    lines.push('', '=== 合同条款 ===');
    (tpl.clauses || []).forEach(function(c){ lines.push('', c[0], c[1]); });
    lines.push('', '=== 签署 ===', '甲方签章：（已电子签章）', '乙方签字：张伟', '签署日期：2026-09-18',
               '', '本文件由平台合同系统生成（演示数据）。');
    try{
      var blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name.replace(/[《》\/\\:*?"<>|]/g, '_') + '.txt';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
      toast('已下载', '合同文本已保存到本地（演示）');
    }catch(e){
      toast('下载失败', e.message);
    }
  }

  function fundTime(iso){
    if(!iso) return '—';
    var d = new Date(iso);
    if(isNaN(d.getTime())) return '—';
    return d.toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-');
  }

  function fundChip(status){
    return status === 'approved' ? '<span class="chip chip-s">已通过</span>'
      : status === 'rejected' ? '<span class="chip chip-d">已驳回</span>'
        : '<span class="chip chip-w">待审批</span>';
  }

  /* 投递进度阶段（用于进度条） */
  var APPL_STAGES = ['已投递', '顾问确认', '企业查看', '邀约面试', '已录取'];

  function applStageIndex(status){
    if(status === '已录取') return 4;
    if(status === '面试中' || status === '邀约面试') return 3;
    if(status === '已查看' || status === '待面试') return 2;
    if(status === '待顾问确认') return 1;
    if(status === '已放弃') return -1;
    return 0;
  }

  function renderApplications(){
    var wrap = $('#myApplications', host);

    var list = DEMO.applications || [];

      ? (list.length + ' 条 · ' + list.filter(function(a){ return a.status === '待顾问确认'; }).length + ' 条待确认')

    /* 展开 / 收起 */

      b.addEventListener('click', function(ev){
        ev.stopPropagation();

      });
    });
    /* 点整行也能展开 */
    $$('.ap-item', wrap).forEach(function(item){
      item.addEventListener('click', function(ev){
        if(ev.target.closest('button')) return;
        var t = item.querySelector('.ap-toggle');
        if(t) t.click();
      });
    });
    /* 查看岗位详情 */
    $$('[data-appl-job]', wrap).forEach(function(b){
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        var a = list[+b.dataset.applJob];

        }

        ev.stopPropagation();
        var idx = +b.dataset.applWithdraw;
