<head><script id="hp-direct-login-guard">
(function(){
  try {
    var t=sessionStorage.getItem('hp-token')||localStorage.getItem('hp-token');
    var logged=sessionStorage.getItem('hp-logged')||localStorage.getItem('hp-logged');
    /* ?as=persona|company|assurance 深链（演示/测试入口）由 autoLogin 负责登录，这里放行 */
    var as='';
    try { as = new URLSearchParams(location.search).get('as') || ''; } catch(e) {}
    if (!t && !logged && !as) location.replace('login.html');
  } catch(e) {}
})();
</script>

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  background-color:var(--bg); background-image:var(--bg-grad);
  color:var(--text); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block}

/* ============ 布局 ============ */
.app{display:flex;height:100vh;height:calc(100vh / var(--hp-zoom,1))}
/* 大字号缩放下，整页高度按 zoom 反算，避免最后一行被顶出屏幕 */
html,body{overflow:hidden}
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand-logo{width:38px;height:38px;border-radius:11px;flex:0 0 38px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 14px rgba(37,99,235,.32)}
.brand-name{font-size:15px;font-weight:700;line-height:1.3}
.brand-sub{font-size:11px;color:var(--text-3)}
.role-switch{margin:4px 14px 12px;display:flex;gap:4px;padding:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:99px}
.role-opt{flex:1;padding:7px 0;border:none;background:transparent;border-radius:99px;font-size:12.5px;color:var(--text-2);font-weight:500;transition:all .18s}
.role-opt.active{background:var(--surface);color:var(--primary);font-weight:600;box-shadow:var(--shadow)}
.nav{flex:1;padding:6px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;margin:2px 0;border-radius:10px;color:var(--text-2);font-weight:500;cursor:pointer;transition:all .18s}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--primary-weak);color:var(--primary);font-weight:600}
.nav-item .ico{width:18px;height:18px;flex:0 0 18px}
.sidebar-foot{padding:12px 14px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;flex:0 0 34px;background:linear-gradient(135deg,var(--accent),var(--primary));color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.u-name{font-size:13px;font-weight:600}
.u-role{font-size:11px;color:var(--text-3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;flex:0 0 60px;display:flex;align-items:center;gap:12px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--border);z-index:10}
.crumb{font-size:13px;color:var(--text-3)}
.crumb b{color:var(--text);font-weight:600}
.spacer{flex:1}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);display:flex;align-items:center;justify-content:center;position:relative;transition:all .18s}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}

/* ============ 工作台容器 ============ */
.workspace{flex:1;position:relative;overflow-y:auto;overflow-x:hidden;padding:var(--sp-6) var(--sp-7) var(--sp-8)}
.workspace > .subapp{display:none}
.workspace > .subapp.active{display:block}
.workspace .view{display:none}
.workspace .view.active{display:block;animation:fadeUp .3s ease both;opacity:1}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ 骨架屏 ============ */
.skeleton{position:absolute;inset:0;padding:24px 26px;background:var(--bg);z-index:5}
.skeleton.hide{display:none}
.sk-bar{height:36px;border-radius:10px;background:var(--surface-2);margin-bottom:16px;animation:pulse 1.2s infinite}
.sk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.sk-card{height:110px;border-radius:14px;background:var(--surface-2);animation:pulse 1.2s infinite}
.sk-line{height:220px;border-radius:14px;background:var(--surface-2);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

/* ============ 登录遮罩（跟随主题） ============ */
.login-mask{position:fixed;inset:0;z-index:200;background:var(--bg-grad);background-color:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .35s}
.login-mask.hide{opacity:0;pointer-events:none}
.login-lang{position:absolute;top:20px;right:24px;display:flex;gap:8px;flex-wrap:wrap;z-index:2}
html[dir="rtl"] .login-lang{right:auto;left:24px;flex-direction:row-reverse}
.login-lang button{padding:7px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:12.5px;cursor:pointer;transition:.2s;white-space:nowrap}
.login-lang button:hover{border-color:var(--primary);color:var(--primary)}
.login-lang button.on{background:var(--primary);border-color:var(--primary);color:var(--mt-glyph);font-weight:600}
.login-wrap{width:100%;max-width:880px}
.login-brand{text-align:center;margin-bottom:32px}
.login-logo{width:60px;height:60px;border-radius:16px;margin:0 auto 14px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 10px 30px var(--mt-cardGlow)}
.login-brand h1{font-size:24px;font-weight:700;color:var(--text)}
.login-brand p{color:var(--text-3);font-size:13.5px;margin-top:6px}
.login-roles{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
@media(max-width:680px){.login-roles{grid-template-columns:1fr}}
.login-role{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;cursor:pointer;text-align:left;color:var(--text);font-family:inherit;box-shadow:var(--shadow-lg);transition:border-color .22s,transform .22s,box-shadow .22s}
.login-role:hover{border-color:var(--primary);transform:translateY(-4px);box-shadow:0 24px 70px var(--mt-cardGlow)}
.login-role .ico{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;background:var(--primary-weak);color:var(--primary)}
.login-role.company .ico{background:var(--accent-weak);color:var(--accent)}
.login-role h2{font-size:18px;font-weight:700;margin-bottom:6px}
.login-role p{color:var(--text-2);font-size:13px;line-height:1.7}
.login-foot{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap}
.demo-btn{background:linear-gradient(135deg,var(--primary),var(--primary-strong));color:#fff;border:none;padding:11px 26px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(56,189,248,.35)}
.demo-btn:hover{filter:brightness(1.1)}
.link-btn{color:var(--text-3);font-size:12.5px;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit}
.link-btn:hover{color:var(--text-2)}

/* ============ 通用组件 ============ */
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:var(--fs-xl);font-weight:700;letter-spacing:.3px;line-height:var(--lh-tight)}
.page-head .desc{color:var(--text-2);font-size:13px;margin-top:3px}
.page-head .actions{margin-left:auto;display:flex;gap:10px}
.demo-tag{font-size:11px;color:var(--gold);background:var(--gold-weak);border:1px solid color-mix(in srgb, var(--gold) 35%, transparent);padding:2px 9px;border-radius:99px;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;border:1px solid transparent;transition:filter .15s, background .15s}
.btn-p{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.28)}
.btn-p:hover{filter:brightness(1.08)}
.btn-o{background:transparent;color:var(--primary);border-color:var(--border-strong)}
.btn-o:hover{background:var(--primary-weak)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow)}
.card-pad{padding:var(--card-pad)}
.card-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-title .sub{font-size:12px;color:var(--text-3);font-weight:400;margin-left:auto}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:16px}
@media(max-width:1180px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{padding:var(--sp-4) var(--sp-5);position:relative;overflow:hidden}
  /* 可点击下钻的 KPI 卡片 */
  .kpi-click{cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
  .kpi-click::after{
    content:"›";position:absolute;right:14px;top:50%;transform:translateY(-50%);
    font-size:18px;color:var(--text-3);opacity:0;transition:opacity .18s,right .18s;
  }
  .kpi-click:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .kpi-click:hover::after{opacity:1;right:10px;color:var(--primary)}
  .kpi-click:active{transform:translateY(0)}
  .kpi-click:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  /* 空状态 */
  .hp-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:38px 20px;text-align:center;gap:10px}
  .hp-empty-ico{font-size:38px;line-height:1;opacity:.85;margin-bottom:4px}
  .hp-empty-title{font-size:14px;font-weight:650;color:var(--text)}
  .hp-empty-desc{font-size:12.5px;color:var(--text-2);line-height:1.75;max-width:420px}
  .hp-empty-btn{margin-top:6px}
.kpi .k-label{font-size:12.5px;color:var(--text-2)}
.kpi .k-num{font-size:var(--fs-2xl);font-weight:700;margin:var(--sp-1) 0 2px;font-variant-numeric:tabular-nums;line-height:var(--lh-tight)}
.kpi .k-num small{font-size:14px;font-weight:600;color:var(--text-2)}
.kpi .k-foot{font-size:11.5px;color:var(--text-3)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip-s{background:var(--success-weak);color:var(--success)}
.chip-w{background:var(--warning-weak);color:var(--warning)}
.chip-d{background:var(--danger-weak);color:var(--danger)}
.chip-i{background:var(--info-weak);color:var(--info)}
.chip-p{background:var(--primary-weak);color:var(--primary)}
.chip-g{background:var(--surface-2);color:var(--text-2)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-size:12px;color:var(--text-3);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--border)}
.table td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:var(--surface-2)}
.t-strong{font-weight:600}.t-muted{color:var(--text-3);font-size:12px}.t-num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row .r-main{flex:1;min-width:0}
.row .r-title{font-size:13.5px;font-weight:600}
.row .r-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.row .r-ico{width:36px;height:36px;border-radius:9px;flex:0 0 36px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--primary)}
.progress{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.progress>span{display:block;height:100%;border-radius:99px;background:var(--primary)}
.progress.warn>span{background:var(--warning)}
.progress.ok>span{background:var(--success)}
.tl{display:grid;grid-template-columns:74px 22px 1fr;row-gap:0}
.tl-item{display:contents}
.tl-time{padding:13px 6px 13px 0;text-align:right;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;align-self:start}
.tl-track{display:flex;justify-content:center;position:relative}
.tl-track::before{content:"";position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--border-strong)}
.tl-item:first-child .tl-track::before{top:12px}
.tl-item:last-child .tl-track::before{bottom:auto;height:calc(100% - 12px)}
.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--primary);z-index:1;margin-top:17px}
.tl-item.done .tl-dot{background:var(--primary)}
.tl-item.now .tl-dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-weak)}
.tl-item.wait .tl-dot{border-color:var(--border-strong);background:var(--surface)}
.tl-body{padding:8px 0 8px 16px;align-self:start}
.tl-title{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.tl-desc{font-size:12px;color:var(--text-3);margin-top:2px}
.tl-item.wait .tl-title{color:var(--text-3);font-weight:500}
.divider{height:1px;background:var(--border);border:none;margin:16px 0}

/* ============ Toast ============ */
#toast-wrap{position:fixed;top:76px;right:24px;z-index:300;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px 16px;min-width:240px;max-width:340px;font-size:13px;display:flex;gap:10px;align-items:flex-start;animation:toastIn .25s ease}
.toast .ico{width:17px;height:17px;color:var(--primary);flex:0 0 17px;margin-top:1px}
.toast b{display:block;font-size:13px}
.toast span{color:var(--text-2);font-size:12px}
@keyframes toastIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

/* ============ Modal ============ */
.hp-frame-mask{
    position:fixed;inset:0;z-index:9998;background:rgba(3,7,14,.82);
    backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .hp-frame{
    width:min(1420px,100%);height:min(900px,100%);display:flex;flex-direction:column;
    border-radius:16px;overflow:hidden;border:1px solid rgba(56,189,248,.35);
    background:var(--mt-bg2);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(56,189,248,.12);
  }
  .hp-frame-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 14px;background:rgba(9,16,27,.95);border-bottom:1px solid rgba(56,189,248,.18);
  }
  .hp-frame-head b{font-size:13px;letter-spacing:.6px;color:var(--mt-text)}
  .hp-frame-head .acts{display:flex;gap:8px;align-items:center}
  /* 浮层内的语言按钮（浮层遮挡顶栏时仍可切换） */
  .hp-frame-lang{display:flex;gap:5px;margin-right:4px}
  .hp-frame-lang button{padding:5px 11px;border-radius:99px;cursor:pointer;font-size:12px;
    border:1px solid rgba(120,200,255,.22);background:transparent;color:var(--text-3);transition:.18s}
  .hp-frame-lang button:hover{border-color:var(--primary);color:var(--primary)}
  .hp-frame-lang button.on{background:var(--primary);border-color:var(--primary);color:var(--mt-glyph);font-weight:600}
  .hp-frame iframe{flex:1;width:100%;border:0;background:var(--mt-bg2)}
  /* ============ AI 匹配（科技感原生面板） ============ */
  .mt-stage{position:relative;border-radius:18px;padding:2px;background:linear-gradient(135deg,var(--mt-edge1),var(--mt-edge2) 45%,var(--mt-edge3))}
  .mt-stage-in{position:relative;border-radius:16px;background:linear-gradient(170deg,var(--mt-bg1),var(--mt-bg2));overflow:hidden}
  .mt-stage-in::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(var(--mt-grid) 1px,transparent 1px),linear-gradient(90deg,var(--mt-grid) 1px,transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 100%);
  }
  .mt-hero{position:relative;display:flex;gap:26px;align-items:center;flex-wrap:wrap;padding:22px 24px}
  .mt-ring{position:relative;width:150px;height:150px;flex:none}
  .mt-ring svg{transform:rotate(-90deg)}
  .mt-ring .track{stroke:var(--mt-track)}
  .mt-ring .bar{stroke:url(#mtRingGrad);stroke-linecap:round;filter:drop-shadow(0 0 10px rgba(56,189,248,.7));transition:stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1)}
  .mt-ring-num{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:12px;font-size:40px;font-weight:800;letter-spacing:-1.5px;color:#f2fbff;text-shadow:0 0 26px rgba(56,189,248,.5);font-variant-numeric:tabular-nums}
  .mt-ring-num i{font-style:normal;font-size:12px;font-weight:600;color:var(--mt-dim);margin-left:3px;letter-spacing:0}
  .mt-hero-main{flex:1;min-width:240px}
  .mt-hero-title{font-size:17px;font-weight:700;color:var(--mt-text);letter-spacing:.3px}
  .mt-hero-sub{font-size:12px;color:var(--mt-dim);margin-top:5px}
  .mt-parts{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}
  .mt-part{min-width:64px}
  .mt-part .k{font-size:10.5px;color:#7e94b3;letter-spacing:.5px}
  .mt-part .v{font-size:15px;font-weight:700;color:var(--mt-text);font-variant-numeric:tabular-nums}
  .mt-part .bar{height:4px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}
  .mt-part .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#38bdf8,#7dd3fc);box-shadow:0 0 10px rgba(56,189,248,.6);transition:width .9s cubic-bezier(.16,1,.3,1)}

  .mt-toolbar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:0 24px 18px}
  .mt-field{display:flex;flex-direction:column;gap:6px;min-width:190px}
  .mt-field label{font-size:11.5px;color:var(--mt-dim);letter-spacing:.4px}
  .mt-field label b{color:var(--mt-text);font-variant-numeric:tabular-nums}
  .mt-field select{padding:9px 12px;border-radius:10px;border:1px solid var(--mt-line);background:var(--mt-input);color:var(--mt-text);font-size:12.5px;outline:none}
  .mt-field select:focus{border-color:rgba(56,189,248,.6);box-shadow:0 0 18px rgba(56,189,248,.18)}
  .mt-tuner{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 24px;padding:0 24px 4px}
  .mt-tuner input[type=range]{width:100%;height:4px;-webkit-appearance:none;appearance:none;border-radius:3px;background:linear-gradient(90deg,rgba(56,189,248,.85),rgba(125,211,252,.85));outline:none}
  .mt-tuner input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#eafeff;border:2px solid #38bdf8;box-shadow:0 0 12px rgba(56,189,248,.85);cursor:pointer}
  .mt-hint{font-size:11.5px;color:var(--mt-dim);padding:0 24px 18px}
  .mt-hint b{color:var(--mt-accent)}

  .mt-cards{display:grid;gap:10px;padding:0 24px 24px}
  .mt-card{
    position:relative;display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:14px;
    background:linear-gradient(120deg,var(--mt-card1),var(--mt-card2));
    border:1px solid var(--mt-cardLine);
    opacity:0;transform:translateY(10px);
    animation:mtIn .5s cubic-bezier(.16,1,.3,1) forwards;
    transition:border-color .3s,box-shadow .3s,transform .3s;
  }
  .mt-card:hover{border-color:var(--mt-cardHover);box-shadow:0 0 28px var(--mt-cardGlow);transform:translateY(-1px)}
  .mt-card.top{border-color:var(--mt-cardHover);background:linear-gradient(120deg,var(--mt-cardTop1),var(--mt-cardTop2));box-shadow:0 0 30px var(--mt-cardGlow)}
  .mt-card.top::after{content:"";position:absolute;left:14px;right:14px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(56,189,248,.9),transparent)}
  @keyframes mtIn{to{opacity:1;transform:none}}
  .mt-rank{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:rgba(255,255,255,.07);color:var(--mt-dim)}
  .mt-card.top .mt-rank{background:linear-gradient(145deg,var(--mt-accent),var(--mt-violet));color:var(--mt-glyph);box-shadow:0 0 18px rgba(56,189,248,.55)}
  .mt-main{flex:1;min-width:0}
  .mt-name{font-size:13.5px;font-weight:650;color:var(--mt-text);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .mt-name .t-muted{font-weight:400;font-size:11.5px;color:#7e94b3}
  .mt-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .mt-chips .chip{font-size:11px;padding:3px 8px;border-radius:6px}
  .mt-right{display:flex;align-items:center;gap:12px;flex:none}
  .mt-score{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.8px;min-width:52px;text-align:right}
  .mt-score i{font-style:normal;font-size:10.5px;font-weight:500;margin-left:2px;opacity:.65}
  .mt-score.hi{color:var(--mt-accent);text-shadow:0 0 18px rgba(56,189,248,.5)}
  .mt-score.mid{color:#f5b94a}
  .mt-score.low{color:var(--mt-dim)}
  .mt-mini{width:38px;height:38px;flex:none;position:relative}
  .mt-mini svg{transform:rotate(-90deg)}
  .mt-mini .t{stroke:rgba(255,255,255,.08)}
  .mt-mini .b{stroke:url(#mtRingGrad);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.16,1,.3,1)}

  /* 推理弹层 */
  .mt-trace-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid rgba(120,200,255,.15)}
  .mt-trace-score{font-size:34px;font-weight:800;color:var(--mt-accent);text-shadow:0 0 24px rgba(56,189,248,.5);font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .mt-trace-score i{font-style:normal;font-size:12px;color:var(--mt-dim);margin-left:2px}
  .mt-trace-parts{display:flex;gap:12px;flex-wrap:wrap}
  .mt-tp{font-size:10.5px;color:#7e94b3;text-align:center;min-width:46px}
  .mt-tp b{display:block;font-size:13px;color:var(--mt-text);margin-top:2px}
  .mt-block{margin-top:16px}
  .mt-block-t{font-size:11.5px;font-weight:700;letter-spacing:.8px;color:#7e94b3;margin-bottom:8px}
  .mt-block-t.warn{color:#f5b94a}
  .mt-block ul{margin:0;padding-left:18px;font-size:13px;line-height:1.9;color:var(--text)}
  .mt-timeline{position:relative;padding-left:26px;margin-top:6px}
  .mt-timeline::before{content:"";position:absolute;left:8px;top:8px;bottom:12px;width:1px;background:linear-gradient(180deg,rgba(56,189,248,.6),rgba(56,189,248,.05))}
  .mt-step{position:relative;padding:9px 0;border-bottom:1px dashed rgba(120,200,255,.12)}
  .mt-step:last-child{border-bottom:0}
  .mt-step::before{content:"";position:absolute;left:-23px;top:15px;width:9px;height:9px;border-radius:50%;background:#0a1524;border:1px solid rgba(56,189,248,.6);box-shadow:0 0 10px rgba(56,189,248,.5)}
  .mt-step-h{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--mt-text)}
  .mt-step-h span{font-size:11px;color:#7e94b3;font-weight:400}
  .mt-step-b{font-size:12.5px;color:#9db6d4;margin-top:5px;line-height:1.65}
  .mt-step-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

  /* ===== 岗位发现 ===== */
  .mt-filters{padding:6px 24px 14px;display:grid;gap:10px}
  .mt-search{width:100%;padding:11px 14px;border-radius:11px;border:1px solid rgba(120,200,255,.22);background:var(--mt-input);color:var(--mt-text);font-size:13px;outline:none}
  .mt-search:focus{border-color:rgba(56,189,248,.6);box-shadow:0 0 20px rgba(56,189,248,.15)}
  .mt-frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .mt-flab{font-size:11px;letter-spacing:1px;color:#7e94b3;min-width:34px}
  .mt-fchips{display:flex;gap:6px;flex-wrap:wrap}
  .mt-fchips .chip{cursor:pointer;opacity:1;transition:all .2s}
  .mt-fchips .chip:hover{opacity:1;border-color:var(--mt-cardHover)}
  .mt-fchips .chip.on{opacity:1;background:var(--primary-weak);border-color:var(--primary);color:var(--primary);font-weight:650}

  .mt-list-head{display:flex;align-items:center;gap:12px;padding:0 24px 10px;font-size:12px;color:var(--mt-dim)}
  .mt-list-head b{color:var(--mt-text);font-size:13px}

  .mt-check{display:flex;align-items:center;padding-right:4px}
  .mt-check input{width:16px;height:16px;accent-color:var(--mt-accent);cursor:pointer}

  .mt-batchbar{position:sticky;bottom:0;padding:0 24px 18px;opacity:0;pointer-events:none;transition:opacity .25s}
  .mt-batchbar.show{opacity:1;pointer-events:auto}
  .mt-batch-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;
    background:linear-gradient(120deg,rgba(56,189,248,.14),rgba(125,211,252,.1));
    border:1px solid rgba(56,189,248,.45);box-shadow:0 10px 34px rgba(0,0,0,.45),0 0 26px rgba(56,189,248,.16);backdrop-filter:blur(8px)}
  .mt-batch-in span{font-size:12.5px;color:var(--text)}
  .mt-batch-in b{color:var(--mt-accent);font-size:15px}

  .mt-offer{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    margin:0 24px 6px;padding:14px 16px;border-radius:13px;
    background:linear-gradient(120deg,rgba(52,211,153,.14),rgba(56,189,248,.06));
    border:1px solid rgba(52,211,153,.45)}

  /* ===== 分析舞台 ===== */
  .mt-run-mask{position:fixed;inset:0;z-index:9999;background:rgba(3,7,14,.86);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:24px}
  .mt-run{width:min(1240px,100%);height:min(760px,100%);display:flex;flex-direction:column;border-radius:18px;overflow:hidden;
    background:linear-gradient(170deg,var(--mt-bg1),var(--mt-bg2));border:1px solid var(--mt-cardHover);
    box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 60px rgba(56,189,248,.16)}
  .mt-run-head{display:flex;align-items:center;gap:16px;padding:14px 18px;border-bottom:1px solid rgba(56,189,248,.16)}
  .mt-run-head b{font-size:14px;letter-spacing:.4px;color:var(--mt-text)}
  .mt-run-hud{display:flex;gap:16px;font-size:12px;color:var(--mt-dim)}
  .mt-run-hud span{font-variant-numeric:tabular-nums}
  .mt-run-body{flex:1;display:grid;grid-template-columns:1.15fr .85fr;gap:0;min-height:0}
  .mt-run-steps{padding:18px 20px;overflow:auto;border-right:1px solid rgba(56,189,248,.12)}
  .mt-run-step{display:flex;gap:12px;padding:10px 0;opacity:0;transform:translateY(8px);animation:mtIn .35s var(--ease, cubic-bezier(.16,1,.3,1)) forwards}
  .mt-run-step i{width:9px;height:9px;border-radius:50%;border:1px solid var(--mt-accent);background:#0a1524;margin-top:6px;flex:none;box-shadow:0 0 10px rgba(56,189,248,.5);transition:all .3s}
  .mt-run-step.done i{background:var(--mt-ok);border-color:var(--mt-ok);box-shadow:0 0 12px rgba(52,211,153,.7)}
  .mt-run-step b{display:block;font-size:13px;color:var(--mt-text);font-weight:600}
  .mt-run-step span{display:block;font-size:12.5px;color:#9db6d4;margin-top:3px;line-height:1.6}
  .mt-run-queue{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:8px}
  .mt-q{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;border:1px solid var(--mt-cardLine);background:rgba(255,255,255,.03);transition:all .3s}
  .mt-q.active{border-color:rgba(56,189,248,.6);box-shadow:0 0 22px rgba(56,189,248,.2);transform:translateX(2px)}
  .mt-q.done{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.06)}
  .mt-q-i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;background:rgba(255,255,255,.07);color:var(--mt-dim);flex:none}
  .mt-q.active .mt-q-i{background:linear-gradient(145deg,var(--mt-accent),var(--mt-violet));color:var(--mt-glyph)}
  .mt-q-main{flex:1;min-width:0}
  .mt-q-t{font-size:12.5px;font-weight:600;color:var(--mt-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mt-q-s{font-size:11px;color:#7e94b3}
  .mt-q-score{font-size:16px;font-weight:800;color:var(--mt-accent);font-variant-numeric:tabular-nums}

  .mt-cmp{width:100%;border-collapse:collapse;font-size:12.5px}
  .mt-cmp th,.mt-cmp td{padding:9px 10px;border-bottom:1px solid rgba(120,200,255,.14);text-align:left;vertical-align:top}
  .mt-cmp thead th{color:var(--mt-text);font-size:13px}

  /* 分析舞台增强 */
  .mt-run-mask{background:rgba(2,6,12,.9)}
  .mt-run-mask::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(120,200,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,200,255,.07) 1px,transparent 1px);
    background-size:54px 54px;
    mask-image:radial-gradient(ellipse 75% 65% at 50% 40%,#000 30%,transparent 100%);
  }
  .mt-run{width:min(1320px,100%);height:min(820px,100%);position:relative}
  .mt-run::after{
    content:"";position:absolute;left:0;right:0;top:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(56,189,248,.8),transparent);
    animation:mtScan 3.6s linear infinite;
  }
  @keyframes mtScan{0%{transform:translateY(0);opacity:.2}50%{opacity:.9}100%{transform:translateY(820px);opacity:0}}
  .mt-run-steps{position:relative;padding-left:34px}
  .mt-run-steps::before{
    content:"";position:absolute;left:15px;top:14px;bottom:14px;width:1px;
    background:linear-gradient(180deg,rgba(56,189,248,.65),rgba(56,189,248,.05));
  }
  .mt-run-step{position:relative;gap:14px}
  .mt-run-step i{position:absolute;left:-24px;top:8px;margin:0}
  .mt-run-step i::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(56,189,248,.25);animation:mtPulse 1.6s ease-in-out infinite}
  @keyframes mtPulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.5);opacity:0}}
  .mt-run-step b{font-size:13.5px}
  .mt-run-queue .mt-q{position:relative;overflow:hidden}
  .mt-q.done{box-shadow:0 0 22px rgba(52,211,153,.16)}
  .mt-q.done .mt-q-score{color:#34d399;text-shadow:0 0 16px rgba(52,211,153,.6)}
  .mt-q.active{animation:mtQIn .4s var(--ease, cubic-bezier(.16,1,.3,1))}
  @keyframes mtQIn{from{transform:translateX(-6px);opacity:.6}to{transform:none;opacity:1}}
  .mt-run-finish{
    position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,9,16,.72);z-index:5;
    animation:mtFade .3s ease forwards;
  }
  .mt-run-finish b{font-size:64px;font-weight:800;color:var(--mt-accent);text-shadow:0 0 40px rgba(56,189,248,.6);letter-spacing:-2px}
  .mt-run-finish span{display:block;text-align:center;color:var(--mt-dim);font-size:13px;margin-top:6px;letter-spacing:2px}
  @keyframes mtFade{from{opacity:0}to{opacity:1}}
  .mt-guide{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:12px;color:#9db6d4;
    background:var(--surface-2);border:1px dashed rgba(56,189,248,.28)}
  .mt-guide b{color:var(--mt-accent)}

  /* 内联分析舞台（与页面同宽） */
  .mt-flow{display:grid;gap:14px}
  .mt-flow-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;
    background:var(--surface);border:1px solid var(--border)}
  .mt-flow-steps{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .mt-flow-steps i{width:26px;height:1px;background:var(--border);display:inline-block}
  .mt-flow-steps .done{color:#34d399}
  .mt-flow-steps .on{color:var(--fg);font-weight:700}
  .mt-flow-hud{display:flex;gap:14px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .mt-flow-body{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;align-items:start}
  .mt-flow-left,.mt-flow-right{min-height:420px}
  .mt-flow-cur-t{font-size:16px;font-weight:700}
  .mt-flow-cur-s{font-size:12px;color:var(--muted);margin-top:3px}
  .mt-flow-steps-list{margin-top:14px;max-height:280px;overflow:auto;padding-left:22px;position:relative}
  .mt-flow-steps-list::before{content:"";position:absolute;left:7px;top:8px;bottom:10px;width:1px;background:var(--border)}
  .mt-flow-step{position:relative;display:flex;gap:12px;padding:7px 0;opacity:0;transform:translateY(6px);animation:mtStepIn .3s ease forwards}
  .mt-flow-step i{position:absolute;left:-19px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--surface);border:1px solid var(--border);transition:all .25s}
  .mt-flow-step.done i{background:var(--mt-ok);border-color:var(--mt-ok)}
  .mt-flow-step b{display:block;font-size:13px}
  .mt-flow-step span{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.6}
  @keyframes mtStepIn{to{opacity:1;transform:none}}
  .mt-flow-parts{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
  .mt-queue{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .mt-qi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2,var(--surface));transition:all .25s}
  .mt-qi.active{border-color:rgba(56,189,248,.55);box-shadow:0 0 0 1px rgba(56,189,248,.16) inset}
  .mt-qi.done{border-color:rgba(52,211,153,.45)}
  .mt-qi-i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;background:var(--surface);color:var(--muted);flex:none}
  .mt-qi.active .mt-qi-i{background:var(--mt-accent);color:var(--mt-glyph)}
  .mt-qi.done .mt-qi-i{background:var(--mt-ok);color:var(--mt-glyph)}
  .mt-qi-main{flex:1;min-width:0}
  .mt-qi-t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mt-qi-s{font-size:11px;color:var(--muted)}
  .mt-qi-score{font-size:16px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .mt-qi.done .mt-qi-score{color:#34d399}

  /* 岗位发现工具条 */
  .mt-toolbar2{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 24px 12px}
  .mt-all{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text);cursor:pointer;user-select:none}
  .mt-all input{width:15px;height:15px;accent-color:var(--mt-accent);cursor:pointer}
  .mt-count{font-size:12px;color:var(--mt-dim)}
  .mt-count b{color:var(--mt-text);font-size:13px}
  .mt-fsearch{display:flex;align-items:center;gap:10px}
  .mt-fsearch .mt-search{flex:1}

  /* 演示页内联嵌入 */
  .mt-embed-card{padding:0;overflow:hidden}
  .mt-embed-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
  .mt-embed-title{font-size:13.5px;font-weight:650;color:var(--fg)}
  .mt-embed-title .t-muted{font-weight:400;font-size:12px}
  .mt-embed{display:block;width:100%;height:calc(100vh - 210px);min-height:720px;border:0;background:var(--mt-bg2)}

  /* 舞台返回条 */
  .hps-backbar{position:relative;z-index:6;display:flex;align-items:center;gap:12px;padding:10px 16px;
    background:rgba(8,14,24,.92);border-bottom:1px solid rgba(120,200,255,.16)}
  .hps-back{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:8px;cursor:pointer;
    border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text)}
  .hps-back:hover{border-color:rgba(56,189,248,.6);background:rgba(56,189,248,.16)}
  .hps-backtip{font-size:12px;color:var(--mt-dim)}

  /* 语言选择 */
  .hp-lang{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .hp-lang select{background:var(--surface);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:5px 8px;font:inherit;font-size:12px;cursor:pointer}

  /* 简历卡片与详情 */
  .mt-ava{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;background:rgba(56,189,248,.12);display:grid;place-items:center;border:1px solid var(--border-strong)}
  .mt-ava img{width:100%;height:100%;object-fit:cover;display:block}
  .mt-ava span{font-size:15px;font-weight:700;color:var(--mt-accent)}
  .mt-click{cursor:pointer}
  .mt-res-head{display:flex;gap:18px;align-items:flex-start;padding:20px 24px;flex-wrap:wrap;border-bottom:1px solid rgba(120,200,255,.14)}
  .mt-res-photo{width:96px;height:120px;border-radius:12px;object-fit:cover;border:1px solid rgba(120,200,255,.35);flex:none}
  .mt-res-photo.ph{display:grid;place-items:center;background:var(--surface-2);font-size:34px;color:var(--mt-accent)}
  .mt-res-main{flex:1;min-width:220px}
  .mt-res-name{font-size:20px;font-weight:750;color:var(--mt-text)}
  .mt-res-name span{font-size:12.5px;font-weight:400;color:var(--mt-dim);margin-left:10px}
  .mt-res-sub{font-size:13px;color:#9db6d4;margin-top:5px}
  .mt-res-act{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
  .mt-res-grid{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:12px;padding:16px 24px 24px}
  @media(max-width:1100px){.mt-res-grid{grid-template-columns:1fr}}
  .mt-hist{padding:8px 0;border-bottom:1px dashed rgba(120,200,255,.12)}
  .mt-hist:last-child{border-bottom:0}
  .mt-hist-t{font-size:13px;font-weight:650;color:var(--mt-text);display:flex;justify-content:space-between;gap:10px}
  .mt-hist-t span{font-size:11.5px;color:#7e94b3;font-weight:400}
  .mt-hist-d{font-size:12.5px;color:#9db6d4;margin-top:4px;line-height:1.65}
  .mt-res-intro{font-size:13px;line-height:1.9;color:var(--text)}
  /* 权重面板 */
  .mt-wbox{display:grid;gap:10px}
  .mt-wrow{display:grid;grid-template-columns:52px 1fr 58px;align-items:center;gap:10px;font-size:13px}
  .mt-wrow input[type=range]{width:100%;height:4px;-webkit-appearance:none;appearance:none;border-radius:3px;background:linear-gradient(90deg,rgba(56,189,248,.85),rgba(125,211,252,.85))}
  .mt-wrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#eafeff;border:2px solid #38bdf8}
  .mt-wrow b{font-variant-numeric:tabular-nums;color:var(--mt-accent);text-align:right}
  /* 可直接输入数值的数字框（与滑块联动） */
  .mt-wrow .mt-wnum{width:58px;padding:5px 6px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums;
    color:var(--mt-accent);background:var(--surface-2);border:1px solid rgba(56,189,248,.32);border-radius:8px}
  .mt-wrow .mt-wnum:focus{outline:none;border-color:var(--mt-accent);background:rgba(56,189,248,.14)}
  .mt-wrow .mt-wnum::-webkit-outer-spin-button,
  .mt-wrow .mt-wnum::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  /* 分页跳转输入框 */
  .mt-jump{width:56px;padding:5px 6px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums;
    color:var(--mt-accent);background:var(--surface-2);border:1px solid rgba(56,189,248,.32);border-radius:8px}
  .mt-jump:focus{outline:none;border-color:var(--mt-accent)}
  .mt-jump::-webkit-outer-spin-button,.mt-jump::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  /* 投递时选择简历 */
  .mt-rc-item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;
    border:1px solid var(--border);background:rgba(255,255,255,.025);cursor:pointer;transition:all .16s}
  .mt-rc-item:hover{border-color:rgba(56,189,248,.35)}
  .mt-rc-item.on{border-color:var(--mt-accent);background:rgba(56,189,248,.09);
    box-shadow:0 0 0 1px rgba(56,189,248,.25)}
  .mt-rc-item input[type=radio]{margin-top:2px;accent-color:var(--mt-accent);flex:0 0 auto}
  .mt-rc-item b{font-size:13px;color:var(--mt-text)}

  /* ============ 小卡片（2D 淡入淡出，不拦截点击） ============ */
  .mt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px;padding:4px 24px 24px}
  .mt-flip{position:relative;height:296px;cursor:pointer;animation:mtIn .45s cubic-bezier(.16,1,.3,1) both}
  .mt-flip-in{position:relative;width:100%;height:100%}

  /* 两面同层叠放，用透明度切换；背面默认不接收鼠标事件 */
  .mt-face{position:absolute;inset:0;display:flex;flex-direction:column;
    border-radius:14px;border:1px solid rgba(120,200,255,.16);overflow:hidden;
    background:linear-gradient(165deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
    transition:opacity .3s ease,transform .3s cubic-bezier(.16,1,.3,1);
    backface-visibility:visible;-webkit-backface-visibility:visible}
  .mt-face.front{opacity:1;transform:none;z-index:2;pointer-events:auto;padding-bottom:58px}
  .mt-face.back{opacity:0;transform:translateY(6px);pointer-events:none;z-index:1;padding-bottom:58px;
    background:linear-gradient(165deg,rgba(56,189,248,.09),rgba(125,211,252,.05));border-color:rgba(56,189,248,.34)}

  /* 悬停 / 手动翻转：正面淡出并让出鼠标事件，背面接管 */
  .mt-flip:hover .mt-face.front,
  .mt-flip.flipped .mt-face.front{opacity:0;pointer-events:none;transform:translateY(-6px)}
  .mt-flip:hover .mt-face.back,
  .mt-flip.flipped .mt-face.back{opacity:1;pointer-events:auto;transform:none}

  .mt-flip.top .mt-face.front{border-color:var(--mt-cardHover);box-shadow:0 0 28px rgba(56,189,248,.16)}
  .mt-flip:hover .mt-face.front{box-shadow:0 0 30px rgba(56,189,248,.22)}

  .mt-f-top{display:flex;gap:11px;padding:13px 34px 9px 13px;align-items:flex-start;flex-wrap:wrap}
  .mt-f-photo{width:56px;height:70px;border-radius:9px;object-fit:cover;flex:none;border:1px solid var(--border-strong);background:var(--surface-2)}
  .mt-f-photo.ph{display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--mt-accent)}
  .mt-f-id{flex:1;min-width:0}
  .mt-f-name{font-size:14px;font-weight:700;color:var(--mt-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mt-f-role{font-size:11.5px;color:var(--mt-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mt-f-rank{position:absolute;top:38px;right:10px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;
    background:rgba(255,255,255,.08);color:var(--mt-dim)}
  .mt-flip.top .mt-f-rank{background:linear-gradient(145deg,var(--mt-accent),var(--mt-violet));color:var(--mt-glyph)}
  .mt-f-check{position:absolute;top:10px;right:10px;z-index:5;display:flex;align-items:center;padding:3px;border-radius:7px;background:rgba(6,12,22,.72)}
  .mt-f-check input{width:15px;height:15px;accent-color:var(--mt-accent);cursor:pointer}
  .mt-f-score{display:flex;align-items:baseline;gap:6px;padding:0 13px}
  .mt-f-score b{font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--mt-accent);font-variant-numeric:tabular-nums}
  .mt-f-score.hi b{text-shadow:0 0 18px rgba(56,189,248,.5)}
  .mt-f-score.mid b{color:#f5b94a;text-shadow:none}
  .mt-f-score.low b{color:var(--mt-dim);text-shadow:none}
  .mt-f-score small{font-size:10.5px;color:#7e94b3}
  /* 精简关键信息（替代原分数区）：到岗/期望/证件 或 薪资/招聘/状态 */
  .mt-f-info{display:flex;gap:10px;padding:2px 13px 0;align-items:flex-start}
  .mt-f-kv{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 0}
  .mt-f-kv:first-child{flex:2.8 1 0;min-width:76px}
  .mt-f-kv:last-child{flex:1.4 1 0}
  .mt-f-kv i{font-style:normal;font-size:10px;color:#7e94b3;letter-spacing:.3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mt-f-kv b{font-size:12px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;
    line-height:1.25;letter-spacing:-.2px;overflow-wrap:break-word;word-break:normal}
  /* 顶部概览图标（替代原第一名分数环） */
  .mt-sum-ico{width:52px;height:52px;flex:0 0 52px;border-radius:14px;display:grid;place-items:center;
    background:linear-gradient(150deg,rgba(56,189,248,.14),rgba(125,211,252,.10));
    border:1px solid rgba(120,200,255,.24);color:var(--mt-accent)}
  /* 勾选框 + 已选条 */
  .mt-pick{display:inline-flex;align-items:center;gap:5px;cursor:pointer;margin-left:8px}
/* 勾选框必须盖在卡片翻转层之上，否则点击会被卡片接走（表现为「勾不上、反而打开简历」） */
.mt-pick,.mt-f-check{position:relative;z-index:9}
.mt-pick span,.mt-f-check span{pointer-events:auto;position:relative;z-index:1}
.mt-face.front{pointer-events:none}
.mt-face.front .mt-flip-in,.mt-face.front .mt-f-top,.mt-face.front .mt-f-info,.mt-face.front .mt-ops,.mt-face.front [data-resume]{pointer-events:auto}
.mt-face.back{pointer-events:none}
.mt-flip.flipped .mt-face.front{pointer-events:none}
  .mt-pick input{position:absolute;opacity:0;width:0;height:0}
  .mt-pick span{width:15px;height:15px;border-radius:4px;border:1.5px solid rgba(120,200,255,.45);
    background:rgba(255,255,255,.04);display:inline-block;position:relative;transition:all .16s}
  .mt-pick input:checked + span{background:var(--mt-accent);border-color:var(--mt-accent)}
  .mt-pick input:checked + span::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
    border:solid var(--mt-glyph);border-width:0 2px 2px 0;transform:rotate(45deg)}
  .mt-selbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 14px;margin:12px 0 0;border-radius:12px;
    background:var(--surface-2);border:1px solid rgba(56,189,248,.18)}
  .mt-sel-count{font-size:12.5px;color:var(--text)}
  .mt-sel-count b{color:var(--mt-accent);font-size:15px;font-weight:800;margin:0 2px}
  .mt-fav-list{display:grid;gap:8px;margin-top:4px}
  .mt-fav-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
    border:1px solid var(--border);background:rgba(255,255,255,.03)}
  .mt-fav-row b{font-size:13px}
  .mt-fav-row .btn{margin-left:auto}
  /* 独立结果页：排名列表 */
  .mt-rank-list{display:grid;gap:10px;margin-top:14px}
  .mt-rank-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;
    border:1px solid var(--border);background:linear-gradient(150deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
    cursor:pointer;transition:border-color .18s,transform .18s}
  .mt-rank-row:hover{border-color:rgba(56,189,248,.4);transform:translateX(2px)}
  .mt-rr-no{width:30px;flex:0 0 30px;text-align:center;font-size:17px;font-weight:800;
    color:var(--mt-dim);font-variant-numeric:tabular-nums}
  .mt-rank-row:first-child .mt-rr-no{color:var(--mt-accent);text-shadow:0 0 14px rgba(56,189,248,.5)}
  .mt-rr-photo{width:46px;height:46px;flex:0 0 46px;border-radius:12px;object-fit:cover;
    border:1px solid var(--mt-line)}
  .mt-rr-photo.ph{display:grid;place-items:center;background:rgba(56,189,248,.12);color:var(--mt-accent);
    font-size:17px;font-weight:700}
  .mt-rr-main{flex:1;min-width:0}
  .mt-rr-name{font-size:14.5px;font-weight:700;display:flex;align-items:center}
  .mt-rr-sub{font-size:12px;color:var(--mt-dim);margin-top:3px}
  .mt-rr-score{text-align:right;flex:0 0 78px}
  .mt-rr-score b{display:block;font-size:26px;font-weight:800;letter-spacing:-1px;
    color:var(--mt-accent);font-variant-numeric:tabular-nums;line-height:1.05}
  .mt-rr-score.mid b{color:#f5b94a}
  .mt-rr-score.low b{color:var(--mt-dim)}
  .mt-rr-score small{font-size:10.5px;color:#7e94b3}
  .mt-rr-act{display:flex;flex-direction:column;gap:6px;flex:0 0 92px}
  /* 排名 → 详情面板（直接出结果，不播虚拟分析动画） */
  .mt-detail{margin-top:14px}
  .mt-d-head{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:14px;
    border:1px solid rgba(120,200,255,.24);
    background:linear-gradient(150deg,rgba(56,189,248,.06),rgba(255,255,255,.015))}
  .mt-d-photo{width:68px;height:68px;flex:0 0 68px;border-radius:16px;object-fit:cover;
    border:1px solid rgba(120,200,255,.28)}
  .mt-d-photo.ph{display:grid;place-items:center;background:rgba(56,189,248,.12);color:var(--mt-accent);
    font-size:26px;font-weight:700}
  .mt-d-id{flex:1;min-width:0}
  .mt-d-name{font-size:19px;font-weight:800;display:flex;align-items:center}
  .mt-d-sub{font-size:12.5px;color:var(--mt-dim);margin-top:4px}
  .mt-d-score{text-align:right;flex:0 0 104px}
  .mt-d-score b{display:block;font-size:42px;font-weight:800;letter-spacing:-2px;line-height:1;
    color:var(--mt-accent);font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(56,189,248,.4)}
  .mt-d-score.mid b{color:#f5b94a;text-shadow:none}
  .mt-d-score.low b{color:var(--mt-dim);text-shadow:none}
  .mt-d-score small{font-size:11px;color:#7e94b3}
  .mt-d-act{display:flex;flex-direction:column;gap:6px;flex:0 0 104px}
  .mt-d-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .mt-d-card{border:1px solid var(--border);border-radius:14px;padding:14px 16px;
    background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.012))}
  .mt-d-ct{font-size:12.5px;font-weight:700;letter-spacing:.4px;color:var(--text);margin-bottom:10px}
  .mt-d-bar{display:grid;grid-template-columns:56px 1fr 34px;gap:10px;align-items:center;margin-bottom:8px}
  .mt-d-bar span{font-size:12px;color:var(--mt-dim)}
  .mt-d-bar em{font-style:normal;font-size:12.5px;font-weight:700;text-align:right;
    color:var(--text);font-variant-numeric:tabular-nums}
  .mt-d-track{display:block;height:6px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
  .mt-d-track b{display:block;height:100%;border-radius:4px;
    background:linear-gradient(90deg,#38bdf8,#7dd3fc);transition:width .6s cubic-bezier(.16,1,.3,1)}
  .mt-d-list{margin:0;padding-left:18px;font-size:12.5px;line-height:1.75;color:#c3d7ee}
  .mt-d-list li.ok::marker{color:#34d399}
  .mt-d-list li.warn::marker{color:#f5b94a}
  .mt-d-step{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed rgba(120,200,255,.1)}
  .mt-d-step:last-child{border-bottom:0}
  .mt-d-no{width:24px;height:24px;flex:0 0 24px;border-radius:8px;display:grid;place-items:center;
    font-size:11.5px;font-weight:700;background:rgba(56,189,248,.14);color:var(--mt-accent)}
  .mt-d-body{flex:1;min-width:0}
  .mt-d-t{font-size:13px;font-weight:700;color:var(--mt-text)}
  .mt-d-x{font-size:12.5px;color:var(--mt-dim);margin-top:3px;line-height:1.7}
  .mt-d-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .mt-d-chips .chip{font-size:10.5px;padding:2px 7px;border-radius:6px}
  .mt-f-chips{display:flex;flex-wrap:wrap;gap:5px;padding:8px 13px 0}
  .mt-f-chips .chip{font-size:10.5px;padding:2px 7px;border-radius:6px}
  /* 按钮区永远在最上层，保证可点 */
  .mt-f-foot{margin-top:auto;display:flex;gap:6px;padding:9px 13px 12px;position:relative;z-index:3}
  .mt-f-foot .btn{flex:1;justify-content:center;font-size:11.5px;padding:5px 8px;cursor:pointer}

  .mt-b-head{padding:14px 13px 8px;font-size:12px;font-weight:700;color:var(--text);letter-spacing:.4px}
  .mt-b-rows{padding:0 13px;display:grid;gap:4px;flex:1;overflow:hidden}
  .mt-b-row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--text);
    border-bottom:1px dashed rgba(120,200,255,.14);padding-bottom:5px}
  .mt-b-row span:first-child{color:#7e94b3}
  .mt-b-row b{color:var(--mt-text);font-weight:650;font-variant-numeric:tabular-nums}
  .mt-b-gaps{padding:8px 13px 0;display:flex;flex-wrap:wrap;gap:5px}
  .mt-b-gaps .chip{font-size:10.5px;padding:2px 7px}
  .mt-b-note{padding:5px 13px 4px;font-size:11px;color:var(--mt-dim);line-height:1.45;max-height:46px;overflow:hidden}
  .mt-b-hint{padding:2px 13px 0;font-size:10.5px;color:var(--mt-accent);letter-spacing:.5px}

  .mt-grid-head{display:flex;align-items:center;gap:12px;padding:0 24px 10px;font-size:12px;color:var(--mt-dim)}
  .mt-grid-head b{color:var(--mt-text);font-size:13px}

  .mt-f-check{position:absolute;top:10px;right:10px;z-index:4;display:flex;align-items:center;padding:3px;border-radius:7px;background:rgba(6,12,22,.72)}
  .mt-f-check input{width:15px;height:15px;accent-color:var(--mt-accent);cursor:pointer}
  /* 卡片操作层：独立于翻转面，保证可点击 */
  /* 卡片操作层：仅按钮与勾选框可点，其余区域穿透到卡片 */
  .mt-ops{position:absolute;inset:0;z-index:20;pointer-events:none}
  .mt-ops .mt-f-check,
  .mt-ops .mt-ops-btn{pointer-events:auto}

  /* 勾选框：右上角 */
  .mt-ops .mt-f-check{position:absolute;top:10px;right:10px;z-index:22;display:flex;align-items:center;
    padding:3px;border-radius:7px;background:rgba(6,12,22,.8);border:1px solid rgba(120,200,255,.22)}
  .mt-ops .mt-f-check input{width:15px;height:15px;accent-color:var(--mt-accent);cursor:pointer}

  /* 排名 / 已投递徽标：勾选框正下方，竖排，不压内容 */
  .mt-flip:hover .mt-ops .mt-f-rank,.mt-flip.flipped .mt-ops .mt-f-rank{display:none}
  .mt-ops .mt-f-rank{pointer-events:none;position:absolute;top:41px;right:10px;z-index:22;transition:opacity .25s;
    font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;
    background:var(--mt-badge);color:var(--mt-badge-fg);border:1px solid var(--mt-cardLine);white-space:nowrap}
  .mt-flip.top .mt-ops .mt-f-rank{background:linear-gradient(145deg,var(--mt-accent),var(--mt-violet));color:var(--mt-glyph)}
  .mt-flip:hover .mt-ops .mt-badge-ok,.mt-flip.flipped .mt-ops .mt-badge-ok{display:none}
  .mt-ops .mt-badge-ok{pointer-events:none;position:absolute;top:41px;right:10px;z-index:22;transition:opacity .25s;
    font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;
    background:var(--success-weak);color:var(--success);border:1px solid var(--success);white-space:nowrap}

  /* 底部按钮条：实心底，避免与背面文字视觉重叠 */
  .mt-ops-btn{position:absolute;left:0;right:0;bottom:0;z-index:22;display:flex;gap:6px;
    padding:10px 12px 12px;
    background:linear-gradient(180deg,var(--mt-fade0),var(--mt-fade1) 38%,var(--mt-fade2))}
  .mt-ops-btn .btn{flex:1;justify-content:center;font-size:11.5px;padding:6px 8px;cursor:pointer}

  /* 正/背面底部都留出按钮条高度 */
  .mt-f-foot-pad{height:58px;flex:none}
  /* 简历文档 */
  .rz-wrap{display:grid;grid-template-columns:.85fr 1.3fr .85fr;gap:12px;padding:16px 24px 24px}
  @media(max-width:1200px){.rz-wrap{grid-template-columns:1fr 1fr}}
  @media(max-width:820px){.rz-wrap{grid-template-columns:1fr}}
  .rz-col{display:grid;gap:12px;align-content:start}
  .rz-card{background:rgba(255,255,255,.032);border:1px solid rgba(120,200,255,.15);border-radius:12px;padding:13px 14px}
  .rz-title{font-size:12px;font-weight:700;color:var(--text);letter-spacing:.6px;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid rgba(120,200,255,.16)}
  .rz-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed rgba(120,200,255,.1)}
  .rz-row:last-child{border-bottom:0}
  .rz-row span{color:#7e94b3;flex:none}
  .rz-row b{color:var(--mt-text);font-weight:600;text-align:right}
  .rz-hist{padding:8px 0;border-bottom:1px dashed rgba(120,200,255,.1)}
  .rz-hist:last-child{border-bottom:0}
  .rz-hist-h{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mt-text)}
  .rz-hist-h span{font-size:11.5px;color:#7e94b3;font-weight:400;flex:none}
  .rz-hist-c{font-size:12px;color:#9db6d4;margin-top:3px}
  .rz-hist-d{font-size:12px;color:var(--mt-dim);margin-top:4px;line-height:1.65}
  .rz-list{margin-top:8px;display:grid;gap:5px}
  .rz-li{font-size:12.5px;color:var(--text)}
  .rz-intro{font-size:12.5px;line-height:1.85;color:var(--text)}

  /* ============ 简历打印：只打印简历区 ============ */
  /* 由 #mtResPrint 在打印前给 body 加 .printing-resume（见 hp-match-ui.js） */
  @media print{
    body.printing-resume{background:#fff !important;margin:10mm}
    body.printing-resume .sidebar,
    body.printing-resume .topbar,
    body.printing-resume .tour-bar,
    body.printing-resume #loginMask,
    body.printing-resume .hp-modal-mask,
    body.printing-resume #toast,
    body.printing-resume .mt-toolbar,
    body.printing-resume .mt-pager,
    body.printing-resume .mt-res-act{display:none !important}

    /* 简历容器铺满、去掉滚动/阴影/背景 */
    body.printing-resume .mt-stage{position:static !important;overflow:visible !important;background:#fff !important;padding:0 !important}
    body.printing-resume .mt-stage-in{max-height:none !important;overflow:visible !important;box-shadow:none !important;
      border:0 !important;background:#fff !important;border-radius:0 !important}

    /* 三栏压成单栏，避免横向截断 */
    body.printing-resume .rz-wrap{display:block !important;padding:0 !important}
    body.printing-resume .rz-col{width:100% !important;display:block !important}
    body.printing-resume .rz-card{break-inside:avoid;page-break-inside:avoid;margin-bottom:8px}

    /* 浅色化，省墨且可读 */
    body.printing-resume,body.printing-resume .mt-stage-in,body.printing-resume .rz-card{background:#fff !important;color:#111 !important}
    body.printing-resume .rz-card{border:1px solid #bbb !important}
    body.printing-resume .rz-title{color:#000 !important;border-bottom:1px solid #999 !important}
    body.printing-resume .rz-row b,body.printing-resume .rz-intro,
    body.printing-resume .rz-li,body.printing-resume .rz-hist-h,
    body.printing-resume .rz-hist-c,body.printing-resume .rz-hist-d{color:#111 !important}
    body.printing-resume .rz-row span,body.printing-resume .rz-hist-h span{color:#555 !important}
    body.printing-resume .mt-res-name,body.printing-resume .mt-res-sub{color:#000 !important}
  }

  /* ============ 调权后排名变化动效 ============ */
  .mt-flip.up{animation:rankUp .85s cubic-bezier(.2,.9,.25,1) both}
  .mt-flip.down{animation:rankDown .85s cubic-bezier(.2,.9,.25,1) both}
  @keyframes rankUp{0%{transform:translateY(16px);opacity:.3}60%{opacity:1}100%{transform:none;opacity:1}}
  @keyframes rankDown{0%{transform:translateY(-16px);opacity:.3}60%{opacity:1}100%{transform:none;opacity:1}}
  .mt-delta{position:absolute;top:8px;right:8px;z-index:4;font-size:11px;font-weight:700;
    padding:1px 6px;border-radius:9px;pointer-events:none;transition:opacity .6s}
  .mt-delta.up{color:#0f2;background:rgba(0,255,140,.14);border:1px solid rgba(0,255,140,.35)}
  .mt-delta.down{color:#ff7a7a;background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.32)}
  .mt-delta.fade{opacity:0}
  .mt-pager{display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 24px 28px}
  .mt-pager button:disabled{opacity:.4;cursor:not-allowed}

  /* ============ 分析页引擎启动扫描 ============ */
  #bootScan{position:fixed;inset:0;z-index:9999;display:none;place-items:center;
    background:rgba(6,12,24,.82);backdrop-filter:blur(3px)}
  #bootScan.on{display:grid}
  #bootScan .bs-in{display:grid;place-items:center;position:relative}
  #bootScan .bs-ring{width:92px;height:92px;border:2px solid rgba(120,200,255,.25);
    border-top-color:#5cc8ff;border-radius:50%;animation:bsSpin 1s linear infinite}
  #bootScan .bs-line{position:absolute;top:92px;width:1px;height:0;
    background:linear-gradient(#5cc8ff,transparent);animation:bsSweep 1.5s ease-out}
  #bootScan .bs-txt{margin-top:16px;font-size:13px;letter-spacing:.14em;color:#9fd4ff}
  @keyframes bsSpin{to{transform:rotate(360deg)}}
  @keyframes bsSweep{0%{height:0;opacity:0}30%{opacity:1}100%{height:46vh;opacity:0}}
  @media (prefers-reduced-motion:reduce){
    #bootScan .bs-ring{animation:none}
    .mt-flip.up,.mt-flip.down{animation:none}
  }

  .hp-modal-mask{
position:fixed;inset:0;background:rgba(9,14,26,.55);z-index:250;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .18s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.hp-modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:calc(100vh - 80px);display:flex;flex-direction:column;overflow:hidden}
  .hp-modal.hp-modal-wide{max-width:880px}
  /* ===== 虚拟合同文档样式 ===== */
  .ct-doc{font-size:13px;line-height:1.85;color:var(--text)}
  .ct-title{font-size:17px;font-weight:800;text-align:center;margin-bottom:6px}
  .ct-meta{text-align:center;font-size:11.5px;color:var(--muted);margin-bottom:14px}
  .ct-parties{display:grid;gap:6px;padding:12px 14px;border-radius:10px;
    background:var(--surface-2);border:1px solid rgba(56,189,248,.16);margin-bottom:14px}
  .ct-party{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
  .ct-party span{color:var(--muted)}
  .ct-clause{margin-bottom:12px}
  .ct-h{font-weight:700;font-size:13px;margin-bottom:3px;color:var(--text)}
  .ct-b{color:var(--muted);font-size:12.5px;line-height:1.85;text-indent:2em}
  .ct-sign{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;
    padding-top:14px;border-top:1px dashed var(--border)}
  .ct-sign-box{font-size:12px;color:var(--muted)}
  .ct-sign-box span{display:block;margin-bottom:16px}
  .ct-sign-box i{font-style:normal;color:var(--text);font-weight:600;
    border-bottom:1px solid var(--border);display:block;padding-bottom:4px}
  .ct-foot{margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);
    font-size:11.5px;color:var(--muted);line-height:1.7}
  /* ===== 月收入趋势图表 ===== */
  .chart-switch{display:flex;gap:4px;padding:3px;border-radius:9px;
    background:rgba(120,200,255,.07);border:1px solid var(--mt-cardLine)}
  .chart-btn{padding:5px 12px;border-radius:7px;border:0;cursor:pointer;font-size:12px;
    background:transparent;color:var(--muted);transition:all .16s;font-weight:600}
  .chart-btn:hover{color:var(--text)}
  .chart-btn.on{background:linear-gradient(135deg,var(--mt-accent),var(--mt-accent2));color:var(--mt-glyph);
    box-shadow:0 2px 10px rgba(56,189,248,.3)}
  .chart-wrap{margin-top:12px}
  .sal-chart{color:var(--text)}
  .sal-svg{width:100%;height:auto;display:block;max-height:280px}
  .sal-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--muted)}
  .sal-legend span{display:flex;align-items:center;gap:6px}
  .sal-legend i{width:11px;height:11px;border-radius:3px;display:block}
  .sal-legend i.sal-line-dot{width:14px;height:3px;border-radius:2px;
    background:linear-gradient(90deg,#38bdf8,#a78bfa)}
  .sal-table{margin-top:14px;border-top:1px solid var(--border)}
  .sal-th,.sal-tr{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;
    padding:7px 4px;font-size:12.5px;border-bottom:1px solid rgba(120,200,255,.07)}
  .sal-th{font-size:11.5px;color:var(--muted);font-weight:600}
  .sal-tr span:nth-child(2),.sal-tr span:nth-child(3),.sal-tr b{text-align:right;
    font-variant-numeric:tabular-nums}
  .sal-tr b{font-weight:800;color:var(--mt-accent)}
  .sal-extra{color:#a78bfa;text-align:right}
  .sal-sum{background:var(--surface-2);font-weight:700;border-radius:8px}
  /* ===== 顾问在线对话 ===== */
  .adv-chat{display:flex;flex-direction:column;height:min(64vh,580px)}
  .adv-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 8px}
  .adv-row{display:flex;gap:8px;align-items:flex-start}
  .adv-row.me{justify-content:flex-end}
  .adv-av{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;
    font-size:12px;font-weight:700;background:linear-gradient(135deg,var(--mt-accent),var(--mt-accent2));color:var(--mt-glyph)}
  .adv-av.me{background:linear-gradient(135deg,#a78bfa,#7c5cf6);color:#fff}
  .adv-bub{max-width:76%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.7;
    background:rgba(120,200,255,.09);border:1px solid rgba(120,200,255,.16)}
  .adv-row.me .adv-bub{background:linear-gradient(135deg,rgba(56,189,248,.18),rgba(125,211,252,.16));
    border-color:rgba(56,189,248,.34)}
  .adv-at{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;text-align:right}
  .adv-quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0 6px;border-top:1px solid var(--border)}
  .adv-q{padding:5px 10px;border-radius:14px;font-size:11.5px;cursor:pointer;
    border:1px solid rgba(120,200,255,.22);background:var(--mt-grid);color:var(--text)}
  .adv-q:hover{border-color:var(--mt-accent);color:var(--mt-accent)}
  .adv-input{display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--border)}
  .adv-input input{flex:1;padding:9px 12px;border-radius:10px;font-size:13px;
    border:1px solid var(--border);background:var(--surface);color:var(--text)}
  .adv-input input:focus{outline:none;border-color:var(--mt-accent)}
  .adv-tip{font-size:11px;color:var(--muted);padding-top:6px}
  /* ===== 我的投递：行内展开 ===== */
  .ap-item{border:1px solid var(--border);border-radius:12px;margin-bottom:9px;
    background:rgba(255,255,255,.02);transition:all .18s ease;cursor:pointer}
  .ap-item:hover{border-color:rgba(56,189,248,.35)}
  .ap-item.open{border-color:var(--mt-cardHover);background:rgba(56,189,248,.045);
    box-shadow:0 0 0 1px rgba(56,189,248,.16)}
  .ap-head{display:flex;align-items:flex-start;gap:12px;padding:12px 14px}
  .ap-main{flex:1;min-width:0}
  .ap-title{font-size:13.5px;font-weight:700;color:var(--text);display:flex;
    align-items:center;gap:8px;flex-wrap:wrap}
  .ap-sub{font-size:12px;color:var(--muted);margin-top:4px}
  .ap-time{font-size:11px;color:var(--muted);margin-top:3px;opacity:.8}
  .ap-toggle{flex:0 0 auto;padding:5px 11px;border-radius:8px;font-size:11.5px;cursor:pointer;
    border:1px solid rgba(120,200,255,.24);background:var(--mt-grid);
    color:var(--muted);transition:all .16s;font-weight:600}
  .ap-toggle:hover{color:var(--mt-accent);border-color:var(--mt-accent)}
  .ap-toggle i{font-style:normal;font-size:9px;margin-left:2px}
  .ap-body{display:none;padding:0 14px 14px;border-top:1px dashed rgba(120,200,255,.14);
    margin:0 14px 0 14px;padding-left:0;padding-right:0;padding-top:12px}
  .ap-item.open .ap-body{display:block;animation:apIn .22s ease}
  @keyframes apIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .ap-progress{display:flex;align-items:center;gap:0;margin-bottom:14px}
  .ap-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
  .ap-step i{width:11px;height:11px;border-radius:50%;background:rgba(120,200,255,.18);
    border:2px solid rgba(120,200,255,.22);display:block;transition:all .2s;z-index:1}
  .ap-step span{font-size:10.5px;color:var(--muted);white-space:nowrap}
  .ap-step:not(:last-child)::after{content:'';position:absolute;top:5px;left:50%;
    width:100%;height:2px;background:rgba(120,200,255,.14);z-index:0}
  .ap-step.done i{background:var(--mt-ok);border-color:var(--mt-ok)}
  .ap-step.done::after{background:rgba(52,211,153,.5)}
  .ap-step.cur i{background:var(--mt-accent);border-color:var(--mt-accent);box-shadow:0 0 0 4px rgba(56,189,248,.18)}
  .ap-step.cur span{color:var(--mt-accent);font-weight:700}
  .ap-step.off i{background:rgba(150,150,150,.2);border-color:rgba(150,150,150,.3)}
  .ap-actions{display:flex;gap:8px;flex-wrap:wrap}
  .ap-actions .btn-danger{background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.4);
    color:#fb7185}
  .ap-actions .btn-danger:hover{background:rgba(251,113,133,.2)}
  /* ===== 三方消息中心布局 ===== */
  .msg-layout{display:grid;grid-template-columns:260px 1fr 320px;gap:14px;align-items:start}
  @media(max-width:1400px){.msg-layout{grid-template-columns:240px 1fr 280px}}
  @media(max-width:1150px){.msg-layout{grid-template-columns:1fr;}}
  .msg-conv-card,.msg-chat-card,.msg-notice-card{display:flex;flex-direction:column;overflow:hidden}
  /* 会话列表 */
  .conv-list{max-height:calc(100vh - 300px);overflow-y:auto;padding:0 10px 12px}
  .conv-item{display:flex;gap:10px;padding:10px;border-radius:11px;cursor:pointer;
    margin-bottom:6px;border:1px solid transparent;transition:all .16s}
  .conv-item:hover{background:var(--mt-grid)}
  .conv-item.on{background:rgba(56,189,248,.09);border-color:rgba(56,189,248,.42)}
  .conv-av{width:36px;height:36px;flex:0 0 36px;border-radius:50%;display:grid;place-items:center;
    font-size:14px;font-weight:700;color:var(--mt-glyph);
    background:linear-gradient(135deg,var(--mt-accent),var(--mt-accent2))}
  .conv-main{flex:1;min-width:0}
  .conv-name{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:5px}
  .conv-badge{margin-left:auto;min-width:17px;height:17px;padding:0 5px;border-radius:9px;
    background:#fb7185;color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
  .conv-on{width:7px;height:7px;border-radius:50%;background:var(--mt-ok);flex:0 0 7px;
    box-shadow:0 0 0 2px rgba(52,211,153,.22)}
  .conv-last{font-size:11.5px;color:var(--muted);margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conv-role{font-size:10.5px;color:var(--muted);opacity:.7;margin-top:2px}
  /* 对话区 */
  .msg-chat-head{display:flex;align-items:center;gap:10px;padding:13px 16px;
    border-bottom:1px solid var(--border)}
  .msg-chat-body{flex:1;min-height:340px;max-height:calc(100vh - 380px);overflow-y:auto;
    padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .msg-empty{margin:auto;color:var(--muted);font-size:12.5px}
  .msg-row{display:flex;gap:8px;align-items:flex-start}
  .msg-row.me{justify-content:flex-end}
  /* 消息主体：气泡 + 译文 + 翻译按钮竖排 */
  .msg-mid{display:flex;flex-direction:column;gap:5px;max-width:78%;align-items:flex-start}
  .msg-row.me .msg-mid{align-items:flex-end}
  .msg-tr-btn{align-self:flex-start;padding:2px 9px;border-radius:99px;cursor:pointer;
    background:transparent;border:1px solid var(--mt-line);color:var(--text-3);
    font-size:11px;line-height:1.6;transition:.18s}
  .msg-tr-btn:hover{border-color:var(--primary);color:var(--primary)}
  .msg-tr-btn.on{border-color:var(--mt-cardHover);color:var(--mt-accent);background:var(--surface-2)}
  .msg-tr-box{padding:8px 11px;border-radius:10px;font-size:12.5px;line-height:1.65;
    background:rgba(56,189,248,.07);border:1px dashed rgba(56,189,248,.3);color:var(--text-2)}
  .msg-tr-tag{display:inline-block;font-size:10px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--mt-accent);margin-bottom:3px;opacity:.85}
  html[dir="rtl"] .msg-tr-btn{align-self:flex-end}
  .msg-av{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;
    font-size:12px;font-weight:700;color:var(--mt-glyph);background:linear-gradient(135deg,var(--mt-accent),var(--mt-accent2))}
  .msg-bub{max-width:78%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.7;
    background:rgba(120,200,255,.09);border:1px solid rgba(120,200,255,.16);word-break:break-word}
  .msg-row.me .msg-bub{background:linear-gradient(135deg,rgba(56,189,248,.2),rgba(125,211,252,.18));
    border-color:rgba(56,189,248,.36)}
  .msg-chat-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
  .msg-input{flex:1;padding:9px 12px;border-radius:10px;font-size:13px;
    border:1px solid var(--border);background:var(--surface);color:var(--text)}
  .msg-input:focus{outline:none;border-color:var(--mt-accent)}
  .msg-input:disabled{opacity:.5;cursor:not-allowed}
  /* 规范通知条目 */
  .notice-list{max-height:calc(100vh - 380px);overflow-y:auto;padding:0 12px 10px}
  .notice-item{display:flex;gap:9px;padding:11px 10px;border-radius:11px;margin-bottom:7px;
    border:1px solid var(--border);background:rgba(255,255,255,.015);transition:all .16s}
  .notice-item:hover{border-color:rgba(56,189,248,.28)}
  .notice-item.read{opacity:.58}
  .notice-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:6px}
  .notice-dot.urgent{background:#fb7185;box-shadow:0 0 0 3px rgba(251,113,133,.18)}
  .notice-dot.todo{background:#f5b94a;box-shadow:0 0 0 3px rgba(245,185,74,.18)}
  .notice-dot.notice{background:var(--mt-accent);box-shadow:0 0 0 3px rgba(56,189,248,.18)}
  .notice-main{flex:1;min-width:0}
  .notice-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .notice-top b{font-size:12.5px;color:var(--text)}
  .notice-kind{font-size:10px;padding:1px 6px;border-radius:5px;font-weight:700}
  .notice-kind.urgent{background:rgba(251,113,133,.16);color:#fb7185}
  .notice-kind.todo{background:rgba(245,185,74,.16);color:#f5b94a}
  .notice-kind.notice{background:rgba(56,189,248,.14);color:var(--mt-accent)}
  .notice-time{margin-left:auto;font-size:10.5px;color:var(--muted)}
  .notice-desc{font-size:11.5px;color:var(--muted);line-height:1.65;margin-top:3px}
  .notice-acts{display:flex;gap:6px;align-items:center;margin-top:7px}
  .notice-readmark{font-size:10.5px;color:var(--muted)}
  .notice-advisor{padding:12px 14px;border-top:1px solid var(--border);margin-top:auto}
  .na-head{display:flex;align-items:center;gap:10px}
  .na-acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  /* ===== 风险处置分步引导 ===== */
  .rf-steps{display:flex;align-items:center;margin-bottom:18px}
  .rf-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
  .rf-step i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    font-size:12px;font-weight:700;font-style:normal;
    background:rgba(120,200,255,.12);color:var(--muted);border:2px solid rgba(120,200,255,.2);z-index:1}
  .rf-step span{font-size:11px;color:var(--muted)}
  .rf-step:not(:last-child)::after{content:'';position:absolute;top:13px;left:50%;
    width:100%;height:2px;background:rgba(120,200,255,.14);z-index:0}
  .rf-step.done i{background:var(--mt-ok);color:var(--mt-glyph);border-color:var(--mt-ok)}
  .rf-step.done::after{background:rgba(52,211,153,.45)}
  .rf-step.done span{color:#34d399}
  .rf-step.cur i{background:var(--mt-accent);color:var(--mt-glyph);border-color:var(--mt-accent);
    box-shadow:0 0 0 4px rgba(56,189,248,.18)}
  .rf-step.cur span{color:var(--mt-accent);font-weight:700}
  .rf-tip{font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.7}
  .rf-mats{display:flex;flex-direction:column;gap:8px}
  .rf-mat{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:10px;
    border:1px solid var(--border);background:rgba(255,255,255,.02);cursor:pointer;transition:all .16s}
  .rf-mat:hover{border-color:rgba(56,189,248,.3)}
  .rf-mat.on{border-color:var(--mt-accent);background:var(--surface-2)}
  .rf-mat input{margin-top:2px;accent-color:var(--mt-accent)}
  .rf-mat-name{font-size:13px;font-weight:600;color:var(--text)}
  .rf-mat-desc{font-size:11.5px;color:var(--muted);margin-top:2px}
  .rf-req{font-size:10px;padding:1px 6px;border-radius:5px;background:rgba(251,113,133,.16);
    color:#fb7185;font-weight:700;margin-left:4px}
  .rf-opt{font-size:10px;padding:1px 6px;border-radius:5px;background:rgba(120,200,255,.12);
    color:var(--muted);margin-left:4px}
  .rf-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .rf-col{padding:12px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.02)}
  .rf-ct{font-size:12px;font-weight:700;margin-bottom:8px}
  .rf-ct.ok{color:#34d399}
  .rf-ct.warn{color:#f5b94a}
  .rf-li{font-size:12px;padding:4px 0;color:var(--text)}
  .rf-li.ok{color:#34d399}
  .rf-li.warn{color:#f5b94a}
  .rf-steps-list{padding-left:20px;font-size:12.5px;line-height:2;color:var(--text)}
  .rf-note{width:100%;padding:11px 13px;border-radius:10px;font-size:13px;resize:vertical;
    border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit}
  .rf-note:focus{outline:none;border-color:var(--mt-accent)}
  .rf-summary{margin-top:12px;padding:12px 14px;border-radius:11px;
    background:var(--surface-2);border:1px solid rgba(56,189,248,.16)}
  .rf-srow{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0}
  .rf-srow span{color:var(--muted)}
  .rf-srow b{color:var(--text)}
  .rf-done{text-align:center;padding:10px 0 18px}
  .rf-done-ico{width:52px;height:52px;border-radius:50%;margin:0 auto 12px;display:grid;
    place-items:center;font-size:26px;color:var(--mt-glyph);background:linear-gradient(135deg,var(--mt-ok),var(--mt-accent))}
  .rf-done-t{font-size:15px;font-weight:800;color:var(--text)}
  .rf-done-d{font-size:12.5px;color:var(--muted);margin-top:6px}
  .rf-track{display:flex;flex-direction:column;gap:0;margin:8px 0 16px}
  .rf-tstep{display:flex;gap:12px;padding:9px 0;position:relative}
  .rf-tstep i{width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:grid;place-items:center;
    font-size:11px;font-style:normal;background:rgba(120,200,255,.1);color:var(--muted);
    border:2px solid rgba(120,200,255,.2);z-index:1}
  .rf-tstep:not(:last-child)::after{content:'';position:absolute;left:10px;top:30px;
    width:2px;height:calc(100% - 18px);background:rgba(120,200,255,.14);z-index:0}
  .rf-tstep.done i{background:var(--mt-ok);color:var(--mt-glyph);border-color:var(--mt-ok)}
  .rf-tstep.cur i{background:var(--mt-accent);color:var(--mt-glyph);border-color:var(--mt-accent);
    box-shadow:0 0 0 3px rgba(56,189,248,.18)}
  .rf-tstep b{font-size:12.5px;color:var(--text);display:block}
  .rf-tstep span{font-size:11px;color:var(--muted)}
  .rf-act-row{display:flex;gap:8px;flex-wrap:wrap}
  /* ===== 理赔路径图 ===== */
  .cl-head{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 14px;
    border-radius:11px;background:var(--surface-2);border:1px solid rgba(56,189,248,.16);
    margin-bottom:16px}
  .cl-hl{text-align:center}
  .cl-hl span{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
  .cl-hl b{font-size:13px;color:var(--text)}
  .cl-flow{display:flex;flex-direction:column;gap:0}
  .cl-node{display:flex;gap:12px;padding:12px 14px;border-radius:11px;
    border:1px solid var(--border);background:rgba(255,255,255,.02)}
  .cl-node-ico{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;
    font-size:13px;font-weight:800;color:var(--mt-glyph);
    background:linear-gradient(135deg,var(--mt-accent),var(--mt-accent2))}
  .cl-node-main{flex:1;min-width:0}
  .cl-node-t{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
  .cl-limit{font-size:10.5px;padding:1px 7px;border-radius:5px;background:rgba(245,185,74,.16);
    color:#f5b94a;font-weight:700}
  .cl-node-d{font-size:12px;color:var(--muted);margin-top:3px}
  .cl-node-who{font-size:11px;color:var(--mt-accent);margin-top:3px}
  .cl-need{margin:7px 0 0;padding-left:16px;font-size:11.5px;color:var(--muted);line-height:1.85}
  .cl-arrow{text-align:center;color:rgba(120,200,255,.35);font-size:14px;padding:4px 0;line-height:1}
  .cl-warn{margin-top:16px;padding:12px 14px;border-radius:11px;
    background:rgba(245,185,74,.07);border:1px solid rgba(245,185,74,.25)}
  .cl-warn b{font-size:12.5px;color:#f5b94a}
  .cl-warn ul{margin:8px 0 0;padding-left:18px;font-size:12px;color:var(--muted);line-height:1.9}
  .cl-warn li b{color:#f5b94a;font-size:12px}
  /* ===== 备用金申请 ===== */
  .fund-avail{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px;
    border-radius:12px;background:linear-gradient(135deg,rgba(56,189,248,.08),rgba(125,211,252,.06));
    border:1px solid rgba(56,189,248,.2);margin-bottom:16px}
  .fa-item{text-align:center}
  .fa-item span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  .fa-item b{font-size:14px;color:var(--mt-accent);font-variant-numeric:tabular-nums}
  .fund-form{display:flex;flex-direction:column;gap:16px}
  .ff-row label{display:block;font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:7px}
  .ff-input{display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:10px;
    border:1px solid var(--border);background:var(--surface)}
  .ff-input:focus-within{border-color:var(--mt-accent)}
  .ff-input span{font-size:15px;color:var(--mt-accent);font-weight:700}
  .ff-input input{flex:1;border:0;background:transparent;color:var(--text);
    font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;outline:none}
  .ff-hint{font-size:11px;color:var(--muted);margin-top:5px}
  .ff-purposes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
  .ff-p{padding:10px 12px;border-radius:10px;border:1px solid var(--border);
    background:rgba(255,255,255,.02);cursor:pointer;transition:all .16s}
  .ff-p:hover{border-color:rgba(56,189,248,.32)}
  .ff-p.on{border-color:var(--mt-accent);background:rgba(56,189,248,.09);
    box-shadow:0 0 0 1px rgba(56,189,248,.22)}
  .ff-p b{display:block;font-size:12.5px;color:var(--text)}
  .ff-p span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
  .ff-upload input::file-selector-button{padding:6px 12px;border-radius:7px;border:0;
    background:rgba(56,189,248,.18);color:var(--mt-accent);font-weight:600;cursor:pointer;margin-right:10px}
  .ff-note{padding:11px 13px;border-radius:10px;font-size:11.5px;line-height:1.8;
    color:var(--muted);background:rgba(245,185,74,.06);border:1px solid rgba(245,185,74,.18)}
  /* ===== 知识库 AI 助手 ===== */
  .kb-layout{display:grid;grid-template-columns:1fr;gap:14px}
  .kb-layout.has-ai{grid-template-columns:1fr 340px}
  @media(max-width:1200px){.kb-layout.has-ai{grid-template-columns:1fr}}
  .kb-grid-main{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))!important}
  .kb-ai-panel{display:none;flex-direction:column;position:sticky;top:0;
    border-radius:14px;border:1px solid rgba(56,189,248,.26);
    background:linear-gradient(165deg,rgba(20,32,54,.98),rgba(12,18,32,.98));
    max-height:calc(100vh - 180px);overflow:hidden}
  .kb-ai-panel.on{display:flex;animation:kbAiIn .24s cubic-bezier(.16,1,.3,1)}
  @keyframes kbAiIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
  .kb-ai-head{display:flex;align-items:center;gap:8px;padding:12px 14px;
