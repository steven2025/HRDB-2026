  /* =========================================================
     我的月收入趋势：折线 / 柱状 / 双显 三种模式
     ========================================================= */
  var SALARY_TREND = [
    { m: '4月', base: 20000, extra: 3200 },
    { m: '5月', base: 20000, extra: 4100 },
    { m: '6月', base: 21000, extra: 3800 },
    { m: '7月', base: 21000, extra: 5600 },
    { m: '8月', base: 22000, extra: 4700 },
    { m: '9月', base: 22000, extra: 5200 }
  ];
  var salChartMode = 'both';

  function renderSalaryChart(){
    var box = document.getElementById('salaryTrend');
    if(!box) return;
    var W = 760, H = 260, PL = 56, PR = 16, PT = 20, PB = 36;
    var iw = W - PL - PR, ih = H - PT - PB;
    var data = SALARY_TREND.map(function(x){
      return { m:x.m, base:x.base, extra:x.extra, total:x.base + x.extra };
    });
    var maxV = Math.max.apply(null, data.map(function(d){ return d.total; }));
    maxV = Math.ceil(maxV / 5000) * 5000;
    var yOf = function(v){ return PT + ih - (v / maxV) * ih; };
    var xOf = function(i){ return PL + (iw / (data.length - 1 || 1)) * i; };

    var grid = '', ticks = 5;
    for(var t = 0; t <= ticks; t++){
      var v = maxV / ticks * t;
      var y = yOf(v);
      grid += '<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="currentColor" stroke-opacity=".1"/>';
      grid += '<text x="'+(PL-10)+'" y="'+(y+4)+'" text-anchor="end" font-size="10.5" fill="currentColor" fill-opacity=".5">'+(v/1000)+'k</text>';
    }
    var xlab = data.map(function(d,i){
      return '<text x="'+xOf(i)+'" y="'+(H-PB+18)+'" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity=".6">'+d.m+'</text>';
    }).join('');

    var bars = '';
    if(salChartMode === 'bar' || salChartMode === 'both'){
      var bw = 26;
      data.forEach(function(d,i){
        var x = xOf(i) - bw/2;
        var hBase = (d.base / maxV) * ih;
        var hExtra = (d.extra / maxV) * ih;
        var yBase = PT + ih - hBase;
        var yExtra = yBase - hExtra;
        bars += '<rect x="'+x+'" y="'+yBase+'" width="'+bw+'" height="'+hBase+'" rx="3" fill="url(#salGradBase)"><title>'+d.m+' 基本工资 '+(d.base/1000)+'k</title></rect>';
        bars += '<rect x="'+x+'" y="'+yExtra+'" width="'+bw+'" height="'+hExtra+'" rx="3" fill="url(#salGradExtra)"><title>'+d.m+' 加班/补贴 '+(d.extra/1000)+'k</title></rect>';
        bars += '<text x="'+(x+bw/2)+'" y="'+(yExtra-6)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="currentColor" fill-opacity=".85">'+(d.total/1000).toFixed(1)+'k</text>';
      });
    }

    var lineHtml = '';
    if(salChartMode === 'line' || salChartMode === 'both'){
      var pts = data.map(function(d,i){ return xOf(i) + ',' + yOf(d.total); }).join(' ');
      var area = 'M' + xOf(0) + ',' + (PT+ih) + ' L' + data.map(function(d,i){ return xOf(i)+','+yOf(d.total); }).join(' L') + ' L' + xOf(data.length-1) + ',' + (PT+ih) + ' Z';
      lineHtml =
        '<path d="'+area+'" fill="url(#salArea)"/>' +
        '<polyline points="'+pts+'" fill="none" stroke="url(#salLineGrad)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>' +
        data.map(function(d,i){
          return '<circle cx="'+xOf(i)+'" cy="'+yOf(d.total)+'" r="4" fill="#0b1220" stroke="url(#salLineGrad)" stroke-width="2.4"><title>'+d.m+' 总收入 '+(d.total/1000).toFixed(1)+'k</title></circle>';
        }).join('');
    }

    var defs = '<defs>' +
      '<linearGradient id="salGradBase" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>' +
      '<linearGradient id="salGradExtra" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c5cf6"/></linearGradient>' +
      '<linearGradient id="salLineGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>' +
      '<linearGradient id="salArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>' +
      '</defs>';

    var svg = '<svg viewBox="0 0 '+W+' '+H+'" class="sal-svg" preserveAspectRatio="xMidYMid meet">' +
      defs + grid + bars + lineHtml + xlab + '</svg>';

    var table = '<div class="sal-table">' +
      '<div class="sal-th"><span>月份</span><span>基本工资</span><span>加班/补贴</span><span>合计</span></div>' +
      data.map(function(d){
        return '<div class="sal-tr"><span>'+d.m+'</span>' +
          '<span>' + d.base.toLocaleString() + '</span>' +
          '<span class="sal-extra">+' + d.extra.toLocaleString() + '</span>' +
          '<b>' + d.total.toLocaleString() + '</b></div>';
      }).join('') +
      '<div class="sal-tr sal-sum"><span>6 个月合计</span><span>' +
        data.reduce(function(s,d){return s+d.base;},0).toLocaleString() + '</span><span class="sal-extra">+' +
        data.reduce(function(s,d){return s+d.extra;},0).toLocaleString() + '</span><b>' +
        data.reduce(function(s,d){return s+d.total;},0).toLocaleString() + '</b></div>' +
      '</div>';

    var legend = '<div class="sal-legend">' +
      '<span><i style="background:linear-gradient(180deg,#38bdf8,#0ea5e9)"></i>基本工资</span>' +
      '<span><i style="background:linear-gradient(180deg,#a78bfa,#7c5cf6)"></i>加班/补贴</span>' +
      '<span><i class="sal-line-dot"></i>总收入趋势</span>' +
      '</div>';

    box.innerHTML = '<div class="sal-chart">' + svg + '</div>' + legend + table;

    $$('#salChartSwitch [data-mode]').forEach(function(b){
      b.classList.toggle('on', b.dataset.mode === salChartMode);
    });
  }

  var ADVISOR_CHATS = {};

  function openAdvisorChat(name){
    name = name || '李顾问';
    if(!ADVISOR_CHATS[name]){
      ADVISOR_CHATS[name] = [
        { who:'them', t:'你好，我是你的专属顾问。材料、签证、行程有任何问题都可以直接问我。', at:'09:12' },
        { who:'them', t:'你的工作签证还在办理中，预计 4–6 周，有进展我会第一时间通知你。', at:'09:13' }
      ];
    }
    window.HP.modal({
      title: name + ' · 在线对话',
      wide: true,
      body:
        '<div class="adv-chat">' +
          '<div class="adv-msgs" id="advMsgs"></div>' +
          '<div class="adv-quick" id="advQuick">' +
            '<button class="adv-q" data-q="签证现在办到哪一步了？">签证进度</button>' +
            '<button class="adv-q" data-q="出发前需要准备哪些材料？">准备材料</button>' +
            '<button class="adv-q" data-q="工资什么时候发放？怎么发？">工资发放</button>' +
            '<button class="adv-q" data-q="境外遇到问题怎么联系你？">应急联系</button>' +
          '</div>' +
          '<div class="adv-input">' +
            '<input id="advInput" placeholder="输入消息，回车发送…" autocomplete="off">' +
            '<button class="btn btn-p btn-sm" id="advSend">发送</button>' +
          '</div>' +
          '<div class="adv-tip">顾问在线时间 工作日 9:00–18:00 · 非工作时间留言，次日回复</div>' +
        '</div>',
      /* 不设底部按钮，用右上角 ✕ 关闭（输入区已占满底部） */
      actions: []
    });

    var msgs = document.getElementById('advMsgs');
    var input = document.getElementById('advInput');

    function nowHM(){
      var d = new Date();
      return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }

    function paint(){
      msgs.innerHTML = ADVISOR_CHATS[name].map(function(m){
        return '<div class="adv-row ' + m.who + '">' +
          (m.who === 'them' ? '<div class="adv-av">李</div>' : '') +
          '<div class="adv-bub">' + m.t + '<span class="adv-at">' + m.at + '</span></div>' +
          (m.who === 'me' ? '<div class="adv-av me">张</div>' : '') +
        '</div>';
      }).join('');
      msgs.scrollTop = msgs.scrollHeight;
    }

    function autoReply(text){
      var ans;
      if(/签证|办理|进度/.test(text)){
        ans = '你的工作签证目前处于「领馆受理」阶段，材料已齐全。按最近进度预计还需 2–3 周，出签后我会把电子件发到这里。';
      } else if(/材料|准备|带什么/.test(text)){
        ans = '出发前请准备：护照原件、健康证、中级职业资格证、4 张白底证件照、学历证明。体检报告我会帮你预约指定医院。';
      } else if(/工资|薪资|发放|多少钱/.test(text)){
        ans = '工资由国外雇主每月 10 日前直接汇入你本人账户，不经过第三方。基本工资 22,000 元 + 加班补贴，上月合计 27,200 元。';
      } else if(/应急|出事|危险|紧急/.test(text)){
        ans = '境外遇到任何紧急情况：1) 第一时间联系我（24h 在线）；2) 拨打应急热线 400-000-0000；3) 必要时联系中国驻当地使领馆。平台会协助取证与维权。';
      } else if(/机票|行程|什么时候走/.test(text)){
        ans = '机票由雇主承担，出签后 5 个工作日内安排。我会提前把行程单和接机人信息发给你确认。';
      } else if(/保险|保障/.test(text)){
        ans = '雇主已为你投保境外人身意外险（保额 100 万元）和当地工伤保险，保单号可在「合同与证照」页查看。';
      } else {
        ans = '收到，我记下了。这个情况我需要核对一下你的档案，稍后给你详细回复。如果着急可以打我的电话 +86 138-0000-0000。';
      }
      setTimeout(function(){
        ADVISOR_CHATS[name].push({ who:'them', t: ans, at: nowHM() });
        paint();
      }, 700);
    }

    function send(){
      var v = (input.value || '').trim();
      if(!v) return;
      ADVISOR_CHATS[name].push({ who:'me', t: v, at: nowHM() });
      input.value = '';
      paint();
      autoReply(v);
    }

    document.getElementById('advSend').addEventListener('click', send);
    input.addEventListener('keydown', function(e){ if(e.key === 'Enter') send(); });
    $$('#advQuick [data-q]').forEach(function(b){
      b.addEventListener('click', function(){ input.value = b.dataset.q; send(); });
    });
    paint();
    setTimeout(function(){ if(input) input.focus(); }, 60);
  }

  function renderSalary(){

    var dueEl = $('#salKpiDue', host);

      if(preNum > 0){
        var pct = ((curNum - preNum) / preNum * 100).toFixed(1);

  /* 知识库问答：按关键词匹配内置知识条目 */
  function kbAiAnswer(q){
    var s = String(q || '');
    if(/签证|护照|工作许可/.test(s)){
      return '办理工作签证通常需要：①护照原件（有效期 ≥ 6 个月）②健康证 ③职业资格证书 ④白底证件照 ⑤学历证明 ⑥无犯罪记录证明。' +
        '流程：材料提交 → 平台预审 → 使领馆受理 → 出签，一般 4–6 周。建议同时保留所有材料的电子备份。';
    }
    if(/安全|危险|治安|注意/.test(s)){
      return '出国前安全要点：①记住当地报警电话与中国使领馆电话 ②不要携带大量现金 ③保管好护照，随身带复印件 ④避免夜间单独外出 ⑤与家人约定固定联系时间。' +
        '遇到紧急情况优先联系专属顾问（24h 在线）和 400-000-0000 应急热线。';
    }
    if(/欠薪|拖欠|工资|维权/.test(s)){
      return '在海外被欠薪的处理顺序：①立即保留证据（合同、考勤、工资流水、聊天记录）②通过平台备案 ③可申请风险处置备用金先行垫付 ④平台协助出具申诉书 ⑤联系当地劳工部门或使领馆，必要时走仲裁。' +
        '注意：证据越完整，维权成功率越高，务必保留原件。';
    }
    if(/合同|协议|签署/.test(s)){
      return '签合同要点：①确认三方合同（你与派遣公司、派遣公司与雇主、你与雇主）关键条款一致 ②薪资、工时、保险、解约条款必须白纸黑字 ③警惕"阴阳合同" ④保留自己那份原件 ⑤不签空白合同。' +
        '平台会对三份合同做一致性校验，发现不一致会提示。';
    }
    if(/保险|理赔|意外/.test(s)){
      return '境外保障通常包含：人身意外伤害险（保额 100 万）、当地工伤保险、雇主责任险。理赔流程：报案（24h 内）→ 材料审核 → 定损 → 赔付。' +
        '医疗票据必须保留原件，境外就医请选择正规医院并保留完整病历。';
    }
    if(/体检|健康证/.test(s)){
      return '出境劳务一般需要：国际旅行健康检查证明（健康证）、疫苗接种证明。体检需在出入境检验检疫机构指定医院进行，有效期通常 1 年。平台可协助预约。';
    }
    if(/机票|行程|出境/.test(s)){
      return '机票一般由雇主承担，出签后 5 个工作日内安排。出境前请确认：①签证已出 ②行程单与接机人信息 ③随身携带合同复印件 ④手机已开通国际漫游或准备当地 SIM 卡。';
    }
    return '这个问题我这边知识库里没有直接答案。建议你换个说法，或者直接联系专属顾问（消息中心可以随时找到），复杂问题由顾问给出准确回复。';
  }

  /* ============ 三方会话：列表 + 对话区 ============ */
  var CHAT_STATE = { convId: '', convs: [] };
  /* 消息翻译状态：按消息 id 缓存，用户点「翻译」才请求 */
  var CHAT_MSGS = [];
  var CHAT_TR = {};
  function CHAT_EN(){
    var L = (window.HPI18N && window.HPI18N.lang && window.HPI18N.lang()) || 'zh';
    return L !== 'zh';
  }
  var CHAT_TXT = {
    translate: { zh:'翻译', en:'Translate', fr:'Traduire', ar:'ترجمة' },
    translating: { zh:'翻译中…', en:'Translating…', fr:'Traduction…', ar:'جارٍ الترجمة…' },
    translated: { zh:'译文', en:'Translation', fr:'Traduction', ar:'الترجمة' },
    hide: { zh:'收起译文', en:'Hide translation', fr:'Masquer', ar:'إخفاء الترجمة' }
  };
  function CHAT_T(k){
    var L = (window.HPI18N && window.HPI18N.lang && window.HPI18N.lang()) || 'zh';
    var pack = CHAT_TXT[k];
    return (pack && (pack[L] || pack.en)) || k;
  }

  function chatApi(path, opt){
    return fetch('/api/chat' + path, Object.assign({
      credentials: 'include',
      headers: { 'content-type': 'application/json', 'x-hp-request': '1' }
    }, opt || {})).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function renderConvs(){
    var box = document.getElementById('convList');
    if(!box) return;
    var EN = (window.HPI18N && window.HPI18N.lang()) !== 'zh';
    /* 会话名称与角色文案 */
    var CONV_EN = {
      'conv-advisor': { title: 'Advisor Li', peer: 'Advisor Li',
        lastText: 'Your work visa is still being processed, about 4–6 weeks' },
      'conv-company': { title: 'Employer recruiting', peer: 'Recruiting Manager Wang',
        lastText: 'We would like a video interview — when are you free?' },
      'conv-assurance': { title: 'Overseas Support', peer: 'Support desk',
        lastText: 'Service channel opened for you' }
    };
    /* 在线时拉后端，离线用内置 */
    var offline = [
      { id:'conv-advisor', title:'李顾问', peer:'李顾问', avatar:'李', online:true, unread:2,
        lastText:'你的工作签证还在办理中，预计 4–6 周', lastAt:'' },
      { id:'conv-company', title:'企业招聘对接', peer:'招聘经理 · 王', avatar:'王', online:true, unread:1,
        lastText:'想约个视频面试，你什么时候方便？', lastAt:'' },
      { id:'conv-assurance', title:'海外保障中心', peer:'保障部坐席', avatar:'保', online:true, unread:0,
        lastText:'已为你开通服务通道', lastAt:'' }
    ];
    function paint(convs){
      CHAT_STATE.convs = convs;
      var tot = convs.reduce(function(s,c){ return s + (c.unread||0); }, 0);
      var sub = document.getElementById('convSub');
      if(sub) sub.textContent = EN
        ? convs.length + ' conversations' + (tot ? ' · ' + tot + ' unread' : '')
        : convs.length + ' 个会话' + (tot ? ' · ' + tot + ' 条未读' : '');
      box.innerHTML = convs.map(function(c){
        var e = EN ? (CONV_EN[c.id] || null) : null;
        var title = e ? e.title : c.title;
        var lastText = e ? e.lastText : (c.lastText || (EN ? 'No messages' : '暂无消息'));
        var roleTxt = c.peerRole === 'assurance'
          ? (EN ? 'Support' : '保障部')
          : (c.peerRole === 'company' ? (EN ? 'Employer HR' : '企业 HR') : (EN ? 'Advisor' : '专属顾问'));
        var AVATAR_EN = { 'conv-advisor': 'L', 'conv-company': 'W', 'conv-assurance': 'S' };
        return '<div class="conv-item' + (c.id === CHAT_STATE.convId ? ' on' : '') + '" data-conv="' + c.id + '">' +
          '<div class="conv-av">' + (EN ? (AVATAR_EN[c.id] || (c.avatar || '?').slice(0,1)) : (c.avatar || (c.title||'?').slice(0,1))) + '</div>' +
          '<div class="conv-main">' +
            '<div class="conv-name">' + title +
              (c.unread ? '<span class="conv-badge">' + c.unread + '</span>' : '') +
              (c.online ? '<span class="conv-on"></span>' : '') + '</div>' +
            '<div class="conv-last">' + lastText + '</div>' +
            '<div class="conv-role">' + roleTxt + '</div>' +

      $$('[data-conv]', box).forEach(function(el){
        el.addEventListener('click', function(){ openConv(el.dataset.conv); });
      });
    }
    if(window.HPBridge && window.HPBridge.isOnline()){
      chatApi('/conversations').then(function(r){
        paint((r.conversations||[]).length ? r.conversations : offline);
      }).catch(function(){ paint(offline); });
    } else {
      paint(offline);
    }
    var rf = document.getElementById('convRefresh');
    if(rf && rf.dataset.bound !== '1'){
      rf.dataset.bound = '1';
      rf.addEventListener('click', function(){ renderConvs(); toast('已刷新', ''); });

  function openConv(convId){
    CHAT_STATE.convId = convId;
    var c = (CHAT_STATE.convs || []).filter(function(x){ return x.id === convId; })[0] || {};
    /* 头部 */
    var head = document.getElementById('chatHead');
    if(head){
      var roleTxt = c.peerRole === 'assurance' ? '保障部坐席' : (c.peerRole === 'company' ? '企业招聘' : '专属顾问');
      head.innerHTML =
        '<div class="conv-av">' + (c.avatar || (c.title||'?').slice(0,1)) + '</div>' +
        '<div class="conv-main"><div class="conv-name">' + (c.title||convId) +
          (c.online ? '<span class="conv-on"></span>' : '') + '</div>' +
          '<div class="conv-last">' + roleTxt + (c.online ? ' · 在线' : ' · 离线') + '</div></div>';
    }
    var body = document.getElementById('chatBody');
    var input = document.getElementById('chatInput');
    var sendBtn = document.getElementById('chatSend');
    if(input) input.disabled = false;
    if(sendBtn) sendBtn.disabled = false;

    function paintMsgs(msgs){
      if(!msgs || !msgs.length){
        body.innerHTML = '<div class="msg-empty">' + (CHAT_EN() ? 'No messages yet — say hi' : '还没有消息，打个招呼吧') + '</div>';
        return;
      }
      CHAT_MSGS = msgs;
      body.innerHTML = msgs.map(function(m, i){
        var isThem = m.who === 'them';
        /* 对方消息：按原文（对方使用的语言）展示，翻译由用户点按钮决定 */
        var tr = CHAT_TR[m.id];
        var showTr = tr && tr.on && tr.text;
        var needTr = isThem && /[\u4e00-\u9fa5]/.test(String(m.text || ''));
        var actBar = '';
        if (needTr) {
          actBar = '<div class="msg-act">' +
            '<button class="msg-tr-btn' + (showTr ? ' on' : '') + '" data-tr="' + i + '">' +
              (showTr ? CHAT_T('hide') : '🌐 ' + CHAT_T('translate')) +
            '</button>' +
            '</div>';
        }
        var trBox = showTr
          ? '<div class="msg-tr-box"><span class="msg-tr-tag">' + CHAT_T('translated') + '</span>' +
            '<div>' + tr.text + '</div></div>'
          : '';
        return '<div class="msg-row ' + (isThem ? 'them' : 'me') + '">' +
          (isThem ? '<div class="msg-av">' + (c.avatar || '客') + '</div>' : '') +
          '<div class="msg-mid">' +
            '<div class="msg-bub">' + m.text + '</div>' +
            trBox + actBar +
          '</div>' +
        '</div>';
      }).join('');

      /* 绑定翻译按钮 */
      $$('[data-tr]', body).forEach(function(b){
        b.addEventListener('click', function(ev){
          ev.stopPropagation();
          toggleMsgTranslate(+b.dataset.tr);
        });
      });
      body.scrollTop = body.scrollHeight;
    }

    /* 单条消息翻译开关：第一次点才请求，之后缓存 */
    function toggleMsgTranslate(idx){
      var m = CHAT_MSGS[idx];
      if(!m) return;
      var cur = CHAT_TR[m.id];
      if(cur && cur.on){ cur.on = false; paintMsgs(CHAT_MSGS); return; }
      if(cur && cur.text){ cur.on = true; paintMsgs(CHAT_MSGS); return; }
      var L = (window.HPI18N && window.HPI18N.lang()) || 'en';
      if(L === 'zh') L = 'en';
      var btn = document.querySelector('[data-tr="' + idx + '"]');
      if(btn) btn.textContent = CHAT_T('translating');
      fetch('/api/translate', {
        method: 'POST', credentials: 'include',
        headers: { 'content-type': 'application/json', 'x-hp-request': '1' },
        body: JSON.stringify({ texts: [String(m.text)], target: L })
      }).then(function(r){ return r.json(); }).then(function(j){
        CHAT_TR[m.id] = { on: true, text: (j && j.texts && j.texts[0]) || m.text, lang: L };
        paintMsgs(CHAT_MSGS);
      }).catch(function(){
        CHAT_TR[m.id] = { on: true, text: m.text, lang: L };
        paintMsgs(CHAT_MSGS);
      });
    }

    if(window.HPBridge && window.HPBridge.isOnline()){
      chatApi('/conversations/' + convId + '/messages').then(function(r){
        paintMsgs(r.messages);
      }).catch(function(){
        body.innerHTML = '<div class="msg-empty">加载失败</div>';
      });
    } else {
      /* 离线：用本地缓存 */
      var cache = window.__chatCache || (window.__chatCache = {});
      paintMsgs(cache[convId] || []);
    }

    /* 发送 */
    function doSend(){
      var v = (input.value||'').trim();
      if(!v) return;
      input.value = '';
      if(window.HPBridge && window.HPBridge.isOnline()){
        chatApi('/conversations/' + convId + '/messages', {
          method: 'POST', body: JSON.stringify({ text: v })
        }).then(function(r){ paintMsgs(r.messages); renderConvs(); })
          .catch(function(e){ toast('发送失败', e.message); });
      } else {
        var cache = window.__chatCache || (window.__chatCache = {});
        cache[convId] = cache[convId] || [];
        cache[convId].push({ who:'me', text:v });
        setTimeout(function(){
          cache[convId].push({ who:'them', text:'收到，我会尽快回复你。' });
          paintMsgs(cache[convId]);
        }, 700);
        paintMsgs(cache[convId]);
      }
    }
    if(sendBtn && sendBtn.dataset.bound !== '1'){
      sendBtn.dataset.bound = '1';
      sendBtn.addEventListener('click', doSend);
    }
    if(input && input.dataset.bound !== '1'){
      input.dataset.bound = '1';
      input.addEventListener('keydown', function(e){ if(e.key === 'Enter') doSend(); });
    }
    renderConvs();
  }

      });
      var cats = Object.keys(byPeriod);
      var cnSeries = cats.map(function(k){ return Math.round(byPeriod[k].cn * 10) / 10; });

  function permLabel(key){
    var hit = PERM_CATALOG.filter(function(x){ return x.key === key; })[0];

  function permChips(perms){
    var list = perms || [];
    if(!list.length) return '<span class="t-muted" style="font-size:11.5px">未分配权限</span>';
    var shown = list.slice(0, 4).map(function(k){
      return '<span class="chip chip-g" style="margin-right:4px">'+permLabel(k)+'</span>';
    }).join('');
    var more = list.length > 4 ? '<span class="t-muted" style="font-size:11px">+'+(list.length - 4)+'</span>' : '';
    return shown + more;
  }

  // ---------------- 企业审批中心（账单确认 / 权限申请） ----------------
  var COMPANY_APPROVALS = [];

  function approvalKindText(kind){
    return kind === 'bill.confirm' ? '账单确认' : kind === 'member.perms' ? '权限变更' : '其他';
  }

  function renderCompanyApprovals(){
    var wrap = $('#approvalList', host);
    if(!wrap) return;
    var pending = COMPANY_APPROVALS.filter(function(a){ return a.status === 'pending'; });
    var done = COMPANY_APPROVALS.filter(function(a){ return a.status !== 'pending'; });
    var sub = $('#approvalSub', host);
    if(sub) sub.textContent = pending.length + ' 条待处理 · ' + done.length + ' 条已处理';
    var canApproveBill = can('bill.approve');
    var canApprovePerm = can('member.manage');
    var rowHtml = function(a){
      var canDecide = a.status === 'pending' && ((a.kind === 'bill.confirm' && canApproveBill) || (a.kind === 'member.perms' && canApprovePerm));
      var chip = a.status === 'approved' ? 'chip-s' : a.status === 'rejected' ? 'chip-d' : 'chip-w';
      var statusText = a.status === 'approved' ? '已通过' : a.status === 'rejected' ? '已驳回' : '待审批';
      var ops = '';
      if(canDecide){
        ops = '<span style="display:flex;gap:6px"><button class="btn btn-p btn-sm" data-ap-approve="'+a.id+'">通过</button>' +
              '<button class="btn btn-o btn-sm" data-ap-reject="'+a.id+'" style="color:var(--danger)">驳回</button></span>';
      } else if(a.status === 'pending'){
        ops = '<span class="chip chip-g">需管理员处理</span>';
      }
      return '<div class="row" style="align-items:flex-start;flex-wrap:wrap">' +
        '<div class="r-main">' +
          '<div class="r-title">'+a.title+' <span class="chip '+chip+'">'+statusText+'</span></div>' +
          '<div class="r-sub">'+approvalKindText(a.kind)+' · '+(a.summary||'')+(a.amountText?(' · '+a.amountText):'')+'</div>' +
          '<div class="t-muted" style="font-size:11px;margin-top:2px">发起：'+(a.requesterName||a.requester||'—')+
            (a.decidedAt ? (' · 处理：'+a.decidedBy+' '+String(a.decidedAt).replace('T',' ').slice(0,16)) : '')+
            (a.decisionNote ? (' · 意见：'+a.decisionNote) : '')+'</div>' +
        '</div>' + ops +
      '</div>';
    };
    wrap.innerHTML = (pending.length ? pending.map(rowHtml).join('') : '<div class="t-muted" style="padding:14px;text-align:center">暂无待审批事项</div>')
      + (done.length ? '<div class="divider"></div>' + done.slice(0,5).map(rowHtml).join('') : '');

    $('[data-ap-approve]', host).forEach(function(b){
      b.addEventListener('click', function(){
        decideApproval(b.dataset.apApprove, 'approve', '管理员审批通过');
      });
    });
    $('[data-ap-reject]', host).forEach(function(b){
      b.addEventListener('click', function(){
        window.HP.modal({
          title:'驳回审批',
          body:'<label class="t-muted" style="font-size:12px">驳回理由（必填）</label>' +
            '<textarea id="apNote" style="width:100%;height:80px;margin-top:6px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface)"></textarea>',
          actions:[{text:'取消'},{text:'确认驳回', primary:true, onClick:function(c){
            var el = document.getElementById('apNote');
            var note = el ? el.value.trim() : '';
            if(!note){ toast('请填写','驳回理由不能为空'); return; }
            c();
            decideApproval(b.dataset.apReject, 'reject', note);
          }}]
        });
      });
    });
  }

  function decideApproval(id, action, note){
    if(!window.HPBridge || !window.HPBridge.isOnline()){ toast('未连接后端','无法审批'); return; }
    window.HPBridge.api.company.decideApproval(id, action, note).then(function(){
      toast(action === 'approve' ? '已通过' : '已驳回', action === 'approve' ? '审批结果已生效并通知发起人' : '已记录理由并通知发起人');
      return window.HPBridge.boot();
    }).then(function(){
      refreshApprovals();
      renderBills(); renderMembers(); renderSettle();
      if(window.HPBridge.refreshNotifications) window.HPBridge.refreshNotifications();
    }).catch(function(err){ toast('审批失败', err.message || '请稍后重试'); });
  }

  function showView(view){
    if(!host) return;
    $$('.view', host).forEach(function(el){ el.classList.toggle('active', el.dataset.view === view); });
    if(view === 'match' && window.HPMatch){ window.HPMatch.company($('#companyMatchRoot', host), { scope: 'applied' }); }
    if(view === 'discover' && window.HPMatch){ window.HPMatch.company($('#companyDiscoverRoot', host), { scope: 'talent' }); }
    if(view === 'rank' && window.HPMatch){ window.HPMatch.rank($('#companyRankRoot', host), {}); }
    if(view === 'stage' && window.HPStage){ window.HPStage.mount($('#companyStageRoot', host), window.HPS_CFG || {}); }
    if(view === 'overview' || view === 'report'){
      setTimeout(initCharts, 60);
    }
    if(view === 'console' && window.HPCONSOLE){
      window.HPCONSOLE.mount(document.getElementById('hpConsole'));
    }
    if(view === 'pool' && window.HPPOOL){
      window.HPPOOL.mount(document.getElementById('hpPool'));
    }
    if(view === 'console' && window.HPREPORT){
      window.HPREPORT.initConsole(host.querySelector('.view[data-view="console"]'));
    }
    if(view === 'knowledge' && window.HPCOUNTRY){
      window.HPCOUNTRY.init(host.querySelector('.view[data-view="knowledge"]'));
    }
    if(view === 'projects' && window.HPJOBS){
      window.HPJOBS.init(host.querySelector('.view[data-view="projects"]'));
    }
  }

  function onTheme(){
    disposeCharts();
    var v = window.HP.getView();
    if(v === 'overview' || v === 'report') setTimeout(initCharts, 60);
  }

  window.addEventListener('resize', function(){
    Object.keys(charts).forEach(function(k){ if(charts[k]) charts[k].resize(); });
  });

  return { mount: mount, showView: showView, onTheme: onTheme, DEMO: (typeof DEMO !== 'undefined' ? DEMO : null) };
})();

  // ---------------- 智能体治理 ----------------
  function govEsc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function govData(){
    /* 切语言时拉到的译文优先（存在内存里，避免被 bootstrap 旧数据覆盖） */
    if (window.__govReviews && window.__govReviewsLang === ((window.HPI18N && window.HPI18N.lang()) || 'zh')) {
      var d0 = window.HP_DATA;
      if (d0 && d0.assurance && d0.assurance.governance) {
        return Object.assign({}, d0.assurance.governance, { reviews: window.__govReviews });
      }
    }
    var d = window.HP_DATA;
    return d && d.assurance && d.assurance.governance ? d.assurance.governance : null;
  }

  function govStatusText(status){
    return status === 'approved' ? '已通过' : status === 'rejected' ? '已打回' : '待复核';
  }

  function govTime(iso){
    if(!iso) return '—';
    var d = new Date(iso);
    if(isNaN(d.getTime())) return '—';
    return d.toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-');
  }

  function govKpiCard(label, value, foot){
    return '<div class="card kpi"><div class="k-label">'+label+'</div><div class="k-num">'+value+'</div><div class="k-foot">'+foot+'</div></div>';
  }

  function renderGovernance(){
    /* 切换语言后重新拉一次治理数据：复核记录的译文存在后端，
       前端 HP_DATA 是启动时缓存的旧语言版本 */
    var L = (window.HPI18N && window.HPI18N.lang()) || 'zh';
    if (window.__govLang !== L && !window.__govFetching) {
      window.__govLang = L;
      window.__govFetching = true;
      var asked = L;
      fetch('/api/assurance/governance/reviews?lang=' + encodeURIComponent(L), {
        credentials: 'include', headers: { 'x-hp-request': '1' }
      }).then(function (r) { return r.json(); }).then(function (j) {
        window.__govFetching = false;
        /* 期间用户又切了语言 → 丢弃这次结果，避免旧语言覆盖新语言 */
        var now = (window.HPI18N && window.HPI18N.lang()) || 'zh';
        if (now !== asked) { window.__govLang = ''; return; }
        if (j && j.reviews) {
          window.__govReviews = j.reviews;
          window.__govReviewsLang = asked;
          paintGovernance();
        }
      }).catch(function () { window.__govFetching = false; });
    }
    paintGovernance();
  }

  function paintGovernance(){
    var g = govData();
    var kpis = $('#govKpis', host);
    if(!g){
      if(kpis) kpis.innerHTML = '<div class="card card-pad t-muted" style="grid-column:1/-1">未连接后端，暂无治理数据。</div>';
      var emptyTb = $('#govAgents', host);
      if(emptyTb) emptyTb.innerHTML = '<tr><td colspan="5" class="t-muted">—</td></tr>';
      return;
    }
    var st = g.stats || {};
    var policy = g.policy || {};
    if(kpis){
      kpis.innerHTML = [
        govKpiCard('今日调用', (st.runsToday || 0)+' <small>次</small>', '三个身份合计'),
        govKpiCard('待复核', (st.pending || 0)+' <small>条</small>', '其中高风险 '+(st.highRisk || 0)+' 条'),
        govKpiCard('复核通过率', st.passRate === null || st.passRate === undefined ? '—' : st.passRate+' <small>%</small>', '已复核 '+((st.approved||0)+(st.rejected||0))+' 条'),
        govKpiCard('抽检比例', Math.round((policy.samplingRate || 0) * 100)+' <small>%</small>', '策略页可调，保存即生效')
      ].join('');
    }

    var tb = $('#govAgents', host);
    if(tb) tb.innerHTML = (g.agents || []).map(function(a){
      return '<tr><td class="t-strong">'+govEsc(a.name)+'</td><td class="t-num">v'+govEsc(a.version)+'</td><td class="t-num">'+a.runsToday+'</td><td>'+
        (a.pendingReviews ? '<span class="chip chip-w">'+a.pendingReviews+'</span>' : '<span class="t-muted">—</span>')+
        '</td><td style="text-align:right"><span class="chip '+(a.enabled?'chip-s':'chip-d')+'">'+(a.enabled?'启用中':'已停用')+'</span> '+
        '<button class="btn btn-o btn-sm" data-gov-agent="'+govEsc(a.id)+'" data-enabled="'+(a.enabled?'1':'0')+'">'+(a.enabled?'停用':'启用')+'</button></td></tr>';
    }).join('') || '<tr><td colspan="5" class="t-muted">—</td></tr>';

    var reviews = g.reviews || [];
    var pending = reviews.filter(function(r){ return r.status === 'pending'; });
    var sub = $('#govReviewSub', host);
    if(sub) sub.textContent = pending.length+' 条待处理 · 共 '+reviews.length+' 条记录';
    var wrap = $('#govReviews', host);
    if(wrap){
      wrap.innerHTML = reviews.length ? reviews.map(function(r){
        var isPending = r.status === 'pending';
        var trig = (r.triggers || []).map(function(t){ return t.label; }).join('、');
        return '<div class="row" style="align-items:flex-start;flex-wrap:wrap">'+
          '<div class="r-main">'+
            '<div class="r-title">'+govEsc(r.agentName)+' v'+govEsc(r.agentVersion || '1.0.0')+
              ' <span class="chip '+(r.level === 'high' ? 'chip-d' : 'chip-w')+'">'+(r.level === 'high' ? '高风险' : '抽检')+'</span>'+
              ' <span class="chip chip-g">'+govStatusText(r.status)+'</span></div>'+
            '<div class="r-sub">'+govEsc(r.role)+' · '+govEsc(r.user)+' · '+(r.trigger === 'risk' ? '风险命中' : '随机抽检')+' · '+govEsc(govTime(r.createdAt))+'</div>'+
            (trig ? '<div class="t-muted" style="font-size:11.5px;margin-top:4px">命中：'+govEsc(trig)+'</div>' : '')+
            '<div class="t-muted" style="font-size:12px;margin-top:6px">Q：'+govEsc(r.input || '')+'</div>'+
            '<div style="font-size:12.5px;margin-top:6px;white-space:pre-wrap">A：'+govEsc((r.answer || '').slice(0, 260))+((r.answer || '').length > 260 ? '…' : '')+'</div>'+
            (r.note ? '<div class="t-muted" style="font-size:11.5px;margin-top:4px">复核意见：'+govEsc(r.note)+'</div>' : '')+
          '</div>'+
          (isPending
            ? '<span style="display:flex;gap:6px;margin-left:auto;flex:0 0 auto"><button class="btn btn-p btn-sm" data-gov-approve="'+govEsc(r.id)+'">通过</button><button class="btn btn-o btn-sm" data-gov-reject="'+govEsc(r.id)+'" style="color:var(--danger)">打回</button></span>'
            : '<span class="chip chip-g" style="margin-left:auto;flex:0 0 auto">'+govStatusText(r.status)+'</span>')+
        '</div>';
      }).join('') : emptyState({ icon:'🔍', title:'暂无复核记录', desc:'智能体回答触发高风险，或按抽检比例被随机命中时，会出现在这里等待复核。' });
    }

    var sample = $('#govSample', host);
    if(sample){
      sample.value = Math.round((policy.samplingRate || 0) * 100);
      $('#govSampleVal').textContent = Math.round((policy.samplingRate || 0) * 100)+'%';
    }
    var q = policy.dailyQuota || {};
    if($('#govQuotaPersona', host)) $('#govQuotaPersona', host).value = q.persona || 100;
    if($('#govQuotaCompany', host)) $('#govQuotaCompany', host).value = q.company || 300;
    if($('#govQuotaAssurance', host)) $('#govQuotaAssurance', host).value = q.assurance || 500;
    if($('#govPii', host)) $('#govPii', host).checked = policy.piiRedaction !== false;
    var hint = $('#govQuotaHint', host);
    if(hint && st.quota){
      hint.textContent = '今日用量：应聘者 '+st.quota.persona.used+'/'+st.quota.persona.limit+
        ' · 企业 '+st.quota.company.used+'/'+st.quota.company.limit+
        ' · 保障部 '+st.quota.assurance.used+'/'+st.quota.assurance.limit;
    }

    $$('[data-gov-agent]', host).forEach(function(b){
      b.addEventListener('click', function(){
        if(!window.HPBridge || !window.HPBridge.isOnline()){ toast('未连接后端','无法修改智能体状态'); return; }
        var enable = b.dataset.enabled === '0';
        window.HPBridge.api.assurance.setAgentEnabled(b.dataset.govAgent, enable).then(function(res){
          applyGovernance(res.governance);
          toast(enable ? '已启用' : '已停用', b.dataset.govAgent+' 状态已更新');
        }).catch(function(err){ toast('操作失败', err.message || '请稍后重试'); });
      });

    $$('[data-gov-approve]', host).forEach(function(b){
      b.addEventListener('click', function(){

        window.HPBridge.api.assurance.reviewAction(b.dataset.govApprove, 'approve').then(function(res){
          applyGovernance(res.governance);
          toast('已通过','该回答确认可用');
        }).catch(function(err){ toast('复核失败', err.message || '请稍后重试'); });
      });
    });
    $$('[data-gov-reject]', host).forEach(function(b){
      b.addEventListener('click', function(){
        window.HP.modal({
          title:'打回该回答',
          body:'<label class="t-muted" style="font-size:12px">问题类型 / 打回原因（必填）</label><textarea id="govRejectNote" style="width:100%;height:90px;margin-top:6px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface)" placeholder="例如：签证结论过于绝对，缺少使领馆口径来源"></textarea>',
          actions:[{text:'取消'},{text:'确认打回', primary:true, onClick:function(c){

            if(!note){ toast('请填写','打回必须写明原因'); return; }
            window.HPBridge.api.assurance.reviewAction(b.dataset.govReject, 'reject', note).then(function(res){
              c();
              applyGovernance(res.governance);
              toast('已打回','已记录问题类型，可用于改进提示词');
            }).catch(function(err){ toast('操作失败', err.message || '请稍后重试'); });
          }}]
        });
      });
    });
  }

  function applyGovernance(g){
    if(!g) return;
    if(window.HP_DATA && window.HP_DATA.assurance) window.HP_DATA.assurance.governance = g;
    renderGovernance();
    updateBoardKpis();
  }

  function refreshGovernance(){
    if(!window.HPBridge || !window.HPBridge.isOnline()) return;
    window.HPBridge.api.assurance.governance().then(applyGovernance).catch(function(){});
  }

  function bindGovernance(){
    var sample = $('#govSample', host);

      var v = $('#govSampleVal', host);
      if(v) v.textContent = sample.value+'%';
    });
    var save = $('#govSavePolicy', host);

      if(!window.HPBridge || !window.HPBridge.isOnline()){ toast('未连接后端','无法保存策略'); return; }
      var patch = {
        samplingRate: Number($('#govSample', host).value) / 100,
        piiRedaction: !!$('#govPii', host).checked,
        dailyQuota: {
          persona: Number($('#govQuotaPersona', host).value) || 100,
          company: Number($('#govQuotaCompany', host).value) || 300,
          assurance: Number($('#govQuotaAssurance', host).value) || 500
        }
      };
      window.HPBridge.api.assurance.updatePolicy(patch).then(function(res){
        applyGovernance(res.governance);
        toast('已保存','抽检比例与配额已生效');
      }).catch(function(err){ toast('保存失败', err.message || '请稍后重试'); });
    });
    var refresh = $('#govRefresh', host);
    if(refresh) refresh.addEventListener('click', function(){ refreshGovernance(); renderStorage(); toast('已刷新',''); });
  }

  function renderCost(){
    var el = $('#govCost', host);
    if(!el) return;
    var g = (window.HP_DATA && window.HP_DATA.assurance && window.HP_DATA.assurance.governance) || null;
    var cost = g && g.cost;
    if(!cost){ el.textContent = '未返回成本数据'; return; }
    var byRole = (cost.byRole || []).map(function(r){
      var name = r.role === 'persona' ? '应聘者' : r.role === 'company' ? '企业' : r.role === 'assurance' ? '保障部' : r.role;
      return name + ' ' + r.runs + ' 次 / ' + r.tokens + ' tokens';
    }).join(' · ');

  /** 刷新批量操作栏的选中计数与按钮显隐 */
  function updateApBatchBar(){
    var checks = $('.ap-check', host);
    var sel = checks.filter(function(c){ return c.checked; });
    var bar = $('#apBatchBar', host);
    var cnt = $('#apSelCount', host);
    if(cnt) cnt.textContent = sel.length;
    if(bar) bar.style.display = sel.length ? 'flex' : 'none';
    var all = $('#apSelectAll', host);
    if(all){
      all.checked = checks.length > 0 && sel.length === checks.length;
      all.indeterminate = sel.length > 0 && sel.length < checks.length;
      all.disabled = checks.length === 0;
    }
  }

  /** 绑定勾选框与批量按钮（每次渲染后重新绑） */
  function bindApBatch(pending){
    var ids = (pending || []).map(function(r){ return r.id; });

    $('.ap-check', host).forEach(function(c){
      c.addEventListener('change', updateApBatchBar);
    });

    var all = $('#apSelectAll', host);
    if(all){
      /* 用 onclick 覆盖，避免重复绑定 */
      all.onclick = function(){
        var on = all.checked;
        $('.ap-check', host).forEach(function(c){ c.checked = on; });
        updateApBatchBar();
      };
    }

    var clear = $('#apBatchClear', host);
    if(clear) clear.onclick = function(){
      $('.ap-check', host).forEach(function(c){ c.checked = false; });
      updateApBatchBar();
    };

    var app = $('#apBatchApprove', host);
    if(app) app.onclick = function(){
      var sel = $('.ap-check', host).filter(function(c){ return c.checked; }).map(function(c){ return c.dataset.apCheck; });
      if(!sel.length) return;
      window.HP.modal({
        title: '批量通过 ' + sel.length + ' 条申请',
        body: '<p>确认后将为这 ' + sel.length + ' 条备用金申请统一写入「通过」结论，并通知申请人。</p>' +
              '<p class="t-muted" style="margin-top:8px;font-size:12px">如需逐条填写意见，请单独点击每行的「通过」。</p>',
        actions: [
          { text: '取消' },
          { text: '确认通过', primary: true, onClick: function(close){
            close();
            runApBatch(sel, 'approve', '批量审批通过');
          }}
        ]
      });
    };

    var rej = $('#apBatchReject', host);
    if(rej) rej.onclick = function(){
      var sel = $('.ap-check', host).filter(function(c){ return c.checked; }).map(function(c){ return c.dataset.apCheck; });
      if(!sel.length) return;
      window.HP.modal({
        title: '批量驳回 ' + sel.length + ' 条申请',

              '<textarea id="apBatchNote" style="width:100%;height:80px;margin-top:6px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)" placeholder="例如：证据不足，请补充工资流水与考勤记录"></textarea>',
        actions: [
          { text: '取消' },
          { text: '确认驳回', primary: true, onClick: function(close){
            var el = document.getElementById('apBatchNote');
            var note = el ? el.value.trim() : '';
            if(!note){ toast('请填写驳回原因', '原因会记录到审批日志'); return; }
            close();
            runApBatch(sel, 'reject', note);
          }}
        ]
      });
    };

    updateApBatchBar();

  /** 执行批量审批：串行调用，失败不中断 */
  function runApBatch(ids, action, note){
    if(!window.HPBridge || !window.HPBridge.isOnline()){ toast('未连接后端','无法审批'); return; }
    var ok = 0, fail = 0;
    var chain = Promise.resolve();
    ids.forEach(function(id){
      chain = chain.then(function(){
        return window.HPBridge.api.assurance.decideFund(id, action, note)
          .then(function(){ ok++; })
          .catch(function(){ fail++; });
      });
    });
    chain.then(function(){
      if(fail){
        toast('部分完成', '成功 ' + ok + ' 条，失败 ' + fail + ' 条');
      } else {
        toast(action === 'approve' ? '已批量通过' : '已批量驳回', '共处理 ' + ok + ' 条申请');
      }
      refreshApprovals();
      if(window.HPBridge.refreshNotifications) window.HPBridge.refreshNotifications();
    });
  }

  function renderApprovals(){
    var live = liveData() || {};
    var list = live.fundRequests || [];
    var pending = list.filter(function(r){ return r.status === 'pending'; });
    var done = list.filter(function(r){ return r.status !== 'pending'; });
    var pSub = $('#fundPendingSub', host);
    if(pSub) pSub.textContent = pending.length + ' 条';
    var dSub = $('#fundDoneSub', host);
    if(dSub) dSub.textContent = done.length + ' 条';
    var pWrap = $('#fundPending', host);
    if(pWrap){
      pWrap.innerHTML = pending.length
        ? pending.map(function(r){ return approvalRow(r, true); }).join('')
        : emptyState({ icon:'✅', title:'暂无待审批申请', desc:'应聘者在「海外保障中心」提交风险处置备用金申请后，会出现在这里等待审批。' });
    }
    var dWrap = $('#fundDone', host);
    if(dWrap){
      dWrap.innerHTML = done.length
        ? done.map(function(r){ return approvalRow(r, false); }).join('')
        : emptyState({ icon:'🗂️', title:'暂无已处理记录', desc:'审批过的申请会保留在这里，方便回溯决策依据。' });
    }

    /* ===== 批量审批 ===== */
    bindApBatch(pending);

    $('[data-fund-approve]', host).forEach(function(b){
      b.addEventListener('click', function(){
        if(!window.HPBridge || !window.HPBridge.isOnline()){ toast('未连接后端','无法审批'); return; }
        window.HPBridge.api.assurance.decideFund(b.dataset.fundApprove, 'approve', '材料齐备，同意垫付').then(function(){
          toast('已通过','申请已批准，已通知申请人');
          refreshApprovals();
          if(window.HPBridge.refreshNotifications) window.HPBridge.refreshNotifications();
        }).catch(function(err){ toast('审批失败', err.message || '请稍后重试'); });
      });
    });
    $$('[data-fund-reject]', host).forEach(function(b){
      b.addEventListener('click', function(){
        window.HP.modal({
          title:'驳回申请',
          body:'<label class="t-muted" style="font-size:12px">驳回原因（必填）</label><textarea id="fundRejectNote" style="width:100%;height:80px;margin-top:6px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface)" placeholder="例如：证据不足，请补充工资流水与考勤记录"></textarea>',
          actions:[{text:'取消'},{text:'确认驳回', primary:true, onClick:function(c){
            var el = document.getElementById('fundRejectNote');
            var note = el ? el.value.trim() : '';
            if(!note){ toast('请填写','驳回原因不能为空'); return; }
            window.HPBridge.api.assurance.decideFund(b.dataset.fundReject, 'reject', note).then(function(){
              c();
              toast('已驳回','已记录原因并通知申请人');
              refreshApprovals();
              if(window.HPBridge.refreshNotifications) window.HPBridge.refreshNotifications();
            }).catch(function(err){ toast('操作失败', err.message || '请稍后重试'); });
          }}]
        });
      });
    });
  }

        return { main: r.t || r.title, meta: [r.persona, r.d, r.createdAt].filter(Boolean).join(' · '), status: r.status, cls: r.cls || 'chip-w', detail: r.d || '' };
      });
      if(!rows.length) rows = [{ main: L('暂无签证类风险','No visa-related risks'), meta: L('所有签证材料齐全','All visa documents complete'), status: L('正常','OK'), cls: 'chip-s', detail: '' }];
      foot = L('材料待补 ' + visaRisks.length + ' 人', visaRisks.length + ' people with documents pending');
    } else {
      title = L('在途人员','People in transit');
      var names = {};
      risks.forEach(function(r){
        var n = r.persona;
        if(!n) return;
        if(!names[n]) names[n] = { main: n, metas: [], status: r.status, cls: r.cls || 'chip-w' };
        names[n].metas.push(r.t || r.title);
      });
      rows = Object.keys(names).map(function(k){
        var v = names[k];
        return { main: v.main, meta: v.metas.join(' / '), status: v.status, cls: v.cls, detail: '' };
      });
      if(!rows.length) rows = [{ main: L('暂无在途人员','No one in transit'), meta: L('所有人员均已回流或未入职','Everyone has returned or not yet joined'), status: '—', cls: 'chip-g', detail: '' }];
      foot = L('共 ' + rows.length + ' 人存在在途风险', rows.length + ' people with open risks');
    }

    var body = '<div class="t-muted" style="font-size:12.5px;margin-bottom:12px">' + foot + '</div>';
    body += '<div style="display:grid;gap:8px">';
    rows.forEach(function(r){
      body += '<div style="display:flex;align-items:flex-start;gap:10px;padding:11px 13px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px">' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-size:13px;font-weight:600">' + r.main + '</div>' +
          (r.meta ? '<div class="t-muted" style="font-size:11.5px;margin-top:3px">' + r.meta + '</div>' : '') +
          (r.detail ? '<div class="t-muted" style="font-size:11.5px;margin-top:4px;line-height:1.6">' + r.detail + '</div>' : '') +
        '</div>' +
        '<span class="chip ' + r.cls + '">' + r.status + '</span>' +
      '</div>';
    });
    body += '</div>';

    window.HP.modal({
      title: title,
      body: body,
      wide: true,
      actions: [
        { text: L('关闭','Close') },
        { text: L('去处置','Handle'), primary: true, onClick: function(close){
          close();
          if(kind === 'ticket' || kind === 'people') location.hash = '#/assurance/ticket';
          else if(kind === 'contract') location.hash = '#/assurance/audit';
          else location.hash = '#/assurance/risk';
        }}
      ]
    });
  }

  function bindCommon(){
    host.addEventListener('click', function(e){
      var t = e.target.closest('[data-demo]');
      if(t) demoToast(t.dataset.demo);
    });
    /* ===== 看板 KPI 下钻 ===== */
    host.addEventListener('click', function(e){
      var card = e.target.closest('[data-drill]');
      if(card) openDrill(card.dataset.drill);
    });
    /* 键盘可达（Enter / Space） */
    host.addEventListener('keydown', function(e){
      if(e.key !== 'Enter' && e.key !== ' ') return;
      var card = e.target.closest('[data-drill]');
      if(card){ e.preventDefault(); openDrill(card.dataset.drill); }
    });
    var exp = $('#btnExportCompliance', host);
    if(exp) exp.addEventListener('click', function(e){ e.stopPropagation(); exportComplianceHTML(); });

    var toGlobe = $('#btnToGlobe', host);
    if(toGlobe) toGlobe.addEventListener('click', function(){ location.hash = '#/assurance/globe'; });

    var refreshApproval = $('#btnRefreshApproval', host);
    if(refreshApproval) refreshApproval.addEventListener('click', function(){ refreshApprovals(); toast('已刷新',''); });

    var auditBtn = $('#btnAuditRefresh', host);
    if(auditBtn) auditBtn.addEventListener('click', function(){
      var input = $('#auditSearch', host);
      renderAuditLog(input ? input.value.trim() : '');
    });
    var auditInput = $('#auditSearch', host);
    if(auditInput) auditInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter') renderAuditLog(auditInput.value.trim());
    });
  }

  function mount(container){
    host = container;
    if(mounted) return;
    buildViews();
    bindCommon();
    renderRisk();
    renderAudit();
    renderTickets();
    renderGovernance();
    bindGovernance();
    renderCost();
    renderApprovals();
    mounted = true;
  }

  function showView(view){
    if(!host) return;
    $$('.view', host).forEach(function(el){ el.classList.toggle('active', el.dataset.view === view); });
    if(view === 'governance'){ renderGovernance(); refreshGovernance(); renderCost(); renderStorage(); }
    if(view === 'global'){ renderWorldMap(); }
    if(view === 'approval'){ renderApprovals(); refreshApprovals(); }
    if(view === 'auditlog'){
      var input = $('#auditSearch', host);
      renderAuditLog(input ? input.value.trim() : '');
    }
  }

  function onTheme(){}

  return {
    mount: mount, showView: showView, onTheme: onTheme, DEMO: null,
    rerender: function(){ renderRisk(); renderAudit(); renderTickets(); updateBoardKpis(); renderGovernance(); }
  };
})();
</script>
