    border-bottom:1px solid rgba(120,200,255,.16);font-size:13px}
  .kb-ai-head b{font-weight:800;color:#eafcff}
  .kb-ai-dot{width:7px;height:7px;border-radius:50%;background:var(--mt-ok);
    box-shadow:0 0 0 3px rgba(52,211,153,.2)}
  .kb-ai-close{width:24px;height:24px;border:0;border-radius:7px;cursor:pointer;
    background:rgba(120,200,255,.1);color:var(--muted);font-size:15px;line-height:1}
  .kb-ai-close:hover{background:rgba(251,113,133,.18);color:#fb7185}
  .kb-ai-msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px;min-height:220px}
  .kb-ai-row{display:flex}
  .kb-ai-row.me{justify-content:flex-end}
  .kb-ai-bub{max-width:88%;padding:9px 12px;border-radius:11px;font-size:12.5px;line-height:1.8;
    background:rgba(120,200,255,.09);border:1px solid rgba(120,200,255,.16);color:#c3d7ee}
  .kb-ai-row.me .kb-ai-bub{background:linear-gradient(135deg,rgba(56,189,248,.2),rgba(125,211,252,.18));
    border-color:rgba(56,189,248,.36);color:#e8f2ff}
  .kb-ai-quick{display:flex;gap:5px;flex-wrap:wrap;padding:8px 14px;
    border-top:1px solid rgba(120,200,255,.12)}
  .kb-ai-quick button{padding:4px 9px;border-radius:13px;font-size:11px;cursor:pointer;
    border:1px solid rgba(120,200,255,.22);background:var(--mt-grid);color:var(--muted)}
  .kb-ai-quick button:hover{border-color:var(--mt-accent);color:var(--mt-accent)}
  .kb-ai-input{display:flex;gap:7px;padding:10px 14px 12px;
    border-top:1px solid rgba(120,200,255,.12)}
  .kb-ai-input input{flex:1;padding:8px 11px;border-radius:9px;font-size:12.5px;
    border:1px solid var(--mt-line);background:rgba(255,255,255,.04);color:#e8f2ff}
  .kb-ai-input input:focus{outline:none;border-color:var(--mt-accent)}
.hp-modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.hp-modal-head b{font-size:15px}
.hp-modal-head button{margin-left:auto;width:30px;height:30px;border-radius:8px;border:none;background:var(--surface-2);color:var(--text-2);display:flex;align-items:center;justify-content:center}
.hp-modal-body{padding:20px;overflow-y:auto;font-size:13.5px;line-height:1.7}
.hp-modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

/* ============ AI 聊天 ============ */
.ai-fab{position:fixed;right:24px;bottom:24px;width:56px;height:56px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(37,99,235,.4);z-index:150;cursor:grab;touch-action:none;user-select:none;transition:box-shadow .2s,opacity .2s}
.ai-fab:hover{filter:brightness(1.08)}
  /* 拖拽中：取消过渡，避免跟手迟钝 */
  .ai-fab.dragging{cursor:grabbing;transition:none;box-shadow:0 14px 40px rgba(37,99,235,.65);z-index:161}
  /* 停在边缘半隐藏 */
  .ai-fab.docked{opacity:.72}
  .ai-fab.docked:hover{opacity:1}
.ai-panel{position:fixed;right:24px;bottom:92px;width:380px;max-width:calc(100vw - 32px);height:520px;max-height:calc(100vh - 140px);background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);display:none;flex-direction:column;z-index:150;overflow:hidden}
.ai-panel.open{display:flex}
.ai-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.ai-head .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 8px}
.ai-head b{font-size:14px;white-space:nowrap;flex:0 0 auto}
.ai-head span{font-size:11.5px;color:var(--text-3);margin-left:auto}
.ai-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6}
.msg.bot{background:var(--surface);border:1px solid var(--border);align-self:flex-start}
.msg.user{background:var(--primary);color:#fff;align-self:flex-end}
.msg .src{display:block;margin-top:6px;font-size:11px;color:var(--text-3)}
.ai-quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px;background:var(--surface-2)}
.ai-quick button{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--text-2)}
.ai-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px}
.ai-foot input{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:10px;outline:none;font-size:13px;background:var(--surface);color:var(--text)}
.ai-foot input:focus{border-color:var(--primary)}
.ai-foot button{width:38px;border-radius:10px;border:none;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center}

/* ============ 移动端 ============ */
@media (max-width:960px){
  .sidebar{display:none}
  .workspace{padding:16px 14px 32px}
}

/* ==================================================================
 * 科技感增强层（只在深色主题下生效，浅色 / 极简保持原样）
 * ================================================================== */
html[data-theme="dark"]{
  --bg:#070d1a;
  --bg-grad:radial-gradient(1100px 520px at 82% -12%, rgba(56,189,248,.18), transparent 62%),
            radial-gradient(900px 480px at 8% 108%, rgba(34,211,238,.10), transparent 60%),
            #070d1a;
  --surface:rgba(16,26,44,.86);
  --surface-2:rgba(22,34,58,.72);
  --surface-3:#1c2b47;
  --text:#eaf1fb; --text-2:#a9b9d0; --text-3:#8296b6;
  --primary:#38bdf8; --primary-strong:#2563eb; --primary-weak:rgba(56,189,248,.14);
  --accent:#2dd4bf; --accent-weak:rgba(45,212,191,.14);
  --border:rgba(64,92,138,.55); --border-strong:rgba(88,122,178,.75);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.42);
  --shadow-lg:0 10px 26px rgba(0,0,0,.5), 0 30px 80px rgba(0,0,0,.55);
  --gold:#e3c07a;
}
html[data-theme="premium"],html[data-theme="dark"] body{background:var(--bg-grad);position:relative}
/* 网格底纹（不挡点击）—— 天青蓝 */
html[data-theme="premium"],html[data-theme="dark"] body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(56,189,248,.055) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(56,189,248,.055) 1px, transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(1200px 700px at 50% 0%, #000 0%, transparent 85%);
}
/* 左上 / 右下两点柔和光晕，呼应登录页的星轨氛围 */
html[data-theme="premium"],html[data-theme="dark"] body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(760px 520px at 8% 12%, rgba(56,189,248,.10), transparent 62%),
    radial-gradient(620px 460px at 96% 92%, rgba(125,211,252,.07), transparent 60%);
}
html[data-theme="premium"],html[data-theme="dark"] .app{position:relative;z-index:1}

/* 侧边栏与品牌 */
html[data-theme="premium"],html[data-theme="dark"] .sidebar{
  background:linear-gradient(180deg, rgba(12,20,35,.95), rgba(9,15,28,.92));
  border-right:1px solid var(--border);
  box-shadow:12px 0 40px rgba(0,0,0,.35);
  backdrop-filter:blur(10px);
}
html[data-theme="premium"],html[data-theme="dark"] .brand-logo{
  box-shadow:0 8px 24px rgba(56,189,248,.45), inset 0 1px 0 rgba(255,255,255,.25);
}
html[data-theme="premium"],html[data-theme="dark"] .brand-name{letter-spacing:.3px}
html[data-theme="premium"],html[data-theme="dark"] .role-switch{background:rgba(7,13,26,.6);border-color:var(--border)}
html[data-theme="premium"],html[data-theme="dark"] .role-opt.active{
  background:linear-gradient(135deg, rgba(56,189,248,.22), rgba(34,211,238,.14));
  color:#cfe1ff;box-shadow:inset 0 0 0 1px rgba(56,189,248,.4), 0 2px 10px rgba(56,189,248,.18);
}
/* 导航选中态：左侧光条 + 渐变 */
html[data-theme="premium"],html[data-theme="dark"] .nav-item{position:relative;border-radius:10px}
html[data-theme="premium"],html[data-theme="dark"] .nav-item.active{
  background:linear-gradient(90deg, rgba(56,189,248,.20), rgba(56,189,248,.04));
  color:#cfe1ff;box-shadow:inset 0 0 0 1px rgba(56,189,248,.25);
}
html[data-theme="premium"],html[data-theme="dark"] .nav-item.active::before{
  content:"";position:absolute;left:0;top:18%;bottom:18%;width:3px;border-radius:3px;
  background:linear-gradient(180deg,#8ab4ff,#22d3ee);box-shadow:0 0 12px rgba(34,211,238,.7);
}
html[data-theme="premium"],html[data-theme="dark"] .sidebar-foot{border-top:1px solid var(--border)}

/* 顶栏：玻璃 + HUD */
html[data-theme="premium"],html[data-theme="dark"] .topbar{
  background:linear-gradient(180deg, rgba(12,20,35,.9), rgba(10,17,31,.78));
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(14px);
  box-shadow:0 8px 24px rgba(0,0,0,.28);
}
html[data-theme="premium"],html[data-theme="dark"] .icon-btn{background:rgba(22,34,58,.7);border:1px solid var(--border)}
html[data-theme="premium"],html[data-theme="dark"] .icon-btn:hover{border-color:rgba(56,189,248,.6);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
html[data-theme="premium"],html[data-theme="dark"] .icon-btn .dot{box-shadow:0 0 0 3px rgba(248,113,113,.25), 0 0 12px rgba(248,113,113,.8)}

.hud-chip{
  display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;
  border:1px solid var(--border);background:rgba(22,34,58,.65);
  font-size:11.5px;color:var(--text-2);font-family:ui-monospace,Consolas,monospace;letter-spacing:.5px;
}
.hud-chip .pulse{
  width:7px;height:7px;border-radius:50%;background:var(--success);
  box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}
  70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}
  100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}
}
/* 演示会话在别端时，只显示「返回演示账号」 */
.role-switch-host .role-back{
  margin:4px 0 8px;width:100%;padding:6px 8px;border-radius:99px;cursor:pointer;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font-size:12px;
}
.role-switch-host .role-back:hover{ border-color:var(--accent);color:var(--accent) }

/* 演示版标记（顶栏，独立于页面里的 .demo-tag 数据标签） */
.demo-ver{
  margin-left:8px;padding:3px 9px;border-radius:99px;font-size:11px;letter-spacing:.06em;
  color:var(--primary);border:1px solid var(--primary);
  background:var(--primary-weak);white-space:nowrap;user-select:none;
}
/* 当前登录账号（顶栏）：一眼看出现在是哪个身份在操作 */
.who-chip{
  margin-left:8px;padding:3px 9px;border-radius:99px;font-size:11px;
  color:var(--text-2);border:1px solid var(--border);background:var(--surface-2);
  white-space:nowrap;user-select:none;max-width:220px;overflow:hidden;text-overflow:ellipsis;
}
.who-chip.locked{ color:var(--text-3) }
.who-chip.switcher{ color:var(--accent);border-color:var(--accent) }

/* 卡片：玻璃 + 顶部微光 + 悬浮 */
html[data-theme="premium"],html[data-theme="dark"] .card{
  background:linear-gradient(180deg, rgba(20,32,54,.9), rgba(13,22,38,.92));
  border:1px solid var(--border);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter:blur(10px);
  transition:transform .2s, border-color .2s, box-shadow .2s;
}
html[data-theme="premium"],html[data-theme="dark"] .card:hover{
  border-color:rgba(56,189,248,.45);
  box-shadow:0 14px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
  transform:translateY(-1px);
}
html[data-theme="premium"],html[data-theme="dark"] .card-title .sub,html[data-theme="premium"],html[data-theme="dark"] .sub{color:var(--text-3)}

/* KPI：左侧光条 + 等宽渐变数字 */
html[data-theme="premium"],html[data-theme="dark"] .kpi{position:relative;overflow:hidden}
html[data-theme="premium"],html[data-theme="dark"] .kpi::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,#38bdf8,#22d3ee);opacity:.85;
}
html[data-theme="premium"],html[data-theme="dark"] .kpi::after{
  content:"";position:absolute;right:-40px;top:-60px;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle, rgba(56,189,248,.18), transparent 70%);
}
html[data-theme="premium"],html[data-theme="dark"] .kpi .k-num{
  font-family:ui-monospace,"SF Mono",Consolas,monospace;letter-spacing:-.5px;
  background:linear-gradient(120deg,#eaf1fb,#9fc2ff 60%,#7fe3ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
html[data-theme="premium"],html[data-theme="dark"] .kpi .k-num small{
  font-size:12px;font-family:inherit;letter-spacing:0;
  -webkit-text-fill-color:var(--text-3);color:var(--text-3);
}
html[data-theme="premium"],html[data-theme="dark"] .kpi .k-label{letter-spacing:.5px}
html[data-theme="premium"],html[data-theme="dark"] .kpi .k-foot{color:var(--text-3)}

/* 按钮：主按钮渐变 + 光泽 */
html[data-theme="premium"],html[data-theme="dark"] .btn-p{
  background:linear-gradient(135deg,#38bdf8,#2563eb 60%,#0ea5b7);
  border:1px solid rgba(122,170,255,.35);
  box-shadow:0 8px 22px rgba(37,99,235,.35), inset 0 1px 0 rgba(255,255,255,.25);
  position:relative;overflow:hidden;
}
html[data-theme="premium"],html[data-theme="dark"] .btn-p::after{
  content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-18deg);transition:left .45s;
}
html[data-theme="premium"],html[data-theme="dark"] .btn-p:hover::after{left:140%}
html[data-theme="premium"],html[data-theme="dark"] .btn-o{border-color:var(--border);background:rgba(22,34,58,.5)}
html[data-theme="premium"],html[data-theme="dark"] .btn-o:hover{border-color:rgba(56,189,248,.6);background:rgba(56,189,248,.1)}

/* 表格、进度、chip */
html[data-theme="premium"],html[data-theme="dark"] .table th{color:var(--text-3);border-bottom-color:var(--border);letter-spacing:.4px}
html[data-theme="premium"],html[data-theme="dark"] .table td{border-bottom-color:rgba(64,92,138,.35)}
html[data-theme="premium"],html[data-theme="dark"] .table tbody tr:hover{background:rgba(56,189,248,.06)}
html[data-theme="premium"],html[data-theme="dark"] .progress{background:rgba(7,13,26,.8);border:1px solid var(--border)}
html[data-theme="premium"],html[data-theme="dark"] .progress span{background:linear-gradient(90deg,#38bdf8,#22d3ee)}
html[data-theme="premium"],html[data-theme="dark"] .chip-s{box-shadow:0 0 14px rgba(74,222,128,.18)}
html[data-theme="premium"],html[data-theme="dark"] .chip-d{box-shadow:0 0 14px rgba(248,113,113,.18)}
html[data-theme="premium"],html[data-theme="dark"] .chip-w{box-shadow:0 0 14px rgba(240,180,41,.16)}
html[data-theme="premium"],html[data-theme="dark"] .demo-tag{background:rgba(74,222,128,.12);color:var(--success);border-color:rgba(74,222,128,.35)}

/* 视图切换入场 */
html[data-theme="premium"],html[data-theme="dark"] .view.active{animation:viewIn .34s ease both;opacity:1}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* AI 面板玻璃化 */
html[data-theme="premium"],html[data-theme="dark"] .ai-panel{
  background:linear-gradient(180deg, rgba(18,30,50,.97), rgba(11,19,33,.98));
  border:1px solid var(--border-strong);
  box-shadow:0 24px 70px rgba(0,0,0,.6);
  backdrop-filter:blur(16px);
}
html[data-theme="premium"],html[data-theme="dark"] .ai-head{border-bottom-color:var(--border)}
html[data-theme="premium"],html[data-theme="dark"] .msg.bot{background:rgba(22,34,58,.85)}

/* 滚动条 */
html[data-theme="premium"],html[data-theme="dark"] ::-webkit-scrollbar{width:9px;height:9px}
html[data-theme="premium"],html[data-theme="dark"] ::-webkit-scrollbar-track{background:transparent}
html[data-theme="premium"],html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:rgba(88,122,178,.45);border-radius:9px;border:2px solid transparent;background-clip:content-box}
html[data-theme="premium"],html[data-theme="dark"] ::-webkit-scrollbar-thumb:hover{background:rgba(122,160,222,.65);background-clip:content-box}

/* ============================================================
   浅色主题增强层（L1 蓝图工程）—— 与深色 49 条对位
   ============================================================ */
html[data-theme="light"] body{background:var(--bg-grad);position:relative}
/* 蓝图双层网格：细 44px + 粗 220px */
html[data-theme="light"] body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;

                   linear-gradient(90deg, rgba(37,99,235,.07) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(1400px 900px at 50% 0%, #000 0%, transparent 88%);
}
html[data-theme="light"] body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(37,99,235,.13) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(37,99,235,.13) 1px, transparent 1px);
  background-size:220px 220px;
  mask-image:radial-gradient(1400px 900px at 50% 0%, #000 0%, transparent 85%);
}
html[data-theme="light"] .app{position:relative;z-index:1}

}
/* 导航：选中态左侧光条（蓝图蓝） */

html[data-theme="light"] .nav-item:hover{background:#F4F7FC;color:var(--text)}
html[data-theme="light"] .nav-item.active{

}

}
html[data-theme="light"] .sidebar-foot{border-top:1px solid var(--border)}

/* 顶栏：白 + 下投影 */

}
html[data-theme="light"] .icon-btn{background:#F7FAFE;border:1px solid var(--border-2);color:var(--text-2)}
html[data-theme="light"] .icon-btn:hover{border-color:#2563EB;color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,.10)}
html[data-theme="light"] .icon-btn .dot{box-shadow:0 0 0 3px rgba(185,28,28,.15), 0 0 8px rgba(185,28,28,.45)}
html[data-theme="light"] .hud-chip{background:#F7FAFE;border-color:var(--border-2);color:var(--text-2)}

/* 卡片：白底 + 细内高光 + 悬浮 */

}

}
html[data-theme="light"] .card-title .sub,
html[data-theme="light"] .sub{color:var(--text-3)}

}

}

/* ============================================================
   消息中心 v2 · 三栏无缝布局（三主题适配）
   ============================================================ */
.view-msg{display:flex;flex-direction:column;height:calc(100vh - 60px);padding:0!important}
.vm-grid{
  display:grid;grid-template-columns:2.5fr 5fr 2.5fr;
  height:100%;min-height:0;overflow:hidden;
}
@media(max-width:1200px){.vm-grid{grid-template-columns:1fr}.vm-notices{display:none}}

/* 分栏：用 border 分隔，无缝 */
.vm-chats,.vm-chat,.vm-notices{display:flex;flex-direction:column;min-height:0;min-width:0}
.vm-chats{border-right:1px solid var(--border);background:var(--surface)}
.vm-notices{border-left:1px solid var(--border);background:var(--surface)}

/* ===== 左栏 ===== */
.vm-chats-hd,.vm-notices-hd{
  height:58px;flex:0 0 58px;display:flex;align-items:center;gap:9px;
  padding:0 16px;border-bottom:1px solid var(--border);
}
.vm-chats-hd h2,.vm-notices-hd h2{font-size:14.5px;font-weight:750;letter-spacing:.2px;margin:0}
.vm-unread-chip{
  font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;
  background:var(--primary-weak);color:var(--primary);
}
.vm-icon-btn{
  min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;white-space:nowrap;
  background:transparent;border:1px solid var(--border);color:var(--text-3);
  font-size:11px;font-family:inherit;padding:0 9px;transition:all .16s;
}
.vm-icon-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-weak)}

.vm-search{padding:12px 14px 8px;flex:0 0 auto}
.vm-search input{
  width:100%;padding:8px 12px;border-radius:9px;font-size:12.5px;font-family:inherit;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);outline:none;
  transition:border-color .16s,box-shadow .16s;
}
.vm-search input::placeholder{color:var(--text-3)}
.vm-search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak)}

.vm-conv-list{flex:1;overflow-y:auto;padding:0 8px 12px}
.view-msg .conv-item{
  display:flex;gap:10px;padding:10px 11px;border-radius:10px;cursor:pointer;
  transition:background .16s;position:relative;margin-bottom:2px;border:none;
}
.view-msg .conv-item:hover{background:var(--row-hover);border:none}
.view-msg .conv-item.on{background:var(--primary-weak);border:none}
.view-msg .conv-item.on::before{
  content:"";position:absolute;left:0;top:16%;bottom:16%;width:3px;border-radius:3px;
  background:var(--primary);
}
.view-msg .conv-av{
  width:36px;height:36px;flex:0 0 36px;border-radius:10px;display:grid;place-items:center;
  font-size:12.5px;font-weight:800;color:#fff;
}
.view-msg .conv-main{flex:1;min-width:0}
.view-msg .conv-name{font-size:12.5px;font-weight:650;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view-msg .conv-last{font-size:11px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== 中栏 ===== */
.view-msg .vm-chat-hd{
  height:58px;flex:0 0 58px;display:flex;align-items:center;gap:11px;
  padding:0 20px;border-bottom:1px solid var(--border);
}
.view-msg .vm-chat-hd .vm-av{
  width:32px;height:32px;flex:0 0 32px;border-radius:9px;display:grid;place-items:center;
  font-size:12px;font-weight:800;color:#fff;
}
.vm-chat-hd-main{min-width:0}
.vm-chat-hd-name{font-size:13.5px;font-weight:750;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vm-chat-hd-st{font-size:11px;color:var(--text-3);margin-top:1px;display:flex;align-items:center;gap:5px}
.vm-chat-hd-st i{width:6px;height:6px;border-radius:50%;background:var(--success);display:block}

.view-msg .vm-chat-body{
  flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;
  padding:20px;position:relative;
}
/* 空状态 */
.view-msg .vm-empty{
  margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;
  padding:24px;position:relative;overflow:visible;border:none;background:transparent;
}
.view-msg .vm-empty::before{
  content:"";position:absolute;left:50%;top:38%;width:460px;height:460px;margin:-230px 0 0 -230px;
  border-radius:50%;pointer-events:none;z-index:-1;
  background:radial-gradient(circle,var(--ai-glow),transparent 68%);
  filter:blur(42px);opacity:.5;animation:vmAiBreathe 6s ease-in-out infinite;
}
@keyframes vmAiBreathe{0%,100%{transform:scale(.94);opacity:.42}50%{transform:scale(1.08);opacity:.62}}
.vm-orb{position:relative;width:82px;height:82px;margin-bottom:22px;display:grid;place-items:center}
.vm-orb-ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--primary);opacity:.34}
.vm-orb-ring:nth-child(1){animation:vmOrbPulse 3.4s ease-out infinite}
.vm-orb-ring:nth-child(2){animation:vmOrbPulse 3.4s ease-out infinite 1.13s}
.vm-orb-ring:nth-child(3){animation:vmOrbPulse 3.4s ease-out infinite 2.26s}
@keyframes vmOrbPulse{0%{transform:scale(.62);opacity:.72}100%{transform:scale(1.72);opacity:0}}
.vm-orb-core{
  width:52px;height:52px;border-radius:50%;z-index:1;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  box-shadow:0 0 32px var(--ai-glow),inset 0 1px 0 rgba(255,255,255,.35);
}
.view-msg .vm-empty h3{font-size:18px;font-weight:800;margin:0 0 8px;color:var(--text)}
.view-msg .vm-empty p{font-size:12.5px;color:var(--text-2);max-width:400px;line-height:1.8;margin:0 0 22px}
.vm-quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:500px}
.vm-quick button{
  padding:7px 14px;border-radius:99px;font-size:12px;cursor:pointer;font-family:inherit;
  background:var(--surface-2);border:1px solid var(--border-2);color:var(--text-2);
  transition:all .18s;
}
.vm-quick button:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-weak);transform:translateY(-1px)}

/* 输入区 */
.view-msg .vm-chat-foot{flex:0 0 auto;padding:12px 20px 18px;border-top:1px solid var(--border)}
.view-msg .vm-inputwrap{
  display:flex;align-items:flex-end;gap:9px;padding:9px 9px 9px 15px;border-radius:13px;
  background:var(--surface-2);border:1px solid var(--border);transition:border-color .16s,box-shadow .16s;
}
.view-msg .vm-inputwrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak)}
.view-msg .vm-input{
  flex:1;border:none!important;outline:none;background:transparent!important;resize:none;
  font-family:inherit;font-size:13px;color:var(--text);line-height:1.6;max-height:96px;min-height:22px;
  padding:4px 0!important;box-shadow:none!important;
}
.view-msg .vm-input::placeholder{color:var(--text-3)}
.view-msg .vm-send{
  width:34px;height:34px;flex:0 0 34px;border-radius:9px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  display:grid;place-items:center;transition:opacity .16s,transform .16s;
  box-shadow:0 4px 14px var(--ai-glow);margin:0;
}
.view-msg .vm-send:hover:not(:disabled){opacity:.9;transform:translateY(-1px)}
.view-msg .vm-send:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

/* 消息气泡 */
.view-msg .msg-bubble{max-width:76%;padding:9px 13px;border-radius:12px;font-size:12.5px;line-height:1.7;margin-bottom:9px;word-break:break-word}
.view-msg .msg-bubble.me{align-self:flex-end;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#04121a;font-weight:500}
.view-msg .msg-bubble.other{align-self:flex-start;background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.view-msg .msg-meta{font-size:10px;color:var(--text-3);margin-bottom:3px}

/* ===== 右栏通知 ===== */
.vm-ntabs{display:flex;gap:4px;padding:11px 14px 9px;flex:0 0 auto}
.vm-ntab{
  flex:1;padding:6px 0;text-align:center;font-size:11.5px;font-weight:600;font-family:inherit;
  border-radius:7px;cursor:pointer;color:var(--text-3);border:1px solid transparent;background:transparent;
  transition:all .16s;
}
.vm-ntab:hover{color:var(--text-2);background:var(--row-hover)}
.vm-ntab.on{background:var(--primary-weak);color:var(--primary);border-color:var(--border-2);font-weight:700}

.view-msg .vm-notice-list{flex:1;overflow-y:auto;padding:2px 12px 12px}
.view-msg .vm-notice-list > *{border:none!important;background:transparent!important;box-shadow:none!important;margin-bottom:6px!important;padding:10px 12px 10px 14px!important;border-radius:0 8px 8px 0!important}
/* 竖彩条通知 */
.view-msg .notice-item{
  position:relative;padding:10px 12px 10px 14px;margin-bottom:6px;
  border-radius:0 8px 8px 0;background:transparent;cursor:pointer;
  transition:background .16s;border:none!important;
}
.view-msg .notice-item::before{
  content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;
  background:var(--primary);opacity:.9;
}
.view-msg .notice-item:hover{background:var(--row-hover)}
.view-msg .notice-item .nt-t{font-size:12px;font-weight:650;color:var(--text);margin-bottom:2px}
.view-msg .notice-item .nt-d{font-size:11px;color:var(--text-3);line-height:1.65}
.view-msg .notice-item .nt-meta{display:flex;align-items:center;gap:8px;margin-top:5px}
.view-msg .notice-item .nt-tag{
  font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;
  background:var(--primary-weak);color:var(--primary);
}
.view-msg .notice-item .nt-tm{font-size:10px;color:var(--text-3);margin-left:auto}

/* 顾问卡 */
.vm-advisor{flex:0 0 auto;margin:0 12px 12px;padding:12px 13px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border)}
.vm-advisor-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.vm-av-sm{width:34px;height:34px;flex:0 0 34px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.vm-advisor-nm{font-size:12.5px;font-weight:700;color:var(--text)}
.vm-advisor-st{font-size:10.5px;color:var(--text-3);margin-top:1px;display:flex;align-items:center;gap:4px}
.vm-advisor-st i{width:5px;height:5px;border-radius:50%;background:var(--success);display:block}
.vm-advisor-acts{display:flex;gap:6px}
.vm-advisor-acts .btn{flex:1;justify-content:center;padding:6px 0;font-size:11.5px}

/* ===== 三主题微调 ===== */
html[data-theme="light"] .vm-chats,html[data-theme="light"] .vm-notices{background:#fff}
html[data-theme="light"] .view-msg .conv-item.on{background:#EAF1FE}
html[data-theme="light"] .view-msg .conv-item.on::before{background:#2563EB}

html[data-theme="mono"] .vm-chats,html[data-theme="mono"] .vm-notices{background:#fff}
html[data-theme="mono"] .vm-chats{border-right:1px solid #111}
html[data-theme="mono"] .vm-notices{border-left:1px solid #111}
html[data-theme="mono"] .vm-chats-hd,html[data-theme="mono"] .vm-notices-hd,
html[data-theme="mono"] .view-msg .vm-chat-hd,html[data-theme="mono"] .view-msg .vm-chat-foot{border-color:#E5E5E5}
html[data-theme="mono"] .vm-unread-chip{border-radius:0;background:#111;color:#fff}
html[data-theme="mono"] .vm-search input,
html[data-theme="mono"] .view-msg .vm-inputwrap,
html[data-theme="mono"] .vm-quick button,
html[data-theme="mono"] .vm-ntab,
html[data-theme="mono"] .vm-advisor{border-radius:0}
html[data-theme="mono"] .view-msg .conv-item,
html[data-theme="mono"] .view-msg .conv-av,
html[data-theme="mono"] .view-msg .vm-chat-hd .vm-av,
html[data-theme="mono"] .vm-av-sm{border-radius:0}
html[data-theme="mono"] .view-msg .conv-item.on{background:#F0F0F0}
html[data-theme="mono"] .view-msg .conv-item.on::before{background:#111}
html[data-theme="mono"] .vm-ntab.on{background:#111;color:#fff;border-color:#111}
html[data-theme="mono"] .vm-orb-core{background:#111;box-shadow:none}
html[data-theme="mono"] .view-msg .vm-empty::before{display:none}
html[data-theme="mono"] .view-msg .vm-empty h3{font-weight:800;text-transform:uppercase;letter-spacing:.5px}
html[data-theme="mono"] .view-msg .vm-send{border-radius:0;background:#111;box-shadow:none}
html[data-theme="mono"] .view-msg .vm-bubble.me,
html[data-theme="mono"] .view-msg .msg-bubble.me{border-radius:0;background:#111;color:#fff}
html[data-theme="mono"] .view-msg .msg-bubble.other{border-radius:0;background:#F5F5F5;border:1px solid #E5E5E5}
html[data-theme="mono"] .view-msg .notice-item{border-radius:0}
html[data-theme="mono"] .view-msg .notice-item::before{border-radius:0;background:#111}
html[data-theme="mono"] .view-msg .notice-item .nt-tag{border-radius:0;background:#EDEDED;color:#111}
html[data-theme="mono"] .vm-advisor-acts .btn{border-radius:0}

/* ============================================================
   极简主题增强层（M2 白底极简）—— 与深色 49 条对位
   设计语言：直角 / 硬阴影 / 纯黑白 / 细线 / 无渐变无发光
   ============================================================ */
html[data-theme="mono"] body{background:#FAFAFA;position:relative}
/* 24px 网格 */
html[data-theme="mono"] body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,0,0,.05) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(0,0,0,.05) 1px, transparent 1px);
  background-size:24px 24px;
  mask-image:radial-gradient(1300px 860px at 50% 0%, #000 0%, transparent 86%);
}
html[data-theme="mono"] .app{position:relative;z-index:1}

/* 侧边栏：白 + 1px 黑边 */
html[data-theme="mono"] .sidebar{
  background:#FFFFFF;
  border-right:1px solid #111111;
  box-shadow:none;
}
html[data-theme="mono"] .brand-logo{
  background:#111;border-radius:12px;box-shadow:none;
}
html[data-theme="mono"] .brand-name{letter-spacing:.4px;color:#111;font-weight:800}
html[data-theme="mono"] .role-switch{background:#FAFAFA;border:1px solid #E5E5E5}
html[data-theme="mono"] .role-opt{color:#525252;border-radius:8px}
html[data-theme="mono"] .role-opt.active{
  background:#111;color:#fff;box-shadow:none;font-weight:700;
}
/* 导航：选中 = 黑底白字，无光条 */
html[data-theme="mono"] .nav-item{position:relative;border-radius:8px;color:#404040}
html[data-theme="mono"] .nav-item:hover{background:#F0F0F0;color:#111}
html[data-theme="mono"] .nav-item.active{
  background:#111;color:#fff;font-weight:700;box-shadow:none;
}
html[data-theme="mono"] .nav-item.active::before{content:none}
html[data-theme="mono"] .sidebar-foot{border-top:1px solid #E5E5E5}

/* 顶栏：白 + 1px 黑底线 */
html[data-theme="mono"] .topbar{
  background:#FFFFFF;
  border-bottom:1px solid #111;
  backdrop-filter:none;
  box-shadow:none;
}
html[data-theme="mono"] .icon-btn{background:#fff;border:1px solid #D4D4D4;border-radius:8px;color:#404040}
html[data-theme="mono"] .icon-btn:hover{border-color:#111;color:#111;box-shadow:none;background:#F5F5F5}
html[data-theme="mono"] .icon-btn .dot{background:#111;box-shadow:none}
html[data-theme="mono"] .hud-chip{background:#fff;border:1px solid #D4D4D4;border-radius:0;color:#404040}

/* 卡片：白 + 1px 细边，hover 硬阴影 */
html[data-theme="mono"] .card{
  background:#FFFFFF;
  border:1px solid #E5E5E5;
  box-shadow:none;
  transition:transform .18s, border-color .18s, box-shadow .18s;
}
html[data-theme="mono"] .card:hover{
  border-color:#111;
  box-shadow:4px 4px 0 0 #111;
  transform:translate(-1px,-1px);
}
html[data-theme="mono"] .card-title .sub,
html[data-theme="mono"] .sub{color:#8A8A8A}

/* KPI：左侧黑条 + 等宽黑数字 */
html[data-theme="mono"] .kpi{position:relative;overflow:hidden}
html[data-theme="mono"] .kpi::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#111;
}
html[data-theme="mono"] .kpi::after{content:none}
html[data-theme="mono"] .kpi .k-num{
  font-family:ui-monospace,"SF Mono",Consolas,monospace;letter-spacing:-.5px;
  background:none;-webkit-text-fill-color:#111;color:#111;
}
html[data-theme="mono"] .kpi .k-num small{
  font-size:12px;font-family:inherit;letter-spacing:0;
  -webkit-text-fill-color:#8A8A8A;color:#8A8A8A;
}
html[data-theme="mono"] .kpi .k-label{letter-spacing:.5px;color:#525252}
html[data-theme="mono"] .kpi .k-foot{color:#8A8A8A}

/* 按钮：黑底白字，hover 反色；无渐变无光泽 */
html[data-theme="mono"] .btn-p{
  background:#111;border:1px solid #111;color:#fff;
  box-shadow:none;position:relative;overflow:visible;border-radius:0;font-weight:700;
}
html[data-theme="mono"] .btn-p::after{content:none}
html[data-theme="mono"] .btn-p:hover{background:#000;box-shadow:3px 3px 0 0 #525252}
html[data-theme="mono"] .btn-o{border:1px solid #D4D4D4;background:#fff;color:#404040;border-radius:0}
html[data-theme="mono"] .btn-o:hover{border-color:#111;color:#111;background:#F5F5F5}

/* 表格 */
html[data-theme="mono"] .table th{color:#111;border-bottom:2px solid #111;letter-spacing:.4px;background:#FAFAFA;font-weight:700}
html[data-theme="mono"] .table td{border-bottom:1px solid #E5E5E5;color:#333}
html[data-theme="mono"] .table tbody tr:hover{background:#F5F5F5}
html[data-theme="mono"] .progress{background:#EDEDED;border:1px solid #D4D4D4;border-radius:0}
html[data-theme="mono"] .progress span{background:#111;border-radius:0}
html[data-theme="mono"] .chip-s{background:#111;color:#fff;box-shadow:none;border-radius:0}
html[data-theme="mono"] .chip-d{background:#fff;color:#111;border:1px solid #111;box-shadow:none;border-radius:0}
html[data-theme="mono"] .chip-w{background:#EDEDED;color:#111;box-shadow:none;border-radius:0}
html[data-theme="mono"] .demo-tag{background:#EDEDED;color:#111;border-color:#D4D4D4;border-radius:0}

/* 视图切换 */
html[data-theme="mono"] .view.active{animation:viewInM .24s ease both;opacity:1}
@keyframes viewInM{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* AI 面板 */
html[data-theme="mono"] .ai-panel{
  background:#FFFFFF;
  border:1px solid #111;
  box-shadow:6px 6px 0 0 rgba(17,17,17,.12);
  backdrop-filter:none;
}
html[data-theme="mono"] .ai-head{border-bottom:1px solid #E5E5E5}
html[data-theme="mono"] .msg.bot{background:#F5F5F5;color:#111;border:1px solid #E5E5E5}

/* 滚动条 */
html[data-theme="mono"] ::-webkit-scrollbar{width:10px;height:10px}
html[data-theme="mono"] ::-webkit-scrollbar-track{background:#FAFAFA}
html[data-theme="mono"] ::-webkit-scrollbar-thumb{background:#BDBDBD;border-radius:0;border:2px solid #FAFAFA;background-clip:content-box}
html[data-theme="mono"] ::-webkit-scrollbar-thumb:hover{background:#8A8A8A;background-clip:content-box}

/* ============================================================
   补充：筛选 chip / 输入框 / 空状态 在三套主题下的统一
   ============================================================ */

/* ---- 浅色 ---- */
html[data-theme="light"] .mt-fchips .chip{
  background:#F4F7FC;border:1px solid var(--border-2);color:var(--text-2);border-radius:99px;
}
html[data-theme="light"] .mt-fchips .chip:hover{border-color:#2563EB;color:#1D4FD7;background:#F5F9FF}
html[data-theme="light"] .mt-fchips .chip.on{
  background:#E8F0FE;border-color:#2563EB;color:#1D4FD7;font-weight:700;
  box-shadow:inset 0 0 0 1px rgba(37,99,235,.2);
}
html[data-theme="light"] .mt-field input,
html[data-theme="light"] .mt-field select,
html[data-theme="light"] .search input{
  background:#fff;border:1px solid var(--border-2);color:var(--text);
}
html[data-theme="light"] .mt-field input:focus,
html[data-theme="light"] .search input:focus{
  border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,.12);
}
html[data-theme="light"] .chip{background:#F0F4FA;color:var(--text-2)}
html[data-theme="light"] .hp-empty-ico{opacity:.7}

/* ---- 极简：直角、黑白、细线 ---- */
html[data-theme="mono"] .mt-fchips .chip{
  background:#fff;border:1px solid #D4D4D4;color:#404040;border-radius:0;
}
html[data-theme="mono"] .mt-fchips .chip:hover{border-color:#111;color:#111;background:#F5F5F5}
html[data-theme="mono"] .mt-fchips .chip.on{
  background:#111;border-color:#111;color:#fff;font-weight:700;box-shadow:none;
}
html[data-theme="mono"] .mt-field input,
html[data-theme="mono"] .mt-field select,
html[data-theme="mono"] .search input{
  background:#fff;border:1px solid #D4D4D4;color:#111;border-radius:0;
}
html[data-theme="mono"] .mt-field input:focus,

/* ---------- 自动演示（Tour） ---------- */
.tour-bar{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);
  width:min(900px,94vw);z-index:80;display:flex;align-items:center;gap:14px;
  padding:14px 18px;border-radius:16px;
  background:linear-gradient(180deg, rgba(20,32,54,.97), rgba(11,19,33,.98));
  border:1px solid rgba(88,122,178,.75);
  box-shadow:0 24px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
}
.tour-bar.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.tour-bar::before{
  content:"";position:absolute;left:0;right:0;top:0;height:2px;border-radius:16px 16px 0 0;
  background:linear-gradient(90deg,transparent,#38bdf8,#22d3ee,transparent);
}
.tour-led{
  width:10px;height:10px;border-radius:50%;flex:0 0 10px;background:#4ade80;
  box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:pulse 2s infinite;
}
.tour-main{flex:1;min-width:0}
.tour-title{font-size:13.5px;font-weight:700;color:#eaf1fb;display:flex;align-items:center;gap:8px}
.tour-title .step{
  font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#7fe3ff;
  border:1px solid rgba(34,211,238,.35);border-radius:99px;padding:1px 8px;background:rgba(34,211,238,.08);
}
.tour-desc{font-size:12px;color:#a9b9d0;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tour-bar .track{position:absolute;left:18px;right:18px;bottom:6px;height:2px;border-radius:2px;background:rgba(88,122,178,.25);overflow:hidden}
.tour-bar .track span{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#38bdf8,#22d3ee);transition:width .4s ease}
.arc-line{animation:arcflow 1.8s linear infinite}
@keyframes arcflow{to{stroke-dashoffset:-9.2}}

/* ============================================================
   薪酬与结算 v2（三主题适配）
   ============================================================ */
.view-sal{padding:22px 24px 40px!important}
.vs-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vs-head h1{font-size:21px;font-weight:800;letter-spacing:-.3px;margin:0}
.vs-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.vs-rate{
  margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:99px;background:var(--primary-weak);
  border:1px solid var(--border-2);font-size:10.5px;font-weight:700;
  color:var(--primary);font-family:ui-monospace,monospace;white-space:nowrap;
}
.vs-rate i{width:6px;height:6px;border-radius:50%;background:var(--success);display:block;animation:vsBlink 2s infinite}
@keyframes vsBlink{0%,100%{opacity:1}50%{opacity:.3}}
.vs-rate-sm{font-size:10px;padding:2px 8px}

/* KPI */
.vs-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
@media(max-width:900px){.vs-kpis{grid-template-columns:1fr}}
.vs-kpi{
  position:relative;overflow:hidden;padding:16px 18px;border-radius:13px;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow);transition:border-color .2s,transform .2s;
}
.vs-kpi:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.vs-kpi::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--primary),var(--primary-2));opacity:.9;
}
.vs-kpi::after{
  content:"";position:absolute;right:-42px;top:-58px;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,var(--primary-weak),transparent 70%);
}
.vs-kpi .kl{font-size:11.5px;color:var(--text-3);margin-bottom:7px}
.vs-kpi .kn{
  font-size:26px;font-weight:800;letter-spacing:-.8px;line-height:1.15;
  font-family:ui-monospace,"SF Mono",Consolas,monospace;
  background:linear-gradient(120deg,var(--text),var(--primary) 70%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.vs-kpi .kn small{font-size:11.5px;font-family:inherit;letter-spacing:0;-webkit-text-fill-color:var(--text-3)}
.vs-kpi .kf{font-size:10.5px;color:var(--text-3);margin-top:5px}
.vs-kpi .kf .up{color:var(--success);font-weight:700}

/* 主栅格 */
.vs-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
@media(max-width:1080px){.vs-grid{grid-template-columns:1fr}}
.vs-card{padding:0!important;overflow:hidden}
.vs-card-hd{
  display:flex;align-items:center;gap:9px;padding:13px 18px;
  border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.vs-card-hd h2{font-size:13.5px;font-weight:750;margin:0}
.vs-card-hd .sub{font-size:11px;color:var(--text-3)}
.vs-card-hd .chart-switch{margin-left:auto}

/* 图表 */
.view-sal .chart-wrap{padding:16px 18px 10px}
.view-sal .chart-wrap svg{display:block;width:100%;height:auto}
.view-sal .chart-btn{
  padding:4px 11px;font-size:11px;border-radius:7px;font-family:inherit;
  background:transparent;border:1px solid transparent;color:var(--text-3);
  cursor:pointer;transition:all .16s;
}
.view-sal .chart-btn.on{background:var(--primary);color:var(--glyph-on,#04121a);font-weight:700}
.view-sal .chart-switch{display:flex;gap:2px;padding:3px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border)}

/* 工资构成 */
.vs-rows{padding:2px 18px 8px}
.view-sal .vs-detail td{padding:9px 0!important;font-size:12.5px;border-bottom:1px solid var(--border)}
.view-sal .vs-detail tr:last-child td{border-bottom:none;font-weight:800;color:var(--primary);font-size:13.5px}
/* AI 洞察 */
.vs-ai{
  margin:4px 18px 16px;padding:11px 13px;border-radius:10px;
  background:linear-gradient(135deg,var(--primary-weak),transparent);
  border:1px solid var(--border-2);border-left:3px solid var(--primary);
  display:flex;gap:9px;align-items:flex-start;
}
.vs-ai-ico{flex:0 0 18px;font-size:12px;line-height:1.5}
.vs-ai-tx{font-size:12px;line-height:1.7;color:var(--text-2)}
.vs-ai-tx b{color:var(--text);font-weight:700}

/* 汇款时间轴 */
.vs-flow{padding:16px 18px 8px}
.vs-tl{position:relative;padding-left:24px}
.vs-tl::before{
  content:"";position:absolute;left:6px;top:6px;bottom:20px;width:2px;
  background:linear-gradient(180deg,var(--primary),var(--primary-weak));
}
.vs-step{position:relative;padding-bottom:18px}
.vs-step:last-child{padding-bottom:2px}
.vs-dot{
  position:absolute;left:-24px;top:3px;width:14px;height:14px;border-radius:50%;
  background:var(--bg);border:2px solid var(--text-3);
}
.vs-step.done .vs-dot{border-color:var(--primary);background:var(--primary);box-shadow:0 0 0 3px var(--bg),0 0 12px var(--primary)}
.vs-step.cur .vs-dot{
  border-color:var(--primary);background:var(--bg);
  box-shadow:0 0 0 4px var(--primary-weak);animation:vsCurPulse 2s ease-in-out infinite;
}
@keyframes vsCurPulse{0%,100%{box-shadow:0 0 0 4px var(--primary-weak)}50%{box-shadow:0 0 0 8px transparent}}
.vs-step .t{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:2px}
.vs-step.pend .t{color:var(--text-3)}
.vs-step .d{font-size:11px;color:var(--text-3);line-height:1.6}

/* 保险 */
.vs-ins{padding:16px 18px 18px}
.vs-ins-top{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.vs-ins-ico{
  width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:grid;place-items:center;
  background:var(--primary-weak);border:1px solid var(--border-2);color:var(--primary);
}
.vs-ins-top .nm{font-size:12.5px;font-weight:700;color:var(--text)}
.vs-ins-top .st{font-size:10.5px;color:var(--success);font-weight:650;margin-top:1px}
.vs-ins-rows{display:flex;flex-direction:column}
.vs-ins-row{display:flex;font-size:11.5px;padding:6px 0;border-bottom:1px dashed var(--border)}
.vs-ins-row:last-child{border-bottom:none}
.vs-ins-row .k{color:var(--text-3);flex:0 0 76px}
.vs-ins-row .v{color:var(--text);font-weight:600;font-family:ui-monospace,monospace}

/* ===== 三主题微调 ===== */
html[data-theme="light"] .vs-kpi{background:#fff}
html[data-theme="light"] .view-sal .chart-btn.on{background:#2563EB;color:#fff}
html[data-theme="light"] .vs-ai{background:linear-gradient(135deg,#EFF5FF,transparent)}

html[data-theme="mono"] .view-sal .vs-kpi{background:#fff;border:1px solid #E5E5E5;box-shadow:none;border-radius:0}
html[data-theme="mono"] .view-sal .vs-kpi::before{background:#111}
html[data-theme="mono"] .view-sal .vs-kpi::after{display:none}
html[data-theme="mono"] .view-sal .vs-kpi .kn{background:none;-webkit-text-fill-color:#111;color:#111}
html[data-theme="mono"] .view-sal .vs-card{border-radius:0;border:1px solid #E5E5E5}
html[data-theme="mono"] .view-sal .vs-rate{border-radius:0;background:#fff;border-color:#111;color:#111}
html[data-theme="mono"] .view-sal .chart-switch{border-radius:0;background:#fff;border-color:#D4D4D4}
html[data-theme="mono"] .view-sal .chart-btn{border-radius:0}
html[data-theme="mono"] .view-sal .chart-btn.on{background:#111;color:#fff}
html[data-theme="mono"] .view-sal .vs-ai{border-radius:0;background:#F5F5F5;border:1px solid #111;border-left:3px solid #111}
html[data-theme="mono"] .view-sal .vs-ins-ico{border-radius:0;background:#fff;border-color:#111;color:#111}
html[data-theme="mono"] .view-sal .vs-dot{border-radius:0}
html[data-theme="mono"] .view-sal .vs-tl::before{background:#111;width:1px}
html[data-theme="mono"] .view-sal .vs-step.done .vs-dot{background:#111;border-color:#111;box-shadow:none}
html[data-theme="mono"] .view-sal .vs-step.cur .vs-dot{box-shadow:none;border-color:#111;animation:none}


/* ============================================================
   出海知识库 v2 · 发光搜索 + 分类 Tab + 卡片 Hover
   ============================================================ */
.view-know .kb-searchwrap{position:relative;display:block;width:100%;max-width:680px;margin:0 0 14px}
.view-know .kb-searchwrap::before{
  content:"";position:absolute;inset:-2px;border-radius:15px;z-index:-1;
  background:linear-gradient(120deg,var(--primary),var(--primary-2));
  opacity:.28;filter:blur(13px);transition:opacity .25s,filter .25s;
}
.view-know .kb-searchwrap:focus-within::before{opacity:.75;filter:blur(19px)}
.view-know .kb-searchbox{
  display:flex;align-items:center;gap:11px;padding:5px 5px 5px 17px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border-strong);
  transition:border-color .2s;
}
.view-know .kb-searchwrap:focus-within .kb-searchbox{border-color:var(--primary)}
.view-know .kb-spark{
  width:24px;height:24px;flex:0 0 24px;border-radius:7px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  box-shadow:0 0 14px var(--ai-glow);animation:kbSparkPulse 3.6s ease-in-out infinite;
}
@keyframes kbSparkPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.85}}
.view-know .kb-searchbox input{
  flex:1 1 auto;min-width:120px;border:none;outline:none;background:transparent;font-family:inherit;
  font-size:13.5px;color:var(--text);padding:10px 0;
}
.view-know .kb-searchbox input::placeholder{color:var(--text-3)}
.view-know .kb-searchgo{
  flex:0 0 auto;min-width:84px;padding:9px 18px;border:none;border-radius:10px;cursor:pointer;font-family:inherit;white-space:nowrap;
  background:var(--primary);
  background-image:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#04121a;font-size:12.5px;font-weight:800;-webkit-text-fill-color:#04121a;
  box-shadow:0 4px 16px var(--ai-glow);transition:transform .16s,opacity .16s;
}
.view-know .kb-searchgo:hover{transform:translateY(-1px);opacity:.92}

/* 分类 Tab */
.view-know .kb-tabs{display:flex!important;width:100%;gap:7px;margin-bottom:18px;flex-wrap:wrap}
.view-know .kb-tab{
  padding:7px 17px;border-radius:99px;font-size:12px;font-weight:650;cursor:pointer;font-family:inherit;white-space:nowrap;line-height:1.5;
  background:transparent;border:1px solid var(--border);color:var(--text-2);transition:all .18s;
}
.view-know .kb-tab:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-weak)}
.view-know .kb-tab.on{
  background:var(--primary);
  background-image:linear-gradient(135deg,var(--primary),var(--primary-2));
  border-color:transparent;color:#04121a;font-weight:800;box-shadow:0 4px 16px var(--ai-glow);
  -webkit-text-fill-color:#04121a;
}

/* 卡片 Hover 强化 */
.view-know .kb-grid-main{gap:14px}
.view-know .kb-card{
  transition:transform .24s cubic-bezier(.2,.8,.3,1),border-color .24s,box-shadow .24s;
  position:relative;overflow:hidden;
}
.view-know .kb-card::before{
  content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,var(--primary),var(--primary-2));
  opacity:0;transition:opacity .24s;
}
.view-know .kb-card:hover{
  transform:translateY(-3px);
  border-color:var(--primary)!important;
  box-shadow:0 16px 40px rgba(0,0,0,.4),0 0 0 1px var(--primary),0 0 28px var(--ai-glow)!important;

.view-know .kb-card:hover::before{opacity:1}

/* ============================================================
   我的档案 v2 · Hover 变输入 + 进度条 + 材料清单
   ============================================================ */
.view-profile .pf-complete{
  display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:12px;

}
.view-profile .pf-complete .lbl{font-size:12px;color:var(--text-2);font-weight:600;flex:0 0 auto}

}
.view-profile .pf-bar i{

  background:linear-gradient(90deg,var(--primary),var(--primary-2));

.view-profile .pf-tip b{color:var(--warning)}

/* Hover 变输入的行 */
.view-profile .pf-row{

}
.view-profile .pf-row:hover{background:var(--row-hover)}

.view-profile .pf-row:hover .v{background:var(--surface-2);border-color:var(--border-2)}

.view-profile .pf-file .fn{flex:1;min-width:0}
.view-profile .pf-file .fn .t{display:block;font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view-profile .pf-file .fn .m{display:block;font-size:10.5px;color:var(--text-3);margin-top:1px}
.view-profile .pf-file .bg{

}
.view-profile .pf-file:hover .bg{opacity:0}
